<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d8cbae" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141821" media="(prefers-color-scheme: dark)" />
    <title>نشست · طرح کلی اندیشۀ اسلامی در قرآن · انسان ۲۵۰ ساله</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // The theme before first paint: no flash of the wrong paper.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "dark" && theme !== "light") {
          theme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      /* The Books' non-embedded Iranian fonts, substituted with the
         vendored Vazirmatn under their ORIGINAL family names: pdf.js's
         canvas draws those pages with ctx.font = '"wNazanin", …' — the
         family must resolve, or the text shatters (no shaping). */
      @font-face {
        font-family: "wNazanin";
        src: url("/vendor/fonts/Vazirmatn-Regular.woff2") format("woff2");
        font-weight: normal;
      }
      @font-face {
        font-family: "wNazanin";
        src: url("/vendor/fonts/Vazirmatn-Bold.woff2") format("woff2");
        font-weight: bold;
      }
      @font-face {
        font-family: "Nazanin";
        src: url("/vendor/fonts/Vazirmatn-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "B Nazanin";
        src: url("/vendor/fonts/Vazirmatn-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "IRANSharp";
        src: url("/vendor/fonts/Vazirmatn-Regular.woff2") format("woff2");
        font-weight: normal;
      }
      @font-face {
        font-family: "IRANSharp";
        src: url("/vendor/fonts/Vazirmatn-Bold.woff2") format("woff2");
        font-weight: bold;
      }
      @font-face {
        font-family: "IRANSharp-Light";
        src: url("/vendor/fonts/Vazirmatn-Light.woff2") format("woff2");
      }
      @font-face {
        font-family: "IRANSans";
        src: url("/vendor/fonts/Vazirmatn-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "IRANSansLight";
        src: url("/vendor/fonts/Vazirmatn-Light.woff2") format("woff2");
      }

      /* ===== Tokens: the paper identity, light and dark (ADR-0014).
         v2 «دفترِ نسخ» — the operator-approved journey-prototype
         palette (#39, 2026-09-21): parchment sheets on a walnut desk,
         lapis actions, gold illumination; dark = the night manuscript.
         Variable names unchanged (--clay now holds the lapis); --gold
         is new. The manual toggle only flips data-theme; system
         preference is the default when no stored choice exists. */
      :root {
        --bg: #d8cbae;
        --surface: #f3ead6;
        --raised: #faf4e6;
        --rule: #cdbf9f;
        --ink: #2e2417;
        --mute: #6d5e48;
        --clay: #1f4a78;
        --clay-soft: rgba(31, 74, 120, 0.1);
        --gold: #a67c2e;
        --gold-soft: rgba(166, 124, 46, 0.16);
        --ok: #3e6b4f;
        --bad: #9c3529;
        --bad-soft: rgba(156, 53, 41, 0.08);
        --focus: #8a6a2a;
        --shadow: rgba(46, 36, 24, 0.22);
        --backdrop: rgba(28, 20, 10, 0.5);
      }

      :root[data-theme="dark"] {
        --bg: #141821;
        --surface: #1e242e;
        --raised: #273040;
        --rule: #3e4757;
        --ink: #eae1c9;
        --mute: #a9997c;
        --clay: #7ea6d6;
        --clay-soft: rgba(126, 166, 214, 0.13);
        --gold: #c9a355;
        --gold-soft: rgba(201, 163, 85, 0.18);
        --ok: #7fb091;
        --bad: #d98a7c;
        --bad-soft: rgba(217, 138, 124, 0.12);
        --focus: #c9a355;
        --shadow: rgba(0, 0, 0, 0.55);
        --backdrop: rgba(4, 7, 12, 0.62);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #101c1f;
          --surface: #18292d;
          --raised: #20343a;
          --rule: #3a5054;
          --ink: #e6eae0;
          --mute: #9fb2a8;
          --clay: #d9743a;
          --clay-soft: rgba(217, 116, 58, 0.16);
          --ok: #6cb28d;
          --bad: #d68f8f;
          --bad-soft: rgba(214, 143, 143, 0.12);
          --focus: #8ec4de;
          --shadow: rgba(0, 0, 0, 0.5);
          --backdrop: rgba(4, 8, 8, 0.55);
        }
      }

      * {
        box-sizing: border-box;
      }

      /* A stray wide child never drags the whole sheet sideways again —
         clip is not a scroll container, so the sticky topbar keeps
         working (the 320px audit's cut-off page). */
      @supports (overflow: clip) {
        html {
          overflow-x: clip;
        }
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: Vazirmatn, Tahoma, "Segoe UI", sans-serif;
        /* the paper-grain wash, layered over the desk color */
        background: repeating-linear-gradient(
            0deg,
            transparent 0 2px,
            rgba(110, 80, 30, 0.02) 2px 3px
          ),
          repeating-linear-gradient(
            90deg,
            transparent 0 3px,
            rgba(110, 80, 30, 0.015) 3px 4px
          ),
          var(--bg);
        color: var(--ink);
      }

      button {
        font: inherit;
        font-weight: 700;
        color: var(--surface);
        background: var(--ink);
        border: 0;
        padding: 0.5rem 1.2rem;
        cursor: pointer;
        border-radius: 8px;
      }

      button:hover:not(:disabled) {
        background: var(--clay);
      }

      button:focus-visible,
      textarea:focus-visible,
      input:focus-visible,
      a:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      /* ===== The shell: sidebar + main column (ADR-0014). Below 1024px
         the «فهرست نشست‌ها» rides off-canvas as a drawer; the names are
         the DRAFT platform names pinned to constants in the script. */
      .shell {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      #session-list {
        position: fixed;
        z-index: 50;
        top: 0;
        bottom: 0;
        inset-inline-start: 0;
        width: min(19rem, 85vw);
        background: var(--surface);
        border-inline-end: 1px solid var(--rule);
        transform: translateX(100%);
        transition: transform 0.22s ease;
        visibility: hidden;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        padding: 0.9rem 0.8rem;
      }

      .shell.sl-open #session-list {
        transform: none;
        visibility: visible;
        box-shadow: 0 0 60px var(--shadow);
      }

      @media (min-width: 1024px) {
        .shell {
          display: grid;
          grid-template-columns: 18.5rem minmax(0, 1fr);
        }

        #session-list {
          position: sticky;
          top: 0;
          height: 100dvh;
          transform: none;
          transition: none;
          visibility: visible;
          box-shadow: none;
        }

        #sl-backdrop {
          display: none !important;
        }

        #sl-close,
        #sl-toggle {
          display: none;
        }
      }

      #sl-backdrop {
        position: fixed;
        inset: 0;
        z-index: 45;
        background: var(--backdrop);
      }

      #sl-backdrop[hidden] {
        display: none;
      }

      .sl-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .sl-title {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .icon-btn {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--rule);
        padding: 0.3rem 0.65rem;
        font-size: 0.85rem;
        font-weight: 500;
      }

      .icon-btn:hover:not(:disabled) {
        background: var(--clay);
        border-color: var(--clay);
        color: var(--surface);
      }

      .new-session-btn {
        width: 100%;
        padding: 0.6rem 1rem;
      }

      .session-items {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .session-item {
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 0.5rem 0.7rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .session-item.active {
        background: var(--raised);
        border-color: var(--rule);
      }

      .session-item:not(.active) {
        cursor: pointer;
      }

      .session-item:hover {
        border-color: var(--rule);
      }

      .session-item-del {
        align-self: flex-start;
        font-size: 0.68rem;
        padding: 0 0.45rem;
        border-color: transparent;
        background: transparent;
        color: var(--mute);
        opacity: 0;
      }

      .session-item:hover .session-item-del,
      .session-item-del:focus-visible {
        opacity: 1;
        border-color: var(--rule);
      }

      /* A finger has no hover: the delete never hides on a touch
         surface — an invisible control is undiscoverable and an
         accident waiting (the touch audit). */
      @media (pointer: coarse) {
        .session-item-del {
          opacity: 1;
        }
      }

      .session-item-del:hover {
        color: var(--bad);
        border-color: var(--bad);
      }

      /* The unanswered tail's card on a resumed sitting */
      .unanswered {
        border: 1px dashed var(--gold);
        border-radius: 12px;
        background: var(--gold-soft);
        padding: 0.7rem 1rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .unanswered-note {
        margin: 0;
        font-size: 0.82rem;
        color: var(--mute);
        flex: 1;
      }

      .session-item-title {
        font-size: 0.86rem;
        font-weight: 500;
        line-height: 1.7;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .session-item-meta {
        font-size: 0.72rem;
        color: var(--mute);
      }

      .main-col {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        flex: 1;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 0.55rem;
        padding-block: max(0.55rem, env(safe-area-inset-top)) 0.55rem;
        padding-inline: max(0.9rem, env(safe-area-inset-right))
          max(0.9rem, env(safe-area-inset-left));
        background: var(--surface);
        border-bottom: 1px solid var(--rule);
      }

      /* The end-side controls ride as one group on the desk grid; below
         1024px the group dissolves (display: contents) so the buttons
         wrap under the title as a row instead of dragging the bar
         sideways (the 320px audit's overflow). */
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 0.55rem;
      }

      .session-head {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
      }

      h1#session-title {
        margin: 0;
        font-size: 0.98rem;
        font-weight: 700;
        line-height: 1.7;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 44vw;
      }

      .book-chip {
        font-size: 0.72rem;
        font-weight: 500;
        border: 1px solid var(--rule);
        border-radius: 999px;
        padding: 0.1rem 0.6rem;
        color: var(--mute);
        white-space: nowrap;
      }

      .topbar .spacer,
      .composer-row .spacer {
        flex: 1;
      }

      p.status {
        margin: 0;
        font-size: 0.78rem;
        color: var(--mute);
        white-space: nowrap;
      }

      p.status[data-state="up"],
      p.status[data-state="live"] {
        color: var(--ok);
      }

      p.status[data-state="down"] {
        color: var(--bad);
      }

      .browse-btn {
        font-size: 0.8rem;
        font-weight: 500;
        padding: 0.4rem 1rem;
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--rule);
        text-decoration: none;
        display: inline-block;
      }

      .browse-btn:hover:not(:disabled) {
        background: var(--clay);
        border-color: var(--clay);
        color: var(--surface);
      }

      #sl-toggle {
        flex: none;
      }

      /* ===== The thread. */
      .thread {
        flex: 1;
        width: 100%;
        max-width: 46rem;
        margin-inline: auto;
        padding: 1.4rem 1.1rem 2.2rem;
      }

      body.research-open .thread {
        max-width: 58rem;
      }

      .thread-list {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
      }

      .thread-list[hidden] {
        display: none;
      }

      .msg-user-row {
        display: flex;
        justify-content: flex-end;
      }

      .msg-user {
        max-width: 85%;
        background: var(--clay-soft);
        border-radius: 12px 12px 12px 3px;
        padding: 0.5rem 0.95rem;
      }

      .msg-user p {
        margin: 0;
        line-height: 1.85;
      }

      .msg-assistant {
        border-inline-start: 3px solid var(--gold);
        padding-inline-start: 0.95rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        position: relative;
      }
      .msg-assistant::after {
        /* the stacked sheet peeking under the assistant's paper */
        content: "";
        position: absolute;
        inset-inline: 0.75rem;
        bottom: -0.4rem;
        height: 0.4rem;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-top: none;
        border-radius: 0 0 10px 10px;
        z-index: -1;
      }

      /* The phase markers: the tabs' replacement — quiet chips riding
         the article, the running one pulsing, the settled ones frozen
         with their completion time. */
      .phase-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .phase-mark {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.76rem;
        font-weight: 500;
        color: var(--mute);
        border: 1px solid var(--rule);
        border-radius: 999px;
        padding: 0.14rem 0.65rem;
        background: transparent;
      }

      .phase-mark .phase-dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: var(--rule);
        flex: none;
      }

      .phase-mark[data-state="running"] {
        color: var(--ink);
        border-color: var(--clay);
      }

      .phase-mark[data-state="running"] .phase-dot {
        background: var(--clay);
        animation: composer-pulse 1.2s ease-in-out infinite;
      }

      .phase-mark[data-state="ready"] .phase-dot {
        background: var(--clay);
        opacity: 0.55;
      }

      .phase-mark[data-state="done"] .phase-dot {
        background: var(--ok);
      }

      .phase-mark[data-state="failed"] .phase-dot {
        background: var(--bad);
      }

      .phase-mark[data-state="skipped"] .phase-dot {
        background: var(--mute);
      }

      .phase-timer {
        color: var(--mute);
        font-size: 0.72rem;
        font-weight: 500;
        direction: ltr;
        unicode-bidi: isolate;
      }

      .phase-mark[data-state="running"] .phase-timer {
        color: var(--clay);
      }

      p.phase-now {
        margin: 0;
        color: var(--clay);
        font-size: 0.83rem;
      }

      p.phase-now::before {
        content: "●";
        margin-left: 0.45rem;
        animation: composer-pulse 1.2s ease-in-out infinite;
      }

      .ask-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.9rem;
        color: var(--mute);
        font-size: 0.76rem;
      }

      .elapsed {
        color: var(--mute);
        font-size: 0.76rem;
      }

      @keyframes composer-pulse {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }

      /* ===== The ask's rendered bodies: Quote selection, Evidence pool,
         Quoted answer — the guard's clay quotes and the pool stay
         exactly the contract they were (ADR-0006/0007/0010). */
      .answer,
      .cite,
      .empty,
      .error {
        white-space: pre-wrap;
        line-height: 1.85;
      }

      .answer {
        font-size: 0.95rem;
      }

      .empty {
        color: var(--mute);
      }

      .error {
        color: var(--bad);
      }

      .cite {
        margin: 0 0 0.6rem;
        padding: 0 0.9rem 0 0;
        border-right: 3px solid var(--clay);
        color: var(--mute);
        cursor: pointer;
        font-size: 0.88rem;
      }

      .cite:hover {
        color: var(--ink);
      }

      .composer-status {
        margin: 0.4rem 0 0;
        color: var(--mute);
        font-size: 0.85rem;
      }

      .composer-status::before {
        content: "●";
        margin-left: 0.45rem;
        color: var(--clay);
        animation: composer-pulse 1.2s ease-in-out infinite;
      }

      .composer-truncated {
        margin: 0 0 0.85rem;
        color: var(--clay);
        font-size: 0.8rem;
        white-space: pre-wrap;
      }

      .doc-heading {
        margin: 1.1rem 0 0.4rem;
        font-size: 1.02rem;
        font-weight: 700;
      }

      .doc-para {
        margin: 0 0 0.85rem;
      }

      .cite-pages {
        color: var(--mute);
        font-size: 0.78rem;
        font-weight: 500;
      }

      .cite-sent {
        position: relative;
        cursor: pointer;
        background: var(--clay-soft);
        border-bottom: 1px solid var(--clay);
      }

      .cite-sent:hover,
      .cite-sent:focus-visible {
        outline: none;
        border-bottom-width: 2px;
      }

      .cite-sent:hover::after,
      .cite-sent:focus-visible::after {
        content: attr(data-ref) "\A" attr(data-hint);
        position: absolute;
        bottom: calc(100% + 0.35rem);
        right: 50%;
        transform: translateX(50%);
        width: max-content;
        max-width: 18rem;
        white-space: pre-line;
        background: var(--ink);
        color: var(--surface);
        font-size: 0.78rem;
        font-weight: 500;
        line-height: 1.7;
        padding: 0.3rem 0.65rem;
        border-radius: 3px;
        box-shadow: 0 6px 16px var(--shadow);
        z-index: 1;
      }

      details summary {
        cursor: pointer;
        color: var(--mute);
        font-size: 0.85rem;
        margin: 0.75rem 0 0.5rem;
      }

      #recall-more-row,
      .recall-more-row {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        margin: 0.6rem 0 0.2rem;
      }

      .recall-more-row button {
        font-size: 0.82rem;
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 0.3rem 0.9rem;
      }

      .recall-more-row button:hover:not(:disabled) {
        background: var(--clay);
        border-color: var(--clay);
        color: var(--surface);
      }

      /* ===== Session creation: the empty state's Book cards. The pick
         binds the whole Session (ADR-0014; the Book pick glossary). */
      #new-session-view {
        padding-top: 2.4rem;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      #new-session-view[hidden] {
        display: none;
      }

      p.kicker {
        margin: 0;
        color: var(--clay);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
      }

      .hero-title {
        margin: 0;
        font-size: 1.32rem;
        font-weight: 700;
        line-height: 1.8;
      }

      .hero-note {
        margin: 0;
        color: var(--mute);
        font-size: 0.9rem;
        line-height: 1.9;
      }

      .book-cards {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        margin-top: 0.5rem;
      }

      @media (min-width: 760px) {
        .book-cards {
          grid-template-columns: 1fr 1fr;
        }
      }

      .book-card {
        background: var(--raised);
        border: 1px solid var(--rule);
        border-radius: 12px;
        padding: 1.1rem 1.1rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        /* the manuscript's gold inner frame */
        outline: 1px solid var(--gold-soft);
        outline-offset: -6px;
      }

      .book-card:hover {
        outline-color: var(--gold);
      }

      .book-card.picked {
        border-color: var(--clay);
        box-shadow: 0 0 0 1px var(--clay);
      }

      .book-card-title {
        margin: 0;
        font-size: 1.02rem;
        font-weight: 700;
        line-height: 1.8;
      }

      .starter-chips {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .starter-chip {
        text-align: start;
        font-size: 0.82rem;
        font-weight: 500;
        line-height: 1.8;
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--rule);
        padding: 0.42rem 0.75rem;
      }

      .starter-chip:hover:not(:disabled) {
        background: transparent;
        color: var(--clay);
        border-color: var(--clay);
      }

      .book-select {
        align-self: flex-start;
      }

      /* ===== The composer dock: one input, one send, one honest stop. */
      .composer-dock {
        position: sticky;
        bottom: 0;
        z-index: 30;
        background: var(--surface);
        border-top: 1px solid var(--rule);
      }

      .composer-dock[hidden] {
        display: none;
      }

      .composer {
        max-width: 46rem;
        margin-inline: auto;
        padding: 0.7rem 1.1rem max(0.85rem, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      body.research-open .composer {
        max-width: 58rem;
      }

      .composer textarea {
        width: 100%;
        min-height: 2.7rem;
        max-height: 9rem;
        resize: none;
        border: 1px solid var(--rule);
        border-radius: 10px;
        background: var(--raised);
        color: var(--ink);
        font: inherit;
        line-height: 1.75;
        padding: 0.55rem 0.85rem;
      }

      .composer-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      .char-note {
        font-size: 0.74rem;
        color: var(--mute);
      }

      #stop-btn {
        background: transparent;
        color: var(--bad);
        border: 1px solid var(--bad);
        padding: 0.4rem 1rem;
      }

      #stop-btn:hover:not(:disabled) {
        background: var(--bad);
        color: var(--surface);
      }

      /* The research toggle (ADR-0015): the composer's mode arm. Same
         pressed vocabulary as the reader's Book chips — the palette's
         own tokens, nothing new. */
      .mode-toggle {
        background: transparent;
        color: var(--mute);
        border: 1px solid var(--rule);
        padding: 0.4rem 0.9rem;
        font-size: 0.8rem;
      }

      .mode-toggle[aria-pressed="true"] {
        color: var(--surface);
        background: var(--ink);
        border-color: var(--ink);
      }

      /* ===== Research Mode (ADR-0008/0009): one section per Session,
         appended to the thread when the ask arms it — the transcript,
         the chips, and the map rail keep their ids and behavior. */
      .research-sec {
        border-top: 1px dashed var(--rule);
        padding-top: 0.9rem;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }

      .research-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1.1rem;
        align-items: start;
      }

      /* The rail — the map's desktop body (ADR-0018): the parchment
         card beside the chat, always open (the T10 contract), now a
         vertical journey stepper over sectioned rows instead of joined
         strings that could not break. Hidden below 1024px, where the
         compass carries the map. */
      .research-rail {
        display: none;
        border: 1px solid var(--rule);
        border-top: 2px solid var(--gold);
        background: var(--raised);
        padding: 0.7rem 0.9rem 0.9rem;
        font-size: 0.85rem;
      }

      .research-rail-title {
        margin: 0 0 0.6rem;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--clay);
      }

      @media (min-width: 1024px) {
        .research-rail {
          display: block;
        }

        body.research-open .research-layout {
          grid-template-columns: minmax(0, 1fr) 18.5rem;
        }

        body.research-open .research-rail {
          order: 0;
          position: sticky;
          top: 4.2rem;
          max-height: calc(100dvh - 8rem);
          overflow-y: auto;
        }
      }

      /* The journey stepper: one column, dots on a connecting line —
         gold for the stages done, lapis for the one running. */
      .research-journey {
        display: flex;
        flex-direction: column;
        margin: 0.1rem 0 0.8rem;
        font-size: 0.78rem;
        color: var(--mute);
        list-style: none;
      }

      .research-journey .stage {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.24rem 0;
        min-width: 0;
      }

      .research-journey .stage:not(:last-child)::after {
        content: "";
        position: absolute;
        inset-inline-start: 0.44rem;
        top: calc(50% + 0.42rem);
        height: calc(100% - 0.42rem);
        width: 1px;
        background: var(--rule);
      }

      .research-journey .stage .dot {
        width: 0.9rem;
        height: 0.9rem;
        border-radius: 50%;
        border: 1px solid var(--mute);
        flex-shrink: 0;
        background: transparent;
        box-sizing: border-box;
      }

      .research-journey .stage.done .dot {
        background: var(--gold);
        border-color: var(--gold);
      }

      .research-journey .stage.now {
        color: var(--ink);
        font-weight: 600;
      }

      .research-journey .stage.now .dot {
        border-color: var(--clay);
        background: var(--clay);
        animation: map-pulse 1.6s ease-in-out infinite;
      }

      @keyframes map-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(31, 74, 120, 0.35);
        }
        50% {
          box-shadow: 0 0 0 0.32rem rgba(31, 74, 120, 0);
        }
      }

      /* The map's rows: a headed card, not a paragraph — the
         destination and the question lead in the lapis head card, the
         lists stand as their own lines (nothing joins with «؛» into an
         unbreakable string any more). */
      .map-head {
        margin: 0 0 0.6rem;
        padding: 0.55rem 0.7rem;
        background: var(--clay-soft);
        border-inline-start: 3px solid var(--gold);
        border-radius: 6px;
        overflow-wrap: anywhere;
        min-width: 0;
      }

      .map-head .map-destination {
        margin: 0 0 0.3rem;
        font-weight: 700;
        color: var(--clay);
        line-height: 1.7;
      }

      .map-head .map-question {
        margin: 0;
        line-height: 1.7;
      }

      .map-head .map-rq-version {
        display: inline-block;
        margin-inline-start: 0.4rem;
        font-size: 0.72rem;
        font-weight: 500;
        color: var(--mute);
        border: 1px solid var(--rule);
        border-radius: 999px;
        padding: 0 0.45rem;
        vertical-align: 1px;
      }

      .map-sec {
        margin: 0.55rem 0 0;
        overflow-wrap: anywhere;
        min-width: 0;
      }

      .map-sec .k {
        display: block;
        color: var(--mute);
        font-size: 0.74rem;
        letter-spacing: 0.02em;
      }

      .map-sec .map-lines {
        margin: 0.15rem 0 0;
        padding: 0;
        list-style: none;
      }

      .map-sec .map-lines li {
        padding: 0.14rem 0;
        line-height: 1.7;
        border-bottom: 1px dashed var(--rule);
      }

      .map-sec .map-lines li:last-child {
        border-bottom: none;
      }

      .map-sec .map-lines li.fog {
        font-style: italic;
        color: var(--mute);
      }

      .map-sec .map-lines li.frontier {
        font-weight: 700;
        color: var(--clay);
      }

      .map-more {
        margin: 0.15rem 0 0;
        padding: 0;
        background: none;
        border: none;
        color: var(--clay);
        font-size: 0.76rem;
        font-weight: 600;
        cursor: pointer;
      }

      .map-more:hover {
        text-decoration: underline;
      }

      .map-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem 0.9rem;
        margin: 0.7rem 0 0;
        padding-top: 0.45rem;
        border-top: 1px solid var(--rule);
        font-size: 0.74rem;
        color: var(--mute);
      }

      .map-stats .stat b {
        color: var(--ink);
        font-weight: 700;
      }

      /* The compass — the map's mobile body: one thin sticky bar glued
         to the composer (it lives inside the composer-dock, so it
         rides the dock's own sticky bottom), raising the full map as a
         sheet. The desktop hides it; the rail owns the wide screen. */
      #research-compass {
        display: block;
      }

      @media (min-width: 1024px) {
        #research-compass {
          display: none;
        }
      }

      #compass-toggle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.42rem 0.2rem;
        background: none;
        border: none;
        border-top: 1px solid var(--rule);
        font-size: 0.78rem;
        color: var(--mute);
        cursor: pointer;
        min-width: 0;
      }

      .compass-dots {
        display: inline-flex;
        gap: 0.28rem;
        flex-shrink: 0;
      }

      .compass-dots i {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        border: 1px solid var(--mute);
        box-sizing: border-box;
      }

      .compass-dots i.done {
        background: var(--gold);
        border-color: var(--gold);
      }

      .compass-dots i.now {
        background: var(--clay);
        border-color: var(--clay);
        animation: map-pulse 1.6s ease-in-out infinite;
      }

      .compass-label {
        font-weight: 700;
        color: var(--ink);
        flex-shrink: 0;
      }

      .compass-now {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: start;
      }

      .compass-chevron {
        display: inline-flex;
        flex-shrink: 0;
        transition: transform 0.18s ease;
      }

      #compass-toggle[aria-expanded="true"] .compass-chevron {
        transform: rotate(180deg);
      }

      #compass-panel {
        max-height: min(60dvh, 26rem);
        overflow-y: auto;
        padding: 0.6rem 0.2rem 0.7rem;
        border-bottom: 1px solid var(--rule);
        font-size: 0.82rem;
      }

      .research-chat {
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        margin: 0 0 0.8rem;
      }

      .research-msg.user {
        align-self: flex-start;
        max-width: 85%;
      }

      .research-msg.user .research-msg-body {
        background: var(--clay-soft);
        border-radius: 10px 10px 10px 2px;
        padding: 0.45rem 0.95rem;
        margin: 0;
        line-height: 1.8;
      }

      .research-msg.user .research-msg-body p {
        margin: 0;
      }

      .research-msg.assistant {
        align-self: stretch;
        border-right: 3px solid var(--clay);
        padding-right: 0.9rem;
      }

      .research-note {
        margin: 0 0 0.55rem;
        color: var(--mute);
        line-height: 1.8;
      }

      .research-suggest {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin: 0 0 0.9rem;
      }

      .research-chip {
        font-size: 0.8rem;
        font-weight: 500;
        padding: 0.3rem 0.9rem;
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--ink);
        border-radius: 999px;
      }

      .research-chip:hover:not(:disabled) {
        background: var(--clay);
        border-color: var(--clay);
        color: var(--surface);
      }

      .research-chip.reject {
        border-style: dashed;
      }

      .research-question {
        margin: 0 0 0.55rem;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.9;
      }

      .research-commentary {
        margin: 0 0 0.55rem;
        padding: 0.35rem 0.6rem;
        border-right: 3px dashed var(--mute);
        color: var(--mute);
        font-style: italic;
        line-height: 1.8;
      }

      .research-commentary .commentary-tag {
        font-style: normal;
        font-weight: 600;
        margin-left: 0.3rem;
      }

      .research-form {
        display: flex;
        gap: 0.7rem;
        align-items: flex-end;
        margin-top: 0.4rem;
      }

      /* The one door (ADR-0015): the section's own composer is retired —
         the shell composer with the research toggle armed is the only
         way in; the element (and its wiring) stays for the reconnect
         paths, just never shown. */
      .research-form[hidden] {
        display: none;
      }

      .research-form textarea {
        flex: 1;
        min-width: 0;
        min-height: 2.8rem;
        max-height: 9rem;
        resize: none;
        border: 1px solid var(--rule);
        border-radius: 10px;
        background: var(--raised);
        color: var(--ink);
        font: inherit;
        line-height: 1.75;
        padding: 0.55rem 0.85rem;
      }

      .research-form button {
        flex-shrink: 0;
      }

      /* ===== The profile (T24, GitLab #27) — kept self-contained; the
         honesty badges are styled apart — dashed and muted for an
         estimate, so an estimate never looks measured. DRAFT labels,
         pending PM approval (see the section's comment in the body). */
      #profile {
        border: 1px solid var(--rule);
        background: var(--raised);
        padding: 1rem 1.25rem;
        margin: 0 auto 1.6rem;
        width: calc(100% - 2.2rem);
        max-width: 46rem;
      }

      #profile h2 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }

      /* The profile (T24 restage, the journey prototype #39): a hero
         balance card and the Sessions' spend as stacked paper sheets —
         the meter's verdict rides as a status dot (green = measured,
         gold = estimated), never as a button. */
      .profile-hero {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        border: 1px solid var(--rule);
        outline: 1px solid var(--gold-soft);
        outline-offset: -6px;
        border-radius: 12px;
        background: var(--raised);
        padding: 0.9rem 1.25rem;
        margin: 0 0 1rem;
      }

      .profile-hero-label {
        font-size: 0.8rem;
        color: var(--mute);
      }

      .profile-balance {
        font-size: 1.7rem;
        font-weight: 700;
        color: var(--gold);
        line-height: 1.5;
      }

      .profile-ongoing {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        border: 1px solid var(--rule);
        border-radius: 12px;
        background: var(--raised);
        padding: 0.7rem 1rem;
        margin: 0;
        font-size: 0.9rem;
      }

      .profile-ongoing-detail {
        margin-inline-start: auto;
        color: var(--mute);
        font-size: 0.85rem;
      }

      .profile-badge::before {
        content: "";
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: var(--ok);
        flex: none;
      }

      /* ===== The Book reader (ADR-0007): a slide-over over the thread
         on the end side (full-screen below 1024px) — provenance on
         demand, never a mode that blocks the conversation. */
      #reader {
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--rule);
        box-shadow: 0 18px 40px var(--shadow);
        min-height: 0;
        padding-bottom: env(safe-area-inset-bottom);
      }

      #reader-backdrop {
        position: fixed;
        inset: 0;
        z-index: 55;
        background: var(--backdrop);
      }

      #reader-backdrop[hidden] {
        display: none;
      }

      @media (max-width: 1023.98px) {
        #reader:not([hidden]) {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 60;
        }
      }

      @media (min-width: 1024px) {
        #reader:not([hidden]) {
          display: flex;
          position: fixed;
          top: 0;
          bottom: 0;
          inset-inline-end: 0;
          width: min(42rem, 44vw);
          z-index: 60;
          box-shadow: 0 0 60px var(--shadow);
        }
      }

      .reader-head {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: max(0.7rem, env(safe-area-inset-top)) 1rem 0.7rem;
        border-bottom: 1px solid var(--rule);
      }

      .reader-title {
        flex: 1;
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.6;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .reader-books {
        display: flex;
        gap: 0.35rem;
        flex: none;
      }

      .reader-book {
        font-size: 0.76rem;
        font-weight: 500;
        padding: 0.35rem 0.6rem;
        background: transparent;
        color: var(--mute);
        border: 1px solid var(--rule);
      }

      .reader-book[aria-pressed="true"] {
        color: var(--surface);
        background: var(--ink);
        border-color: var(--ink);
      }

      .reader-close {
        padding: 0.35rem 0.75rem;
        flex: none;
      }

      .reader-tools {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.45rem;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid var(--rule);
        font-size: 0.8rem;
        color: var(--mute);
      }

      .reader-tools button {
        padding: 0.28rem 0.7rem;
        font-size: 0.8rem;
      }

      .reader-tools label {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        margin: 0;
      }

      #page-num {
        width: 3.4rem;
        text-align: center;
        border: 0;
        border-bottom: 1px solid var(--ink);
        background: transparent;
        font: inherit;
        color: var(--ink);
      }

      .reader-spacer {
        flex: 1;
      }

      a.reader-download {
        font-size: 0.8rem;
        font-weight: 500;
        padding: 0.28rem 0.7rem;
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--rule);
        text-decoration: none;
      }

      a.reader-download:hover {
        background: var(--clay);
        border-color: var(--clay);
        color: var(--surface);
      }

      .reader-pages {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 1.1rem;
        background: #141d20;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
        scroll-behavior: smooth;
        overscroll-behavior: contain;
      }

      .reader-page {
        position: relative;
        background: #fdfdfb;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
        overflow: hidden;
        flex: none;
      }

      .reader-page canvas {
        display: block;
      }

      /* The pixel truth: a server-rendered PDFium raster (ADR-0007). */
      .reader-img {
        display: block;
        width: 100%;
        height: 100%;
        user-select: none;
        -webkit-user-drag: none;
      }

      .reader-page .textLayer {
        position: absolute;
        inset: 0;
        overflow: clip;
        opacity: 1;
        line-height: 1;
        text-align: initial;
        text-size-adjust: none;
        forced-color-adjust: none;
        transform-origin: 0 0;
      }

      .reader-page .textLayer :is(span, br) {
        color: transparent;
        position: absolute;
        white-space: pre;
        cursor: text;
        transform-origin: 0 0;
      }

      /* The located quotation: a clay band over the raster, positioned
         from the PDF's own glyph geometry (percentages of the page, so
         zoom and resize keep it glued). */
      .pdf-rect {
        position: absolute;
        background: rgba(196, 92, 38, 0.38);
        border-radius: 2px;
        pointer-events: none;
      }

      .pdf-rect.fresh {
        animation: hl-pulse 1.8s ease-out 1;
      }

      @keyframes hl-pulse {
        0% {
          background: rgba(196, 92, 38, 0.85);
        }
        100% {
          background: rgba(196, 92, 38, 0.38);
        }
      }

      .reader-note {
        margin: 0;
        padding: 0.55rem 1rem;
        font-size: 0.8rem;
        line-height: 1.7;
        color: var(--ink);
        background: var(--clay-soft);
        border-top: 1px solid var(--rule);
      }

      .reader-note[data-kind="error"] {
        color: var(--bad);
        background: var(--bad-soft);
      }

      /* ===== Small screens. The bar and the reader head wrap instead of
         overflowing: below 1024px the sidebar is a drawer and the
         reader is full-screen, so their tooling gets the room it needs
         row by row (the 320px audit's cut-off page). */
      @media (max-width: 1023.98px) {
        .topbar {
          flex-wrap: wrap;
          row-gap: 0.45rem;
        }

        .topbar-actions {
          display: contents;
        }

        .session-head {
          flex: 1 1 auto;
        }

        .reader-head {
          flex-wrap: wrap;
          row-gap: 0.45rem;
        }

        .reader-books {
          order: 3;
          flex: 1 1 100%;
        }

        .reader-book {
          flex: 1 1 0;
          min-width: 0;
        }
      }

      @media (max-width: 719.98px) {
        .topbar p.status {
          display: none;
        }

        h1#session-title {
          max-width: 40vw;
        }
      }

      /* Touch surfaces: every control reaches a comfortable target
         (the 44px habit) — paddings, not sizes, so the desk look is
         untouched on a mouse. */
      @media (pointer: coarse) {
        .icon-btn {
          padding: 0.55rem 0.95rem;
        }

        .browse-btn {
          padding: 0.5rem 1rem;
        }

        .reader-tools button {
          padding: 0.5rem 0.9rem;
        }

        .reader-book {
          padding: 0.55rem 0.8rem;
        }

        .reader-close {
          padding: 0.55rem 1rem;
        }

        a.reader-download {
          padding: 0.5rem 0.9rem;
        }

        .research-chip {
          padding: 0.5rem 1.1rem;
        }

        .recall-more-row button {
          padding: 0.5rem 1.1rem;
        }

        .starter-chip {
          padding: 0.6rem 0.85rem;
        }

        .session-item-del {
          padding: 0.4rem 0.7rem;
          font-size: 0.75rem;
        }
      }

      /* The narrowest phones: the wrapped action row must fit beside
         its own gaps — compact controls, never a second sideways
         scroll. Last so it outbids the touch paddings at 320px. */
      @media (max-width: 359.98px) {
        .browse-btn {
          font-size: 0.78rem;
          padding: 0.38rem 0.6rem;
        }

        h1#session-title {
          font-size: 0.9rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }

        .thread,
        .reader-pages {
          scroll-behavior: auto !important;
        }
      }
    </style>

  <body>
    <!-- The login overlay (ADR-0013): the Account is the only door — an
         email and a password issued by the Admin, never self-created.
         One self-contained block, deliberately isolated: the rest of the
         shell's markup and JS is untouched, and the fetch wrapper below
         is what turns any 401 («برای ادامه وارد شوید.») into this door. -->
    <section id="auth-gate" hidden>
      <style>
        #auth-gate {
          position: fixed;
          inset: 0;
          z-index: 70;
          display: flex;
          align-items: center;
          justify-content: center;

      <script>
        (function () {
          "use strict";
          // The gate flip (ADR-0013): the shell authenticates with the
          // HttpOnly cwb_auth cookie the server sets; no client header
          // authenticates anything any more. This block wraps window.fetch
          // so ANY response 401 — the ask, the picker, a research poll —
          // opens this overlay, without touching the shell's own JS. A
          // successful login hides the overlay and reloads, so every
          // reader refetches with the cookie.
          var gate = document.getElementById("auth-gate");
          var errorEl = document.getElementById("auth-error");
          var emailEl = document.getElementById("auth-email");
          var passwordEl = document.getElementById("auth-password");
          var originalFetch = window.fetch.bind(window);

          function showAuthGate(message) {
            if (message) {
              errorEl.textContent = message;
              errorEl.hidden = false;
            }
            gate.hidden = false;
            if (emailEl.value) {
              passwordEl.focus();
            } else {
              emailEl.focus();
            }
          }

          window.fetch = function (input, init) {
            return originalFetch(input, init).then(function (response) {
              if (response.status === 401) {
                showAuthGate();
              }
              return response;
            });
          };

          document
            .getElementById("auth-form")
            .addEventListener("submit", function (event) {
              event.preventDefault();
              errorEl.hidden = true;
              originalFetch("/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  email: emailEl.value.trim(),
                  password: passwordEl.value,
                }),
              })
                .then(function (response) {
                  if (response.ok) {
                    gate.hidden = true;
                    passwordEl.value = "";
                    window.location.reload();
                    return;
                  }
                  return response.json().then(function (payload) {
                    showAuthGate(payload.detail || "ورود ناموفق بود.");
                  });
                })
                .catch(function () {
                  showAuthGate("ورود ناموفق بود.");
                });
            });
        })();
      </script>

      // glossary name (CONTEXT.md's Research Mode row); the composer's

      const RESEARCH_SECTION_NOTE =
        "پرسش پژوهشی خود را از همین کامپوزر پایین بپرسید؛ نقشۀ پژوهش کنار گفتگو می‌آید.";
      const RESEARCH_PLACEHOLDER = "پیام پژوهش خود را بنویسید";
      const RESEARCH_SEND_LABEL = "فرستادن";
      const ASK_PLACEHOLDER = "پرسش خود را بنویسید";
      const ASK_SEND_LABEL = "بپرس";
      // The closed conversation's resume note (ADR-0016): not a new
      // name — the exact text of ui/research.py's
      // RESEARCH_SESSION_CLOSED_DETAIL, mirrored client-side because
      // the 409's detail rides no payload once the fetch fails.
      const RESEARCH_CLOSED_NOTE =
        "این گفتگوی پژوهش بسته است؛ پرسش تازه‌ای بپرسید.";
      // The map's clamp toggles (ADR-0018) — the two NEW draft strings

      const MAP_LESS_LABEL = "نمایش کمتر";

        "tarhe-kolli": "طرح کلی اندیشۀ اسلامی در قرآن",
        "70143-336": "انسان ۲۵۰ ساله",
      };

        String(value).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);

      // The Session: one sitting, one Book, resumable (T27 stage 3,
      // GitLab #40) — the server's Session store is the history now:
      // create on the sitting's first ask, the settled turns appended,
      // the sidebar listed from it, a click resumes it read-only.
      // storeId is the sitting's row; null means the next ask opens one.
      const sessionState = {
        active: false,
        book: null,
        titled: false,
        storeId: null,
      };

      // The sitting's continuity (T27 stage 3): sessionStorage keeps the
      // open Session's row per tab — a refresh reopens the sitting it
      // held, a new tab falls to the newest one, «نشست تازه» clears it.
      const rememberStoreSession = () => {
        try {
          if (sessionState.storeId)
            sessionStorage.setItem("storeSessionId", String(sessionState.storeId));
          else sessionStorage.removeItem("storeSessionId");
        } catch {}
      };

      const truncateTitle = (text) => {
        const t = String(text).replace(/\s+/g, " ").trim();
        return t.length > 42 ? t.slice(0, 42) + "…" : t;
      };

      // The store helpers (T27 stage 3): fire-and-forget — a store miss
      // never blocks an ask, and the ledger stays the money truth.
      async function ensureStoreSession(firstQuestion) {
        if (sessionState.storeId) return sessionState.storeId;
        try {
          const res = await fetch("/sessions", {
            method: "POST",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            body: JSON.stringify({
              book: sessionState.book || "",
              title: truncateTitle(firstQuestion || ""),
            }),
          });
          if (res.ok) {
            const data = await res.json();
            sessionState.storeId = data.id || null;
            rememberStoreSession();
          }
        } catch {}
        return sessionState.storeId;
      }

      function storeAppend(role, payload) {
        if (!sessionState.storeId) return;
        fetch(`/sessions/${sessionState.storeId}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify({ role, payload }),
        })
          .then((res) => {
            if (res.ok) renderSessionList();
          })
          .catch(() => {});
      }

      function renderSessionList() {
        // Server-backed: one fetch, newest activity first, the open
        // Session active. Delete is the list-v1's only management act;
        // a click resumes the Session read-only.
        fetch("/sessions", { cache: "no-store" })
          .then((res) => (res.ok ? res.json() : null))
          .then((data) => {
            const rows =
              data && Array.isArray(data.sessions) ? data.sessions : [];
            sessionItemsEl.replaceChildren();
            for (const row of rows) {
              const item = document.createElement("div");
              item.className =
                "session-item" +
                (row.id === sessionState.storeId ? " active" : "");
              item.setAttribute("role", "button");
              item.tabIndex = 0;
              const title = document.createElement("div");
              title.className = "session-item-title";
              title.textContent = row.title || "نشست";
              const meta = document.createElement("div");
              meta.className = "session-item-meta";
              meta.textContent = BOOK_TITLES[row.book] || "";
              const del = document.createElement("button");
              del.type = "button";
              del.className = "session-item-del";
              del.textContent = "حذف";
              del.setAttribute("aria-label", "حذف نشست");
              del.addEventListener("click", (event) => {
                event.stopPropagation();
                fetch(`/sessions/${row.id}`, { method: "DELETE" })
                  .catch(() => {})
                  .finally(() => {
                    if (row.id === sessionState.storeId) {
                      newSessionBtn.click();
                    } else {
                      renderSessionList();
                    }
                  });
              });
              const open = () => openStoreSession(row.id);
              item.addEventListener("click", open);
              item.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") open();
              });
              item.append(title, meta, del);
              sessionItemsEl.append(item);
            }
          })
          .catch(() => {});
      }

      async function openStoreSession(id) {
        let session = null;
        try {
          const res = await fetch(`/sessions/${id}`, { cache: "no-store" });
          session = res.ok ? await res.json() : null;
        } catch {}
        if (!session) return;
        if (quotedAbort) quotedAbort.abort();
        resetResearch();
        setResearchMode(false);
        citationRun += 1;
        askState = null;
        quotedAbort = null;
        stopPhaseTimersForResume();
        sessionState.active = true;
        sessionState.book = session.book || null;
        sessionState.titled = true;
        sessionState.storeId = session.id;
        rememberStoreSession();
        if (sessionState.book) {
          try {
            localStorage.setItem("selectedBook", sessionState.book);
          } catch {}
          markPickedCard(sessionState.book);
        }
        newSessionView.hidden = true;
        threadListEl.hidden = false;
        composerDock.hidden = false;
        stopBtn.hidden = true;
        // The per-ask clock spans exist only once an ask has built its
        // phase row — null on a resumed sitting, so guard them.
        if (elapsedEl) elapsedEl.hidden = true;
        if (ttftEl) ttftEl.hidden = true;
        sessionTitleEl.textContent = session.title || "نشست";
        bookChipEl.textContent = "کتاب";
        bookChipEl.hidden = false;
        threadListEl.replaceChildren();
        for (const message of session.messages || []) {
          if (message.role === "user") {
            const rowEl = document.createElement("div");
            rowEl.className = "msg-user-row";
            const bubble = document.createElement("div");
            bubble.className = "msg-user";
            const p = document.createElement("p");
            p.textContent = (message.payload && message.payload.text) || "";
            bubble.append(p);
            rowEl.append(bubble);
            threadListEl.append(rowEl);
          } else {
            const article = document.createElement("div");
            article.className = "msg-assistant";
            const blocks =
              message.payload && Array.isArray(message.payload.blocks)
                ? message.payload.blocks
                : [];
            if (blocks.length) {
              for (const block of blocks) {
                if (block.type === "heading") {
                  const h = document.createElement("h3");
                  h.className = "doc-heading";
                  h.textContent = cleanFarsi(block.text || "");
                  article.append(h);
                } else if (block.type === "paragraph") {
                  // The same renderer the live article uses: a stored
                  // paragraph's parts interleave AI text with verbatim
                  // quote spans ({quote, reference, labels}) - reading
                  // block.text here drew every paragraph empty (the
                  // vanishing-content fix, 2026-09-24).
                  article.append(paragraphNode(block));
                }
              }
            } else if (message.payload && message.payload.text) {
              const p = document.createElement("p");
              p.className = "doc-para";
              p.textContent = cleanFarsi(message.payload.text);
              article.append(p);
            } else {
              continue;
            }
            // The Evidence pool rides the resume (restore fidelity,
            // 2026-09-27): the settled rows carry the ask's stored
            // citations, and the resumed sitting shows the same
            // collapsed pool the live ask did — not just the article.
            const citations = Array.isArray(message.payload.citations)
              ? message.payload.citations
              : [];
            if (citations.length) {
              const pool = document.createElement("details");
              pool.className = "evidence-pool";
              const summary = document.createElement("summary");
              summary.textContent = "همۀ نقل‌قول‌های بازیابی‌شده";
              const poolHeading = document.createElement("h2");
              poolHeading.className = "citations-heading";
              poolHeading.textContent = "استناد";
              const list = document.createElement("div");
              list.className = "citations";
              for (const item of citations) {
                if (!item || typeof item !== "object") continue;
                const reference =
                  typeof item.reference === "string" ? item.reference : "";
                const passage =
                  typeof item.passage === "string" ? item.passage : "";
                if (!reference && !passage) continue;
                const p = document.createElement("p");
                p.className = "cite";
                p.textContent = cleanFarsi(
                  passage ? `${reference}: "${passage}"` : reference
                );
                list.append(p);
              }
              if (list.children.length) {
                pool.append(summary, poolHeading, list);
                article.append(pool);
              }
            }
            threadListEl.append(article);
          }
        }
        renderSessionList();
        setSidebar(false);
        // The unanswered tail (T27 stage 3): a sitting whose last stored
        // turn is the operator's question died before its answer settled
        // — a refresh or a new sitting kills the in-flight pipeline, and
        // the honest charge for the streamed part already stands. The
        // resume shows it plainly and offers the re-ask as ONE click
        // that refills the composer; re-asking is the operator's act,
        // never an automatic re-billing.
        const messages = session.messages || [];
        const last = messages[messages.length - 1];
        if (last && last.role === "user") {
          const card = document.createElement("div");
          card.className = "unanswered";
          const note = document.createElement("p");
          note.className = "unanswered-note";
          note.textContent = UNANSWERED_NOTE;
          const again = document.createElement("button");
          again.type = "button";
          again.className = "primary";
          again.textContent = REASK_LABEL;
          again.addEventListener("click", () => {
            questionEl.value = (last.payload && last.payload.text) || "";
            autosizeComposer();
            updateCharNote();
            questionEl.focus();
            card.remove();
          });
          card.append(note, again);
          threadListEl.append(card);
        }
        // The research linkage (ADR-0016): a sitting that researched
        // raises its whole research conversation beside the restored
        // chat — the trail no longer dies because a sidebar click
        // dropped the browser's only pointer. The server store is the
        // source; sessionStorage re-arms only the same-tab turn resume.
        if (session.research_session_id) {
          researchSessionId = String(session.research_session_id);
          storeResearch({ session_id: researchSessionId });
          hydrateResearch(researchSessionId);
        }
        scrollThreadEnd();
      }

      // Multi-device: the sidebar refetches when the tab regains focus —
      // last-write-wins; the open thread stays as the sitting left it
      // until the Session is reopened from the list.
      window.addEventListener("focus", () => {
        if (sessionState.active) renderSessionList();
      });

      function stopPhaseTimersForResume() {
        for (const n of [1, 2, 3]) {
          stopPhaseTimer(n);
          phaseEls[n].startedAt = null;
          if (phaseEls[n].timer) phaseEls[n].timer.hidden = true;
        }
      }

      function setSidebar(open) {
        shellEl.classList.toggle("sl-open", open);
        slBackdropEl.hidden = !open;
        slToggleEl.setAttribute("aria-expanded", String(open));
      }
      slToggleEl.addEventListener("click", () => setSidebar(true));
      slCloseEl.addEventListener("click", () => setSidebar(false));
      slBackdropEl.addEventListener("click", () => setSidebar(false));

      // The theme: system preference by default, the toggle persists an
      // explicit choice; the head script set data-theme before paint.
      const themeToggle = document.getElementById("theme-toggle");
      function syncThemeButton() {
        themeToggle.textContent =
          document.documentElement.dataset.theme === "dark" ? "روز" : "شب";
      }
      themeToggle.addEventListener("click", () => {
        const next =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try {
          localStorage.setItem("theme", next);
        } catch {}
        syncThemeButton();
      });
      syncThemeButton();

      function markPickedCard(doc) {
        document.querySelectorAll(".book-card").forEach((card) => {
          card.classList.toggle("picked", card.dataset.doc === doc);
        });
      }
      try {
        markPickedCard(localStorage.getItem("selectedBook"));
      } catch {}

      function startSession(bookDoc, seedQuestion) {
        // A new sitting begins in the ask mode (ADR-0015): the toggle's
        // arm belongs to the sitting that armed it.
        setResearchMode(false);
        sessionState.active = true;
        sessionState.book = bookDoc;
        sessionState.titled = false;
        sessionState.storeId = null;
        try {
          localStorage.setItem("selectedBook", bookDoc);
        } catch {}
        markPickedCard(bookDoc);
        newSessionView.hidden = true;
        threadListEl.hidden = false;
        composerDock.hidden = false;
        sessionTitleEl.textContent = BOOK_TITLES[bookDoc] || bookDoc;
        bookChipEl.textContent = "کتاب";
        bookChipEl.hidden = false;
        if (seedQuestion) {
          questionEl.value = seedQuestion;
          autosizeComposer();
          updateCharNote();
        }
        renderSessionList();
        if (!window.matchMedia("(pointer: coarse)").matches) {
          questionEl.focus();
        }
      }

      newSessionBtn.addEventListener("click", () => {
        setSidebar(false);
        if (!sessionState.active) return;
        if (quotedAbort) quotedAbort.abort();
        resetResearch();
        citationRun += 1;
        askState = null;
        quotedAbort = null;
        sessionState.active = false;
        sessionState.book = null;
        sessionState.titled = false;
        sessionState.storeId = null;
        rememberStoreSession();
        threadListEl.replaceChildren();
        threadListEl.hidden = true;
        newSessionView.hidden = false;
        composerDock.hidden = true;
        stopBtn.hidden = true;
        sessionTitleEl.textContent = "نشست";
        bookChipEl.hidden = true;
        renderSessionList();
      });

      // ===== The composer: autosize, the counter near the ceiling, the
      // per-Session draft, Enter-to-send on a pointer device only.
      function autosizeComposer() {
        questionEl.style.height = "auto";
        // border-box: hide the scrollbar until the ceiling clips the
        // content, or the measured height runs two border-pixels short
        // and a dead scrollbar appears on a single line.
        questionEl.style.overflowY = "hidden";
        const h = Math.min(questionEl.scrollHeight, 144);
        questionEl.style.height = h + "px";
        if (questionEl.scrollHeight > 144) {
          questionEl.style.overflowY = "auto";
        }
      }
      function updateCharNote() {
        const left = 2000 - questionEl.value.length;
        charNoteEl.textContent =
          left <= 200 ? `${toPersianDigits(left)} نویسه باقی مانده` : "";
      }
      questionEl.addEventListener("input", () => {
        autosizeComposer();
        updateCharNote();
        try {
          localStorage.setItem("composerDraft", questionEl.value);
        } catch {}
      });
      try {
        questionEl.value = localStorage.getItem("composerDraft") || "";
      } catch {}
      questionEl.addEventListener("keydown", (event) => {
        if (
          event.key === "Enter" &&
          !event.shiftKey &&
          !window.matchMedia("(pointer: coarse)").matches
        ) {
          event.preventDefault();
          if (!buttonEl.disabled) form.requestSubmit();
        }
      });

      // ===== Per-ask surface: one assistant article per ask. The
      // element bindings below are `let` — a new ask rebuilds them and
      // every downstream function keeps operating on the live ask.
      let answerEl = null;
      let citationsEl = null;
      let evidencePoolEl = null;
      let quotedDocEl = null;
      let elapsedEl = null;
      let ttftEl = null;
      let phaseNowEl = null;
      let recallMoreRow = null;
      let recallMoreBtn = null;
      let recallMoreStatus = null;
      let citationRun = 0; // In-flight phase 2 fetches; aborted when a new ask starts.
      let quotedAbort = null;
      // The current ask's own state for «جست‌وجوی بیشتر» (ADR-0010):
      // question, streamed prose (phase 2's framing), and the pool
      // locator lines so far — grown when the widen returns fresh
      // passages, then both answers re-run over the merged pool.
      let askState = null;
      let recallMoreBusy = false;
      // This ask's settle key (vanishing-content fix, 2026-09-24): one
      // opaque key per ask, shared by the picker and phase 2 so the
      // server settles BOTH into the SAME assistant row — the snapshot
      // upgrading to the article. New ask, new key.
      let currentAskKey = null;
      // The current ask's question and Evidence pool — the seed of the
      // Research Mode session the first message creates (ADR 0008).
      let researchQuery = null;
      let researchSources = [];
      let researchSessionId = null;

      // The three answering phases (ADR-0014's thread shape): a quiet
      // marker per phase riding the ask's article, a pulsing dot on the
      // phase being generated, a "now generating" line, and a per-phase
      // timer for phases 2 and 3 that freezes at settle.
      const PHASE_NAMES = {
        1: "پاسخ اول",
        2: "پاسخ استنادی",
        3: "حالت پژوهش",
      };
      let phaseEls = {
        1: { mark: null, timer: null, interval: null, startedAt: null },
        2: { mark: null, timer: null, interval: null, startedAt: null },
        3: { mark: null, timer: null, interval: null, startedAt: null },
      };

      function buildPhaseMark(name, withTimer) {
        const mark = document.createElement("span");
        mark.className = "phase-mark";
        mark.dataset.state = "idle";
        const dot = document.createElement("span");
        dot.className = "phase-dot";
        dot.setAttribute("aria-hidden", "true");
        mark.append(dot, document.createTextNode(name));
        let timer = null;
        if (withTimer) {
          timer = document.createElement("span");
          timer.className = "phase-timer";
          timer.hidden = true;
          mark.append(timer);
        }
        return { mark, timer };
      }

      function newAskSurface(question) {
        const row = document.createElement("div");
        row.className = "msg-user-row";
        const bubble = document.createElement("div");
        bubble.className = "msg-user";
        const p = document.createElement("p");
        p.textContent = question;
        bubble.append(p);
        row.append(bubble);

        const article = document.createElement("article");
        article.className = "msg-assistant";

        const phaseRow = document.createElement("div");
        phaseRow.className = "phase-row";
        const one = buildPhaseMark(PHASE_NAMES[1], false);
        const two = buildPhaseMark(PHASE_NAMES[2], true);
        phaseRow.append(one.mark, two.mark);

        phaseNowEl = document.createElement("p");
        phaseNowEl.className = "phase-now";
        phaseNowEl.hidden = true;

        answerEl = document.createElement("div");
        answerEl.className = "answer";

        // The Evidence pool stays visible, collapsed (issue #28):
        // the Quote selection renders as the first answer above it
        // and the pool remains phase 2's exact payload.
        evidencePoolEl = document.createElement("details");
        evidencePoolEl.className = "evidence-pool";
        const summary = document.createElement("summary");
        summary.textContent = "همۀ نقل‌قول‌های بازیابی‌شده";
        const poolHeading = document.createElement("h2");
        poolHeading.className = "citations-heading";
        poolHeading.textContent = "استناد";
        citationsEl = document.createElement("div");
        citationsEl.className = "citations";
        const recallRow = document.createElement("div");
        recallRow.className = "recall-more-row";
        recallRow.hidden = true;
        recallMoreBtn = document.createElement("button");
        recallMoreBtn.type = "button";
        recallMoreBtn.textContent = "جست‌وجوی بیشتر";
        recallMoreStatus = document.createElement("span");
        recallMoreStatus.className = "composer-status";
        recallRow.append(recallMoreBtn, recallMoreStatus);
        evidencePoolEl.append(summary, poolHeading, citationsEl, recallRow);

        quotedDocEl = document.createElement("div");
        quotedDocEl.className = "quoted-doc";

        const meta = document.createElement("div");
        meta.className = "ask-meta";
        ttftEl = document.createElement("span");
        ttftEl.className = "ttft";
        ttftEl.hidden = true;
        elapsedEl = document.createElement("span");
        elapsedEl.className = "elapsed";
        elapsedEl.hidden = true;
        meta.append(ttftEl, elapsedEl);

        article.append(
          phaseRow,
          phaseNowEl,
          answerEl,
          evidencePoolEl,
          quotedDocEl,
          meta
        );
        threadListEl.append(row, article);

        phaseEls = {
          1: { mark: one.mark, timer: null, interval: null, startedAt: null },
          2: { mark: two.mark, timer: two.timer, interval: null, startedAt: null },
          3: { mark: null, timer: null, interval: null, startedAt: null },
        };

        recallMoreRow = recallRow;
        recallMoreBtn.addEventListener("click", onRecallMoreClick);
      }

      // The map's side rail needs the room (T10, GitLab #11): an active
      // research conversation widens the thread so chat and rail sit
      // beside each other; selectPhase also scrolls the phase's landing
      // spot into view.
      function selectPhase(n, scroll = true) {
        document.body.classList.toggle("research-open", n === 3);
        if (!scroll) return;
        if (!nearBottom()) return;
        if (n === 3) {
          researchSectionEl?.scrollIntoView({ behavior: "smooth", block: "start" });
        } else {
          phaseEls[n]?.mark?.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }

      // ready = waiting for the operator; running = being generated;
      // done / failed / skipped = settled.
      function setPhaseState(n, state) {
        if (phaseEls[n]?.mark) {
          phaseEls[n].mark.dataset.state = state;
        }
      }

      function clockText(ms) {
        const total = Math.max(0, Math.round(ms / 1000));
        return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
      }

      function startPhaseTimer(n, elapsedMs = 0) {
        const phase = phaseEls[n];
        if (!phase.timer) return;
        stopPhaseTimer(n);
        // elapsedMs reseeds an honest clock — a dive reconnected after a
        // refresh continues the job's elapsed, not this page load's.
        phase.startedAt = Date.now() - (elapsedMs || 0);
        phase.timer.hidden = false;
        const tickPhase = () => {
          phase.timer.textContent = clockText(Date.now() - phase.startedAt);
        };
        tickPhase();
        phase.interval = setInterval(tickPhase, 250);
      }

      function stopPhaseTimer(n) {
        const phase = phaseEls[n];
        if (phase.interval) {
          clearInterval(phase.interval);
          phase.interval = null;
        }
        if (phase.startedAt && phase.timer) {
          // The frozen chip IS the completion time: how long the phase took.
          phase.timer.textContent = clockText(Date.now() - phase.startedAt);
        }
      }

      function setRunningPhase(n) {
        if (!phaseNowEl) return;
        if (n === null) {
          phaseNowEl.hidden = true;
          return;
        }
        phaseNowEl.hidden = false;
        phaseNowEl.textContent = `در حال تولید: ${PHASE_NAMES[n]}…`;
      }

      function setText(el, text, className) {
        el.className = className;
        el.textContent = text;
      }

      // Phase-1 answers arrive as markdown (headings, bold, bullets);
      // render that structure, never the literal #/** characters.
      function markBold(el, text) {
        const parts = String(text).split(/\*\*(.+?)\*\*/g);
        parts.forEach((part, index) => {
          if (index % 2) {
            const strong = document.createElement("strong");
            strong.textContent = part;
            el.append(strong);
          } else if (part) {
            el.append(part);
          }
        });
      }

      function renderMarkdown(container, text) {
        container.replaceChildren();
        for (const block of String(text).split(/\n{2,}/)) {
          const lines = block.split("\n").filter((line) => line.trim());
          if (!lines.length) continue;
          if (lines.every((line) => /^\s*[-*]\s+/.test(line))) {
            const ul = document.createElement("ul");
            for (const line of lines) {
              const li = document.createElement("li");
              markBold(li, line.replace(/^\s*[-*]\s+/, ""));
              ul.append(li);
            }
            container.append(ul);
            continue;
          }
          for (const line of lines) {
            const heading = line.match(/^(#{1,4})\s+(.*)$/);
            const el = document.createElement(
              heading ? "h" + Math.min(heading[1].length + 2, 6) : "p"
            );
            markBold(el, heading ? heading[2] : line);
            container.append(el);
          }
        }
      }

      function splitCitation(text) {
        const marker = "Evidence:";
        const at = text.indexOf(marker);
        if (at === -1) {
          return { answer: text.trim(), citations: [] };
        }
        const answer = text.slice(0, at).trim();
        const rest = text.slice(at + marker.length).trim();
        const citations = rest
          .split(/\n-\s+/)
          .map((item) => item.replace(/^[-\s]+/, "").trim())
          .filter(Boolean);
        return { answer, citations };
      }

      // An Evidence bullet is `locator: "quoted passage"`. The quoted
      // passage is the composer's verbatim source pool.
      function evidenceSources(citations) {
        const sources = [];
        for (const item of citations) {
          const at = item.indexOf(': "');
          if (at === -1) {
            continue;
          }
          const reference = item.slice(0, at).trim();
          const passage = cleanFarsi(
            item.slice(at + 3).replace(/"$/, "").trim()
          );
          if (reference && passage) {
            sources.push({ reference, passage });
          }
        }
        return sources;
      }

      // The tooltip's Citation text: Book identity plus the passage's
      // first page (resolved server-side from the Evidence locator) —
      // a passage without page markers cites the Book alone, never an
      // invented page.
      function citationRef(item) {
        if (item.book_label) {
          return item.first_page_label
            ? `${item.book_label} — ${item.first_page_label}`
            : item.book_label;
        }
        return item.first_page_label || "کتاب";
      }

      // ===== Citation → Book-page targets (ADR-0007) =====
      // Every quote in the shell is clickable: its span carries the
      // Evidence locator's dataset name and page range, and clicking
      // opens the reader on that page with the quote highlighted.
      const BOOK_DATASET_BY_TITLE = {
        "طرح کلی اندیشۀ اسلامی در قرآن": "tarhe-kolli",
        "انسان ۲۵۰ ساله": "70143-336",
      };

      // The Evidence locator's machine fields — the client twin of
      // guard.py's _PAGES_IN_REFERENCE / _DOCUMENT_IN_REFERENCE.
      function parseReference(reference) {
        const text = reference || "";
        const doc = /\bdocument ([A-Za-z0-9._-]+)/.exec(text)?.[1] || "";
        const range = /\(pages (\d+)-(\d+)\)/.exec(text);
        if (range) {
          return { doc, first: Number(range[1]), last: Number(range[2]) };
        }
        const single = /\(page (\d+)\)/.exec(text);
        if (single) {
          return { doc, first: Number(single[1]), last: Number(single[1]) };
        }
        return { doc, first: 0, last: 0 };
      }

      // A quote part carries no locator — only the server-resolved
      // labels (guard.py's _citation_labels). The Farsi title maps back
      // to its dataset; the range label's digits are ASCII (regex
      // groups), so no digit conversion is needed.
      function citationTargetFromLabels(part) {
        const byTitle = BOOK_DATASET_BY_TITLE[part.book_label];
        const doc =
          byTitle ||
