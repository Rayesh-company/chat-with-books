        // The compass goes home with the section, collapsed and
        // clamped — a new sitting's map starts fresh (ADR-0018).
        const compassEl = document.getElementById("research-compass");
        if (compassEl) compassEl.hidden = true;
        const toggleEl = document.getElementById("compass-toggle");
        if (toggleEl) toggleEl.setAttribute("aria-expanded", "false");
        const panelEl = document.getElementById("compass-panel");
        if (panelEl) panelEl.hidden = true;
        researchMapExpanded.clear();
      }

      // ===== The research mode toggle (ADR-0015) =====
      // The composer's one door serves both modes: the default is the
      // ask; armed, the typed question goes into the research
      // conversation. The old arm-after-the-answer flow is gone — the
      // section appears when the operator arms the mode (or a refresh
      // reconnects a live conversation), never because an answer
      // landed.
      const researchModeBtn = document.getElementById("research-mode-btn");
      let researchMode = false;
      function setResearchMode(on) {
        researchMode = on;
        researchModeBtn.setAttribute("aria-pressed", on ? "true" : "false");
        questionEl.placeholder = on ? RESEARCH_PLACEHOLDER : ASK_PLACEHOLDER;
        buttonEl.textContent = on ? RESEARCH_SEND_LABEL : ASK_SEND_LABEL;
        document.body.classList.toggle(
          "research-open",
          on && Boolean(researchSectionEl)
        );
      }
      researchModeBtn.addEventListener("click", () => {
        setResearchMode(!researchMode);
        if (researchMode) {
          if (sessionState.active && !researchSectionEl) {
            createResearchSection();
            document.body.classList.add("research-open");
          }
          questionEl.focus();
        } else if (researchSectionEl && !researchSessionId) {
          // Toggled off with no live conversation underneath: the empty
          // section goes home. A live conversation keeps its section
          // (its poll keeps running) until the next ask closes it.
          resetResearch();
        }
      });

      // The research resume (ADR-0016): ONE hydrator for every return
      // path — the boot's same-tab reconnect and the Session store's
      // linkage both end here. The server is the truth: the transcript
      // is re-fetched (ADR-0011 — what was said stays visible across a
      // refresh), the map re-renders from /research/state, the founding
      // question re-arms (the decide chips died on every reconnected
      // sitting while the decide guard still demanded it — the
      // dead-accept fix), and a stored in-flight turn is polled to its
      // settle. A closed conversation (the state read answers 409)
      // renders read-only with the closed note and never re-arms the
      // composer that could no longer feed it.
      async function hydrateResearch(researchId) {
        createResearchSection();
        let closed = false;
        try {
          const [msgRes, stateRes] = await Promise.all([
            fetch(
              `/research/messages?session=${encodeURIComponent(researchId)}`,
              { cache: "no-store" }
            ),
            fetch(
              `/research/state?session=${encodeURIComponent(researchId)}`,
              { cache: "no-store" }
            ),
          ]);
          if (msgRes.ok) {
            const payload = await msgRes.json();
            researchChatEl.replaceChildren();
            for (const message of Array.isArray(payload.messages) ? payload.messages : []) {
              if (message.role === "user") {
                appendResearchMessage(
                  "user",
                  researchText(String(message.payload || ""), "research-msg-text")
                );
              } else {
                appendResearchMessage(
                  "assistant",
                  researchBlocksNode(
                    Array.isArray(message.payload) ? message.payload : []
                  )
                );
              }
            }
          }
          if (stateRes.ok) {
            const payload = await stateRes.json();
            const state = payload.research_state || payload;
            if (
              !researchQuery &&
              typeof state.research_question === "string" &&
              state.research_question
            ) {
              researchQuery = state.research_question;
            }
            renderResearchState(state);
            renderResearchSuggestions(payload.suggestions || []);
          } else if (stateRes.status === 409) {
            closed = true;
          }
        } catch {
          appendResearchError("بازخوانی گفتگو نشد؛ ادامه از سرور ممکن است.");
        }
        // An in-flight turn the tab still holds (the same-tab reload):
        // the poll picks the turn back up mid-flight.
        const stored = storedResearch();
        if (stored && stored.session_id === researchId && stored.turn_id) {
          setPhaseState(3, "running");
          setRunningPhase(3);
          researchInputEl.disabled = true;
          researchSendEl.disabled = true;
          showResearchStatus("در حال پیگیری پاسخ پژوهش…");
          pollResearchTurn(stored.turn_id);
          return;
        }
        if (closed) {
          setResearchMode(false);
          researchChatEl.append(researchText(RESEARCH_CLOSED_NOTE, "empty"));
          return;
        }
        setResearchMode(true);
        selectPhase(3, false);
        armResearchInput();
      }

      // Refresh reconnect: a stored identity means this Account has a
      // research conversation the reload must not throw away. The
      // conversation's state names the chat Session it belongs to
      // (ADR-0016's reverse linkage), so the boot opens THAT sitting —
      // chat and research raised together in one thread, the way the
      // sidebar's click now restores them. No linkage (a pre-linkage
      // conversation, or the read failing) keeps the bare reconnect
      // this function has always done.
      (function reconnectResearch() {
        const stored = storedResearch();
        if (!stored || !stored.session_id) return;
        researchSessionId = stored.session_id;
        sessionState.active = true;
        (async () => {
          try {
            const res = await fetch(
              `/research/state?session=${encodeURIComponent(researchSessionId)}`,
              { cache: "no-store" }
            );
            if (res.ok) {
              const payload = await res.json();
              if (payload.chat_session_id) {
                openStoreSession(String(payload.chat_session_id));
                return;
              }
            }
          } catch {}
          newSessionView.hidden = true;
          threadListEl.hidden = false;
          composerDock.hidden = false;
          sessionTitleEl.textContent = PHASE_NAMES[3];
          renderSessionList();
          setResearchMode(true);
          selectPhase(3, false);
          await hydrateResearch(researchSessionId);
        })();
      })();

      async function readSse(res, onEvent) {
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        const dispatch = (frame) => {
          let name = "message";
          let data = "";
          for (const line of frame.split("\n")) {
            if (!line || line.startsWith(":")) continue;
            if (line.startsWith("event:")) name = line.slice(6).trim();
            else if (line.startsWith("data:")) data += line.slice(5).trim();
          }
          if (data) onEvent(name, data);
        };
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let at;
          while ((at = buffer.indexOf("\n\n")) !== -1) {
            dispatch(buffer.slice(0, at));
            buffer = buffer.slice(at + 2);
          }
        }
        buffer += decoder.decode();
        if (buffer.trim()) dispatch(buffer);
      }

      async function ping() {
        try {
          const res = await fetch("/health", { cache: "no-store" });
          if (!res.ok) throw new Error("down");
          statusEl.dataset.state = "up";
          statusEl.textContent = "سرویس آماده است.";
        } catch {
          statusEl.dataset.state = "down";
          statusEl.textContent = "سرویس پاسخ در دسترس نیست. اول Cognee را روشن کنید.";
        }
      }

      // The Session's Book pick (ADR-0014): EXACTLY ONE per Session,
      // bound at creation from the empty state's cards; the ask runs
      // only inside an active Session.
      function selectedDatasets() {
        return sessionState.book ? [sessionState.book] : [];
      }

      function showRecallMore() {
        recallMoreRow.hidden = false;
        recallMoreBtn.disabled = false;
        recallMoreStatus.textContent = "";
      }

      function hideRecallMore() {
        recallMoreRow.hidden = true;
        recallMoreStatus.textContent = "";
      }

      async function onRecallMoreClick() {
        if (recallMoreBusy || !askState) return;
        recallMoreBusy = true;
        recallMoreBtn.disabled = true;
        recallMoreStatus.textContent = "در حال گسترش جست‌وجو…";
        try {
          const res = await fetch("/recall-more", {
            method: "POST",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            body: JSON.stringify({
              question: askState.question,
              sources: evidenceSources(askState.lines),
              datasets: askState.datasets,
            }),
          });
          const payload = await res.json().catch(() => ({}));
          const fresh = Array.isArray(payload.sources) ? payload.sources : [];
          if (!fresh.length) {
            recallMoreStatus.textContent =
              "چیز تازه‌ای پیدا نشد؛ پاسخ‌ها روی همان شواهد می‌مانند.";
            return;
          }
          // Fresh passages join the pool — the visible locator lines
          // and the ask's own list — and both answers rebuild over the
          // merged pool (the ask's own flow, re-entered).
          for (const source of fresh) {
            askState.lines.push(`${source.reference}: "${source.passage}"`);
            const p = document.createElement("p");
            p.className = "cite";
            p.textContent = `${source.reference}: "${cleanFarsi(source.passage)}"`;
            citationsEl.append(p);
          }
          recallMoreStatus.textContent = "پاسخ‌ها روی شواهد گسترش‌یافته دوباره ساخته می‌شوند…";
          if (quotedAbort) quotedAbort.abort();
          quotedAbort = new AbortController();
          citationRun += 1;
          renderQuotedAnswer(askState.question, askState.answer, askState.lines, () => {});
          renderQuoteSelection(askState.question, askState.prose, askState.lines);
        } catch {
          if (quotedAbort && quotedAbort.signal.aborted) return;
          recallMoreStatus.textContent = "گسترش جست‌وجو انجام نشد؛ دوباره تلاش کنید.";
        } finally {
          recallMoreBusy = false;
          recallMoreBtn.disabled = false;
        }
      }

      // The honest stop (ADR-0014): stopping keeps the charge for what
      // already streamed — the ledger has no refund path; the note says
      // so in plain Farsi.
      stopBtn.addEventListener("click", () => {
        if (quotedAbort) quotedAbort.abort();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const query = questionEl.value.trim();
        if (!sessionState.active) return;
        if (buttonEl.disabled) return; // a run is live
        if (!query) {
          questionEl.focus();
          return;
        }

        // The message leaves the box the moment it is sent (operator
        // feedback, 2026-09-27): capture, then clear — the draft store
        // goes with it. The deliberate refills (starter chips,
        // «پرسیدن دوباره») are not sends and keep their text.
        questionEl.value = "";
        autosizeComposer();
        updateCharNote();
        try {
          localStorage.removeItem(draftKey());
        } catch {}

        // The one door, two modes (ADR-0015): armed, the question goes
        // straight into the research conversation — no answer first.
        if (researchMode) {
          submitResearchAsk(query);
          return;
        }

        // A new ask opens a new thread entry: abort any in-flight phase
        // 2 of the previous one, stop the research poll loop, close the
        // previous research section, then rebuild the surface. The
        // research turn's server-side abort rides this ask's own recall
        // POST (ADR 0008).
        if (quotedAbort) quotedAbort.abort();
        quotedAbort = new AbortController();
        resetResearch();
        for (const n of [1, 2, 3]) {
          stopPhaseTimer(n);
          phaseEls[n].startedAt = null;
          if (phaseEls[n].timer) phaseEls[n].timer.hidden = true;
        }
        newAskSurface(query);
        if (!sessionState.titled) {
          sessionState.titled = true;
          sessionTitleEl.textContent = truncateTitle(query);
        }
        // The store (T27 stage 3): the sitting opens on its first ask,
        // the operator's turn appends — fire-and-forget, never a gate.
        currentAskKey = "ask-" + Date.now();
        ensureStoreSession(query).then((id) => {
          if (id) storeAppend("user", { text: query });
        });
        renderSessionList();
        // The send was the reader's own act: one instant jump to their
        // exchange — instant, so the glide never fights their scroll.
        scrollThreadEnd(false);

        buttonEl.disabled = true;
        stopBtn.hidden = false;
        elapsedEl.hidden = false;
        ttftEl.hidden = false;
        ttftEl.textContent = "نخستین توکن: …";
        const started = Date.now();
        let firstTokenAt = null;
        const markFirstToken = () => {
          if (firstTokenAt !== null) return;
          firstTokenAt = Date.now();
          ttftEl.textContent = `نخستین توکن: ${((firstTokenAt - started) / 1000).toFixed(1)} ثانیه`;
        };
        const tick = setInterval(() => {
          const seconds = Math.round((Date.now() - started) / 1000);
          elapsedEl.textContent = `${seconds} ثانیه`;
        }, 250);
        // The clock times the whole pipeline — stream and the composer
        // phase — and stops when phase 2 settles (PM call, 2026-09-10).
        // Issue #25: the pipeline ends there — the research turns are
        // timed by phase 3's own chip, started on each message.
        const stopTimer = () => {
          clearInterval(tick);
          const seconds = Math.round((Date.now() - started) / 1000);
          elapsedEl.textContent = `${seconds} ثانیه`;
          stopBtn.hidden = true;
        };

        setPhaseState(1, "running");
        setRunningPhase(1);
        quotedDocEl.replaceChildren();
        setText(answerEl, "در حال پرسیدن…", "empty");
        citationRun += 1;
        const run = citationRun;
        // The collapsed pool starts the ask closed — a previous ask's
        // no-citations error note must not sit open on the new one.
        evidencePoolEl.open = false;
        citationsEl.replaceChildren();
        askState = null;
        hideRecallMore();
        const waiting = document.createElement("p");
        waiting.className = "empty";
        waiting.textContent = "استناد پس از پاسخ می‌آید.";
        citationsEl.append(waiting);
        // The draft store was cleared with the box at capture time.

        const textOf = (payload) =>
          Array.isArray(payload) ? payload[0]?.text || "" : payload.text || "";

        // The phase-1 citation fallback (ADR-0011): the first message's
        // role is to FIND CITATIONS. When the streamed reply carries no
        // Evidence block, ONE pinned reference-on search over the
        // question (the Session's Book) fetches the pool so the Quote
        // selection and phase 2 still run; nothing found lands
        // the honest no-citation note, never a generic answer.
        async function fetchFallbackPool() {
          try {
            const res = await fetch("/evidence-fallback", {
              method: "POST",
              headers: { "Content-Type": "application/json; charset=utf-8" },
              body: JSON.stringify({
                question: query,
                datasets: selectedDatasets(),
              }),
            });
            const payload = await res.json().catch(() => ({}));
            return Array.isArray(payload.sources) ? payload.sources : [];
          } catch {
            return [];
          }
        }

        const renderFinal = (text) => {
          if (!text) {
            throw new Error("پاسخ خالی برگشت.");
          }
          const { answer, citations } = splitCitation(text);
          // The prose is kept for phase 2's framing — it is no longer
          // the displayed first answer (issue #28).
          const prose = answer || text;
          markFirstToken();
          setPhaseState(1, "done");
          // The first answer exists — the ask has a question and pool
          // to seed Research Mode with. From here the research
          // conversation is the operator's call, never automatic (the
          // dive's rule, kept; ADR 0008).
          setPhaseState(3, "ready");
          citationsEl.replaceChildren();
          if (!citations.length) {
            // No Evidence block in the stream: the pinned searcher gets
            // ONE chance to fetch the citation pool before the shell
            // concedes (ADR-0011).
            const status = document.createElement("p");
            status.className = "composer-status";
            status.textContent = "استناد در پاسخ نبود؛ مستقیم از کتاب‌ها جست‌وجو می‌کنیم…";
            citationsEl.append(status);
            fetchFallbackPool().then((sources) => {
              if (run !== citationRun) return;
              citationsEl.replaceChildren();
              const lines = sources.map(
                (s) => `${s.reference}: "${s.passage}"`
              );
              if (!lines.length) {
                // No pool anywhere: the streamed prose stays the answer,
                // exactly as before the Quote selection (issue #28).
                answerEl.className = "answer";
                renderMarkdown(answerEl, prose);
                const missing = document.createElement("p");
                missing.className = "error";
                missing.textContent = "استنادی از کتاب‌ها پیدا نشد.";
                citationsEl.append(missing);
                // The failure note must stay readable — open the collapsed
                // pool for it, then close again on the next ask.
                evidencePoolEl.open = true;
                // No Evidence pool means no Quoted answer, but the research
                // session never needed one — the operator may still start
                // it (its gathers search for their own evidence).
                skipQuotedPhase();
                armResearch(query, []);
                // Without a phase-2 run the pipeline still ends here.
                stopTimer();
                return;
              }
              // The fetched pool drives the normal path: pool lines,
              // research seed, phase 2 in parallel with the picker.
              for (const item of lines) {
                const p = document.createElement("p");
                p.className = "cite";
                p.textContent = cleanFarsi(item);
                citationsEl.append(p);
              }
              armResearch(query, evidenceSources(lines));
              askState = {
                question: query,
                prose,
                answer,
                lines,
                datasets: selectedDatasets(),
                askKey: currentAskKey,
              };
              showRecallMore();
              renderQuotedAnswer(query, answer, lines, stopTimer);
              renderQuoteSelection(query, prose, lines);
            });
          } else {
            for (const item of citations) {
              const p = document.createElement("p");
              p.className = "cite";
              p.textContent = cleanFarsi(item);
              citationsEl.append(p);
            }
            armResearch(query, evidenceSources(citations));
            // The widen (ADR-0010) works on this ask's state: question,
            // prose, and the pool lines it can grow.
            askState = {
              question: query,
              prose,
              answer,
              lines: citations.slice(),
              datasets: selectedDatasets(),
              askKey: currentAskKey,
            };
            showRecallMore();
            // Phase 2 starts right here on the same pool (its exact
            // payload) and runs in PARALLEL with the picker (issue #28).
            renderQuotedAnswer(query, answer, citations, stopTimer);
            // The Quote selection replaces the prose as the first
            // answer (issue #28).
            renderQuoteSelection(query, prose, citations);
          }
        };

        try {
          refreshUsageLive();
          const res = await fetch("/api/v1/recall", {
            method: "POST",
            headers: {
              "Content-Type": "application/json; charset=utf-8",
            },
            body: JSON.stringify({
              searchType: "HYBRID_COMPLETION",
              query,
              datasets: selectedDatasets(),
              includeReferences: true,
              stream: true,
              // The sitting's id: the server reads the recent turns
              // from its own store to rewrite a short follow-up into a
              // self-contained search query (ADR-0015) — the id never
              // rides to Cognee, and the displayed question stays the
              // user's own words.
              session_id: sessionState.storeId || undefined,
            }),
          });
          const ctype = res.headers.get("Content-Type") || "";
          if (ctype.includes("text/event-stream")) {
            let preview = "";
            let draftTimer = null;
            let streamError = null;
            let gotFinal = false;
            // The draft retires at the settle: whatever the delta paint
            // shows is subordinate (.answer.draft-stream) and unverified —
            // the Quote selection / quoted-answer renderers below remain
            // the only paths that present prose as the answer. This
            // revisits issue #28 deliberately: a frozen sheet read as a
            // hang while the run billed (impeccable critique, 2026-09-28);
            // the #28 contract itself — the settle paths own the answer —
            // is untouched and still doc-locked.
            const retireDraft = () => {
              if (draftTimer) {
                clearTimeout(draftTimer);
                draftTimer = null;
              }
              answerEl.classList.remove("draft-stream");
            };
            const paintDraft = () => {
              answerEl.classList.add("draft-stream");
              renderMarkdown(answerEl, preview);
              // Follow the growth only while the reader already sits at
              // the bottom; a scrolled-up reader keeps their place.
              if (
                window.innerHeight + window.scrollY >=
                document.documentElement.scrollHeight - 160
              ) {
                scrollThreadEnd(false);
              }
            };
            await readSse(res, (name, data) => {
              if (name === "stage") {
                setText(
                  answerEl,
                  JSON.parse(data).stage === "generating"
                    ? "در حال تولید پاسخ…"
                    : "در حال بازیابی…",
                  "empty"
                );
              } else if (name === "delta") {
                preview += JSON.parse(data).text || "";
                markFirstToken();
                if (draftTimer) return; // a throttled paint is already due
                if (!answerEl.classList.contains("draft-stream")) {
                  paintDraft(); // the first token paints at once
                }
                draftTimer = setTimeout(() => {
                  draftTimer = null;
                  paintDraft();
                }, 200);
              } else if (name === "reset") {
                preview = "";
                retireDraft();
                setText(answerEl, "در حال تولید پاسخ…", "empty");
              } else if (name === "error") {
                streamError = new Error(JSON.parse(data).message || "خطا در جریان پاسخ.");
              } else if (name === "final") {
                gotFinal = true;
                retireDraft();
                renderFinal(textOf(JSON.parse(data).results));
              }
            });
            retireDraft();
            if (!gotFinal) {
              throw streamError || new Error("پاسخ نیامد.");
            }
          } else {
            const payload = await res.json();
            if (!res.ok) {
              const detail = Array.isArray(payload.detail)
                ? payload.detail.join(" ")
                : payload.detail;
              throw new Error(detail || "پاسخ نیامد.");
            }
            renderFinal(textOf(payload));
          }
        } catch (err) {
          if (quotedAbort && quotedAbort.signal.aborted) {
            // The honest stop: what streamed stays charged — the note
            // says where the cost shows up (the profile's badges).
            setText(answerEl, "پرسش متوقف شد.", "empty");
            const note = document.createElement("p");
            note.className = "empty";
            note.textContent = "هزینۀ بخش روان‌شده در پروفایل می‌ماند.";
            answerEl.append(note);
          } else {
            setText(
              answerEl,
              err.message === "Failed to fetch"
                ? "ارتباط با سرویس پاسخ قطع شد."
                : String(err.message || err),
              "error"
            );
          }
          setPhaseState(1, "failed");
          setRunningPhase(null);
          citationsEl.replaceChildren();
          const missing = document.createElement("p");
          missing.className = "empty";
          missing.textContent = "بدون استناد.";
          citationsEl.append(missing);
          stopTimer();
        } finally {
          if (firstTokenAt === null) {
            ttftEl.hidden = true;
          }
          buttonEl.disabled = false;
        }
      });

      // ===== Book reader (ADR-0007) =====
      // The original PDFs, served from serve.py's /books routes and
      // rendered here with the vendored pdf.js. A click on any quote in
      // the shell opens this panel on the passage's first page and
      // highlights the quoted letters: the verbatim guard guarantees
      // the quote exists letter-for-letter in its passage, and the
      // pages come from the Evidence locator, so the position is found
      // by the SAME normalized letter-stream comparison the guard runs
      // — first against the Book's extracted text index (which page of
      // the chunk's range), then against the rendered page's own text
      // layer (which spans to paint).

      const readerEl = document.getElementById("reader");
      const readerBackdrop = document.getElementById("reader-backdrop");
      const readerPagesEl = document.getElementById("reader-pages");
      const readerTitleEl = document.getElementById("reader-title");
      const readerNoteEl = document.getElementById("reader-note");
      const pageNumEl = document.getElementById("page-num");
      const pageCountEl = document.getElementById("page-count");
      const READER_BOOK_TITLES = BOOK_TITLES;

      const toAsciiDigits = (value) =>
        String(value).replace(/[۰-۹٠-٩]/g, (ch) =>
          String.fromCharCode(ch.charCodeAt(0) & 0xf)
        );

      const reader = {
        gen: 0, // bumped on every book switch; stale async work drops out
        doc: null,
        pdf: null,
        pageCount: 0,
        zoom: 1,
        recs: new Map(), // page number -> render record
        observer: null,
        pagesIndex: null, // fetched /books/<doc>.pages.json, per doc
        pagesIndexDoc: null,
        normCache: new Map(), // page number -> normalized page text
        pending: null, // {first, last, text} from the latest citation click
        lib: null, // the lazily imported pdf.js module
        noteTimer: null,
        stick: null, // the page an in-flight scroll is heading to
        current: 1, // the page the scroll handler last saw in view
        queue: new Set(), // pending page numbers, drained nearest-anchor-first
        pump: null, // the running drain loop (serialization)
        fastPaint: null, // the far-jump target painting small-first
      };

      // pdf.js paints its canvases through requestAnimationFrame, which
      // never fires in a hidden pane or background tab — a citation
      // clicked there would hang forever with a blank panel. The
      // watchdog keeps the native vsync path when the page is visible
      // and falls back to a timer if the frame doesn't run within half
      // a second, so hidden surfaces render too.
      function installAnimationFrameWatchdog() {
        const native = window.requestAnimationFrame.bind(window);
        let nextHandle = 1;
        const pending = new Map();
        window.requestAnimationFrame = (callback) => {
          const handle = nextHandle++;
          let done = false;
          const fire = (time) => {
            if (done) return;
            done = true;
            pending.delete(handle);
            callback(time);
          };
          const nativeId = native(fire);
          const timerId = setTimeout(() => fire(performance.now()), 500);
          pending.set(handle, { nativeId, timerId });
          return handle;
        };
        const nativeCancel = window.cancelAnimationFrame.bind(window);
        window.cancelAnimationFrame = (handle) => {
          const entry = pending.get(handle);
          if (entry) {
            pending.delete(handle);
            nativeCancel(entry.nativeId);
            clearTimeout(entry.timerId);
            return;
          }
          nativeCancel(handle);
        };
      }
      installAnimationFrameWatchdog();

      async function ensurePdfJs() {
        if (!reader.lib) {
          reader.lib = await import("./vendor/pdf.min.mjs");
          reader.lib.GlobalWorkerOptions.workerSrc =
            "/vendor/pdf.worker.min.mjs";
        }
        return reader.lib;
      }

      function showReaderNote(message, kind) {
        clearTimeout(reader.noteTimer);
        readerNoteEl.hidden = !message;
        readerNoteEl.textContent = message || "";
        if (kind) readerNoteEl.dataset.kind = kind;
        else delete readerNoteEl.dataset.kind;
        // Errors stay until the next action silences them — a note that
        // vanishes after 8 seconds is a failure nobody saw.
        if (message && kind !== "error") {
          reader.noteTimer = setTimeout(() => {
            readerNoteEl.hidden = true;
          }, 8000);
        }
      }

      // ---- The normalized letter stream: the client twin of
      // guard.py's normalize_for_match — Arabic yeh/kaf unified,
      // tashkeel and kashida stripped, every non-word character
      // deleted (the PDF's backspace noise and ZWNJ among them). JS's
      // \w is ASCII-only, so the word-character keep is spelled with
      // Unicode property classes.
      // The client twin of guard.py's _display_clean: the Book text
      // layer's \b backspace word separators render as nothing in the
      // browser, fusing the words. Any non-whitespace control character
      // becomes the space the layer meant, and every whitespace run
      // becomes one space. ZWNJ is not whitespace, so می‌تواند keeps its
      // join. Applied where layer text reaches the sheet: quote spans,
      // the Evidence pool lines, and the passages sent back upstream —
      // including quotes restored from a stored sitting, which repair
      // visually without a store rewrite.
      function cleanFarsi(text) {
        return String(text)
          .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function normParts(text) {
        let stream = "";
        const map = []; // norm char index -> raw UTF-16 index
        let raw = 0;
        for (const ch of String(text)) {
          let c = ch === "ي" ? "ی" : ch === "ك" ? "ک" : ch;
          if (/[\u064B-\u065F\u0670\u0640]/.test(c)) {
            raw += ch.length;
            continue;
          }
          if (/[\p{L}\p{N}_]/u.test(c)) {
            const lc = c.toLowerCase();
            // The two extractors disagree on the lam-alef ligature's
            // decomposition order (لا vs ال) — canonicalize so a quote
            // from one matches a page built by the other.
            if (lc === "ا" && stream.endsWith("ل")) {
              const lamRaw = map.pop();
              stream = stream.slice(0, -1);
              stream += "ا" + "ل";
              map.push(raw, lamRaw);
            } else {
              stream += lc;
              map.push(raw);
            }
          }
          raw += ch.length;
        }
        return { stream, map };
      }

      function normStream(text) {
        return normParts(text).stream;
      }

      // ---- Citation clicks → the reader. Delegated: quotes render in
      // three places (Quote selection, Quoted/research paragraphs, the
      // Evidence pool) and the pool's lines parse at click time.
      function openCitationFromElement(el) {
        const doc = el.dataset.doc;
        if (!doc) return;
        const range = el.dataset.pages || "";
        const dash = range.indexOf("-");
        const first = dash === -1 ? Number(range) : Number(range.slice(0, dash));
        const last = dash === -1 ? first : Number(range.slice(dash + 1));
        openCitation(doc, first || 0, last || 0, el.textContent);
      }

      function splitLocator(line) {
        const at = line.indexOf(': "');
        if (at === -1) {
          return { reference: line.trim(), passage: "" };
        }
        return {
          reference: line.slice(0, at).trim(),
          passage: line.slice(at + 3).replace(/"$/, "").trim(),
        };
      }

      document.addEventListener("click", (event) => {
        const sent = event.target.closest("span.cite-sent");
        if (sent) {
          openCitationFromElement(sent);
          return;
        }
        const cite = event.target.closest("p.cite");
        if (cite) {
          const { reference, passage } = splitLocator(cite.textContent || "");
          const located = parseReference(reference);
          if (located.doc) {
            // The reference line names a locator, not a passage: fall
            // back to the quote span that claimed the same locator
            // (ADR-0010) so the reader locates and highlights instead
            // of opening the chunk's first page blind.
            const located_passage =
              passage ||
              locatorPassages.get(
                `${located.doc}|${located.first}-${located.last}`
              ) ||
              "";
            openCitation(located.doc, located.first, located.last, located_passage);
          }
        }
      });
      document.addEventListener("keydown", (event) => {
        if (
          (event.key === "Enter" || event.key === " ") &&
          event.target.classList?.contains("cite-sent")
        ) {
          event.preventDefault();
          openCitationFromElement(event.target);
        }
      });

      async function openCitation(doc, first, last, text) {
        openReaderPanel();
        reader.pending =
          first && text ? { first, last: last || first, text } : null;
        await openBook(doc, first || 1);
        if (!reader.pending) {
          showReaderNote(
            first
              ? ""
              : "صفحهٔ این نقل‌قول در کتاب مشخص نیست؛ کتاب از آغاز باز شد.",
            first ? undefined : "error"
          );
          return;
        }
        await locatePending();
      }

      // ---- Panel + toolbar wiring.
      function openReaderPanel() {
        readerEl.hidden = false;
        readerBackdrop.hidden = false;
        document.body.classList.add("reader-open");
      }

      function closeReaderPanel() {
        readerEl.hidden = true;
        readerBackdrop.hidden = true;
        document.body.classList.remove("reader-open");
      }

      document
        .getElementById("reader-browse")
        .addEventListener("click", () => {
          openReaderPanel();
          let saved = null;
          try {
            saved = JSON.parse(sessionStorage.getItem("readerPos") || "null");
          } catch {}
          openBook(
            saved?.doc && READER_BOOK_TITLES[saved.doc] ? saved.doc : "tarhe-kolli",
            saved?.page || 1
          );
        });
      document
        .getElementById("reader-close")
        .addEventListener("click", closeReaderPanel);
      readerBackdrop.addEventListener("click", closeReaderPanel);
      document.addEventListener("keydown", (event) => {
        if (
          event.key === "Escape" &&
          !readerEl.hidden &&
          event.target !== pageNumEl
        ) {
          closeReaderPanel();
          return;
        }
        if (event.key === "Escape" && shellEl.classList.contains("sl-open")) {
          setSidebar(false);
        }
      });
      document.querySelectorAll(".reader-book").forEach((button) => {
        button.addEventListener("click", () => {
          openBook(button.dataset.doc, 1);
        });
      });

      const savedPosition = () => {
        try {
          return JSON.parse(sessionStorage.getItem("readerPos") || "null");
        } catch {
          return null;
        }
      };
      const savePosition = (doc, page) =>
        sessionStorage.setItem("readerPos", JSON.stringify({ doc, page }));

      function currentPageNumber() {
        const box = readerPagesEl.getBoundingClientRect();
        const mid = box.top + box.height / 2;
        let current = 1;
        for (const [n, rec] of reader.recs) {
          const r = rec.el.getBoundingClientRect();
          if (r.top <= mid && r.bottom > mid) return n;
          if (r.bottom <= mid) current = Math.min(n + 1, reader.pageCount);
        }
        return current;
      }

      function markCurrentPage(n) {
        pageNumEl.value = toPersianDigits(n);
        savePosition(reader.doc, n);
      }

      // ---- Document loading and lazy page rendering.
      function resetReaderDom() {
        reader.recs.clear();
        reader.normCache.clear();
        reader.pagesIndex = null;
        reader.pagesIndexDoc = null;
        readerPagesEl.replaceChildren();
      }

      // The visual pipeline is a SERVER-side PDFium raster per page
      // (/books/<doc>/page/<n>.png — pixel-perfect for these Persian
      // subset fonts, ADR-0007's rendering addendum); pdf.js stays only
      // for parsing and the transparent selection layer, never draws.

      const BOOK_PAGE_COUNTS = { "tarhe-kolli": 807, "70143-336": 346 };

      async function openBook(doc, page) {
        const gen = ++reader.gen;
        openReaderPanel();
        showReaderNote("");
        document.querySelectorAll(".reader-book").forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.doc === doc)
          );
        });
        readerTitleEl.textContent = READER_BOOK_TITLES[doc] || doc;
        document.getElementById("book-download").href =
          `/books/${encodeURIComponent(doc)}.pdf`;

        const needsDocInit = reader.doc !== doc || !reader.recs.size;
        if (needsDocInit) {
          reader.doc = doc;
          reader.pageCount = BOOK_PAGE_COUNTS[doc] || 807;
          resetReaderDom();
          pageCountEl.textContent = `از ${toPersianDigits(reader.pageCount)}`;
          buildPlaceholders();
        }

        markCurrentPage(Math.min(Math.max(page || 1, 1), reader.pageCount));
        await gotoPage(Math.min(Math.max(page || 1, 1), reader.pageCount));

          try {
            await ensurePdfJs();
            if (reader.doc === doc && (!reader.pdf || reader.pdfDoc !== doc)) {
              const previousTask = reader.loadingTask || null;
              const task = reader.lib.getDocument({
                url: `/books/${encodeURIComponent(doc)}/book`,
                cMapUrl: "/vendor/cmaps/",
                cMapPacked: true,
                standardFontDataUrl: "/vendor/standard_fonts/",
                isEvalSupported: false,
                // Lazy data (ADR-0017): pdf.js fetches only the byte
                // ranges the parsed pages actually need (the server
                // honors Range), instead of pulling the whole 16 MB in
                // the background on every open. The cMaps stay — the
                // Identity-H subsets' text layer depends on them.
                disableAutoFetch: true,
              });
            reader.loadingTask = task;
            const pdf = await task.promise;
            if (gen !== reader.gen) return;
            if (previousTask) previousTask.destroy();
            reader.pdf = pdf;
            reader.pdfDoc = doc;
            reader.pageCount = pdf.numPages;
            pageCountEl.textContent = `از ${toPersianDigits(reader.pageCount)}`;
            const first = await pdf.getPage(1);
            const vp1 = first.getViewport({ scale: 1 });
            reader.baseWidth = vp1.width;
            reader.baseRatio = vp1.height / vp1.width;

            // The placeholder sheet was built on the hardcoded count
            // (BOOK_PAGE_COUNTS) — the parse's real numPages usually
            // differs (807 vs 862) — so rebuild it on the true count:
            // otherwise the tail pages have no placeholders at all and
            // cannot be scrolled to. Re-land wherever the reader stood.
            if (reader.recs.size && reader.recs.size !== pdf.numPages) {
              const anchor = Math.min(
                reader.stick ?? reader.current ?? 1,
                pdf.numPages
              );
              reader.recs.clear();
              readerPagesEl.replaceChildren();
              buildPlaceholders();
              gotoPage(anchor);
            }

            // Upgrade any already-rendered visible pages with text layers
            for (const [n, rec] of reader.recs) {
              if (rec.rendered && !rec.el.querySelector(".textLayer")) {
                rec.rendered = false;
                enqueuePage(n);
              }
            }
          }
        } catch (err) {
          if (gen !== reader.gen) return;
          console.error("openBook background pdf.js load failed:", err);
        }
      }

      function buildPlaceholders() {
        if (reader.observer) reader.observer.disconnect();
        const frag = document.createDocumentFragment();
        // The panel can be measured at 0 before its first layout — a
        // negative width would build invisible zero-height placeholders
        // and the observer would never fire on them, leaving the panel
        // dark forever. Zoom multiplies the layout width.
        const width = Math.max(
          280,
          Math.round((readerPagesEl.clientWidth - 35) * reader.zoom)
        );
        const height = Math.round(width * (reader.baseRatio || 1.414));
        for (let n = 1; n <= reader.pageCount; n++) {
          const el = document.createElement("div");
          el.className = "reader-page";
          el.dataset.page = n;
          el.style.width = `${width}px`;
          el.style.height = `${height}px`;
          frag.append(el);
          reader.recs.set(n, { el, rendered: false, job: null });
        }
        readerPagesEl.append(frag);
        // Render entries lazily but SERIALIZED, ordered by distance from
        // the scroll anchor (ADR-0017): one page at a time — a long jump
        // (page 1 → 740) crosses dozens of placeholders, and concurrent
        // canvas paints would freeze the sheet — but the anchor's own
        // page goes FIRST, where the old first-come chain made the jump
        // target wait behind every neighbor the observer had queued.
        reader.queue = new Set();
        reader.pump = null;
        reader.observer = new IntersectionObserver(
          (entries) => {
            for (const entry of entries) {
              if (!entry.isIntersecting) continue;
              enqueuePage(Number(entry.target.dataset.page));
            }
          },
          { root: readerPagesEl, rootMargin: "700px 0px" }
        );
        for (const rec of reader.recs.values()) {
          reader.observer.observe(rec.el);
        }
      }

      // The render scheduler: a Set of pending page numbers drained by
      // one worker, each pick the page nearest the anchor (the stick of
      // a jump, else the page the scroll handler last saw in view —
      // measuring 800 rects per render is a jank the reader can't
      // afford). renderPage stays serialized — only the order moved.
      function enqueuePage(n) {
        if (!reader.recs.has(n)) return;
        reader.queue.add(n);
        pumpPages();
      }

      function pumpPages() {
        if (reader.pump) return;
        reader.pump = (async () => {
          while (reader.queue.size) {
            const anchor = reader.stick ?? reader.current ?? 1;
            let best = null;
            let bestDist = Infinity;
            for (const n of reader.queue) {
              const dist = Math.abs(n - anchor);
              if (dist < bestDist) {
                bestDist = dist;
                best = n;
              }
            }
            reader.queue.delete(best);
            await renderPage(best).catch(() => {});
          }
        })().finally(() => {
          reader.pump = null;
        });
      }

      async function renderPage(n) {
        const rec = reader.recs.get(n);
        if (!rec || rec.rendered || rec.job) return;
        const gen = reader.gen;
        rec.job = (async () => {
          let vp = null;
          let page = null;
          if (reader.pdf && reader.pdfDoc === reader.doc) {
            try {
              page = await reader.pdf.getPage(n);
              vp = page.getViewport({ scale: 1 });
            } catch (e) {
              console.warn("pdf.getPage failed for page", n, e);
            }
          }
          const widthPx = Math.max(
            280,
            Math.round((readerPagesEl.clientWidth - 35) * reader.zoom)
          );
          const heightPx = vp
            ? Math.round(widthPx * (vp.height / vp.width))
            : Math.round(widthPx * (reader.baseRatio || 1.414));
          const dpr = Math.min(2.5, window.devicePixelRatio || 1);
          const img = document.createElement("img");
          img.className = "reader-img";
          img.alt = `صفحهٔ ${toPersianDigits(n)}`;
          img.decoding = "async";
          const fullSrc = `/books/${encodeURIComponent(reader.doc)}/page/${n}.png?w=${Math.round(
            widthPx * dpr
          )}`;
          if (reader.fastPaint === n) {
            // The far jump's first paint (ADR-0017): the small cached
            // bucket fills the placeholder immediately — a page that
            // arrives blurry in 0.2s beats one that arrives sharp in
            // 3s — and the full-width raster swaps in on load. Both
            // buckets are `immutable`-cached; the pre-warm only ever
            // costs its bytes once.
            reader.fastPaint = null;
            img.src = `/books/${encodeURIComponent(reader.doc)}/page/${n}.png?w=480`;
            img.addEventListener(
              "load",
              () => {
                if (gen !== reader.gen) return;
                img.src = fullSrc;
              },
              { once: true }
            );
          } else {
            img.src = fullSrc;
          }
          // A failed raster must not read as a silently blank page (the
          // 09-28 outage: the server 404'd every cold render and the
          // panel just stayed white). One cache-busted retry, then the
          // reader says so — and the page stays un-rendered so a later
          // ensureRendered/observer pass can try it again.
          let imgRetried = false;
          img.addEventListener("error", () => {
            if (gen !== reader.gen) return;
            if (!imgRetried) {
              imgRetried = true;
              img.src = `${fullSrc}&retry=1`;
              return;
            }
            rec.rendered = false;
            showReaderNote("رندر صفحه ناموفق بود", "error");
          });
          rec.el.replaceChildren(img);
          rec.el.style.height = `${heightPx}px`;

          // The transparent selection layer, positioned over the raster.
          if (page && vp) {
            try {
              const textLayerEl = document.createElement("div");
              textLayerEl.className = "textLayer";
              // The layer's spans read this to size themselves against the
              // raster (the CSS above composes it into font-size/transform);
              // zoom/resize re-renders every page, so it can never go stale.
              textLayerEl.style.setProperty(
                "--total-scale-factor",
                String(widthPx / vp.width)
              );
              const layer = new reader.lib.TextLayer({
                textContentSource: page.streamTextContent(),
                container: textLayerEl,
                viewport: page.getViewport({ scale: widthPx / vp.width }),
              });
              await layer.render();
              if (gen !== reader.gen) return;
              reorderTextLayerInReadingOrder(textLayerEl);
              rec.el.append(textLayerEl);
              const content = await page.getTextContent();
              if (gen !== reader.gen) return;
              buildPageParts(rec, content.items, vp);
            } catch (err) {
              console.warn("TextLayer render failed:", err);
            }
          }
          rec.rendered = true;
          // A page that painted img-only before pdf.js finished (the upgrade
          // loop only rescues pages it saw rendered before its pass) must not
          // stay unselectable forever: requeue once now that the document is
          // live and the layer is still missing.
          if (
            reader.pdf &&
            reader.pdfDoc === reader.doc &&
            !rec.el.querySelector(".textLayer") &&
            !rec.layerRetry
          ) {
            rec.layerRetry = true;
            rec.rendered = false;
            enqueuePage(n);
          }
        })();
        try {
          await rec.job;
        } catch (err) {
          rec.rendered = false;
          console.error("renderPage failed:", err);
          showReaderNote(
            "رندر صفحه ناموفق بود: " + String(err && err.message ? err.message : err),
            "error"
          );
        } finally {
          rec.job = null;
          // The waiter pattern: ensureRendered resolves the exact page
          // it asked for, whether the scheduler rendered it just now or
          // the page was already done when the wait began.
          const resolve = rec.resolve;
          rec.promise = null;
          rec.resolve = null;
          resolve?.();
        }
      }

      // A copied selection from the book's text layer must not carry the
      // extraction noise (backspace separators, tatweel, RTL scatter) — the
      // clipboard gets the clean text the note and chat surfaces expect.
      readerPagesEl.addEventListener("copy", (e) => {
        const sel = document.getSelection();
        if (!sel || sel.isCollapsed || !sel.rangeCount) return;
        const inLayer = (node) =>
          node &&
          (node.nodeType === 1 ? node : node.parentElement)?.closest?.(
            ".textLayer"
          );
        if (!inLayer(sel.anchorNode) && !inLayer(sel.focusNode)) return;
        e.preventDefault();
        e.clipboardData.setData("text/plain", cleanFarsi(sel.toString()));
      });

      // ---- The selection popover (variant A, the selection map 2026-10-01) ----
      // A live selection inside a chat message or the book's text layer is
      // the one door to the researcher's notebook: a small floating
      // toolbar rides beside the selection and the note quick-saves with
      // defaults — capture first, edit later in the panel. The ask verb
      // is staged disabled here and joins with the in-book chat drawer.
      const selectionPopEl = document.getElementById("selection-pop");
      const selectionAddBtn = document.getElementById("selection-add");
      const selectionAskBtn = document.getElementById("selection-ask");
      selectionAddBtn.textContent = ADD_TO_NOTE_LABEL;
      selectionAskBtn.textContent = ASK_FROM_SELECTION_LABEL;
      // The notebook's client cache — the panel's read refills it and
      // every mutation keeps it honest in place.
      let noteStaging = [];
      let selectionSurface = null; // "book" | "chat" | null
      let selectionSyncTimer = null;

      const noteToastEl = document.getElementById("note-toast");
      const noteToastMsg = document.getElementById("note-toast-msg");
      const noteToastAct = document.getElementById("note-toast-act");
      let noteToastTimer = null;
      function showToast(message, action) {
        noteToastMsg.textContent = message;
        if (action) {
          noteToastAct.textContent = action.label;
          noteToastAct.hidden = false;
          noteToastAct.onclick = () => {
            noteToastEl.classList.remove("show");
            action.run();
          };
        } else {
          noteToastAct.hidden = true;
          noteToastAct.onclick = null;
        }
        noteToastEl.classList.add("show");
        clearTimeout(noteToastTimer);
        noteToastTimer = setTimeout(
          () => noteToastEl.classList.remove("show"),
          3200
        );
      }

      function selectionSurfaceOf(node) {
        const el = node && (node.nodeType === 1 ? node : node.parentElement);
        if (!el || !el.closest) return null;
        if (el.closest(".textLayer")) return "book";
        if (el.closest(".msg-user, .msg-assistant")) return "chat";
        return null;
      }

      function hideSelectionPop() {
        selectionPopEl.classList.remove("show");
        selectionSurface = null;
      }

      function placeSelectionPop(rect) {
        const pop = selectionPopEl;
        pop.classList.add("show");
        const margin = 10;
        const w = pop.offsetWidth;
        const h = pop.offsetHeight;
        let top = rect.top - h - margin;
        if (top < 8) {
          top = Math.min(rect.bottom + margin, window.innerHeight - h - 8);
        }
        let left = rect.left + rect.width / 2 - w / 2;
        left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
        pop.style.top = `${top}px`;
        pop.style.left = `${left}px`;
      }

      function syncSelectionPop() {
        const sel = document.getSelection();
        if (!sel || sel.isCollapsed || !sel.rangeCount) {
          hideSelectionPop();
          return;
        }
        const startSurface = selectionSurfaceOf(sel.anchorNode);
        if (!startSurface || startSurface !== selectionSurfaceOf(sel.focusNode)) {
          hideSelectionPop();
          return;
        }
        selectionSurface = startSurface;
        // The ask verb only reads on the book — a chat answer already
        // came from the assistant.
        selectionAskBtn.hidden = startSurface !== "book";
        selectionAskBtn.disabled = false;
        const rect = sel.getRangeAt(0).getBoundingClientRect();
        if (rect.width || rect.height) placeSelectionPop(rect);
      }

      // The book's selection → the note's durable shape: per-page clamped
      // text via cleanFarsi, and a text-ref per page in the page's
      // normalized stream — the exact coordinate matchOnPage/paintMatch
      // consume, so a stored note re-highlights deterministically later.
      function selectionToNote() {
        const sel = document.getSelection();
        if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
        if (!selectionSurface) return null;
        const note = {
          doc: null,
          pages: [],
          text: "",
          refs: [],
          source: null,
          created: Date.now(),
        };
        if (selectionSurface === "book") {
          const range = sel.getRangeAt(0);
          note.doc = reader.doc;
          note.source = {
            kind: "book",
            doc: reader.doc,
            title: BOOK_TITLES[reader.doc] || reader.doc,
          };
          const pageEls = [
            ...readerPagesEl.querySelectorAll(".reader-page"),
          ].filter(
            (el) =>
              range.intersectsNode(el) && el.querySelector(".textLayer")
          );
          for (const pageEl of pageEls) {
            const n = Number(pageEl.dataset.page);
            const rec = reader.recs.get(n);
            const spans = pageEl.querySelectorAll(".textLayer span");
            if (!spans.length) continue;
            let pageText;
            if (sel.containsNode(pageEl, false)) {
              pageText = [...spans].map((s) => s.textContent).join("");
            } else {
              const r = range.cloneRange();
              try {
                if (pageEl.contains(range.startContainer)) {
                  r.setStart(range.startContainer, range.startOffset);
                } else {
                  r.setStartBefore(spans[0]);
                }
                if (pageEl.contains(range.endContainer)) {
                  r.setEnd(range.endContainer, range.endOffset);
                } else {
                  r.setEndAfter(spans[spans.length - 1]);
                }
                pageText = r.toString();
              } catch (err) {
                pageText = sel.toString();
              }
            }
            // Reading order, not DOM order: the layer's spans carry the
            // extraction scatter, so the note text and its ref needle are
            // re-read in the stream's own geometric order (top-to-bottom,
            // then right-to-left — the order buildPageParts speaks).
            const selSpans = [...spans].filter((s) =>
              range.intersectsNode(s)
            );
            const reading = selSpans
              .map((s) => ({
                s,
                top: parseFloat(s.style.top) || 0,
                left: parseFloat(s.style.left) || 0,
              }))
              .sort((p, q) => p.top - q.top || q.left - p.left)
              .map((p) => p.s.textContent)
              .join("");
            const pageRaw = reading || pageText;
            note.text += (note.text ? "\n" : "") + cleanFarsi(pageRaw);
            // The ref lives in the page's normalized stream — never raw
            // DOM order, whose extraction scatter and backspace noise
            // never match. Whole-page notes skip the re-read (already in
            // reading order via the stream itself) and match directly.
            const needle = normStream(pageRaw);
            const m =
              needle.length >= 8 && rec && rec.stream
                ? matchOnPage(rec, needle)
                : null;
            note.pages.push(n);
            note.refs.push({
              page: n,
              at: m ? m.at : null,
              len: m ? m.len : null,
              full: m ? m.full : false,
            });
          }
          if (!note.pages.length) return null;
        } else {
          note.text = cleanFarsi(sel.toString());
          note.source = {
            kind: "session",
            session_id: sessionState.storeId,
            title: null,
          };
        }
        return note;
      }

      // Pressing a toolbar button must not collapse the selection the
      // note is about to capture.
      selectionPopEl.addEventListener("mousedown", (e) => e.preventDefault());
      selectionAddBtn.addEventListener("click", () => {
        const note = selectionToNote();
        hideSelectionPop();
        if (!note) return;
        fetch("/notes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: note.text,
            doc: note.doc,
            pages: note.pages,
            refs: note.refs,
            source: note.source,
          }),
        })
          .then(async (res) => {
            const saved = res.ok ? await res.json() : null;
            if (saved && saved.id) noteStaging.unshift(saved);
            showToast(NOTE_SAVED_TOAST, {
              label: NOTE_VIEW_ACTION,
              run: openNotebook,
            });
          })
          .catch(() => {
            // The capture must never feel lost — the row keeps it in
            // memory even when the store could not be reached.
            noteStaging.unshift({ ...note, id: null, category: "", opinion: "" });
            showToast(NOTE_SAVED_TOAST);
          });
      });

      document.addEventListener("mouseup", () => {
        clearTimeout(selectionSyncTimer);
        selectionSyncTimer = setTimeout(syncSelectionPop, 0);
      });
      document.addEventListener("touchend", () => {
        clearTimeout(selectionSyncTimer);
        selectionSyncTimer = setTimeout(syncSelectionPop, 250);
      });
      document.addEventListener("selectionchange", () => {
        const sel = document.getSelection();
        if (!sel || sel.isCollapsed) hideSelectionPop();
        clearTimeout(selectionSyncTimer);
        selectionSyncTimer = setTimeout(syncSelectionPop, 220);
      });
      window.addEventListener("scroll", hideSelectionPop, true);
      document.addEventListener("mousedown", (e) => {
        if (!selectionPopEl.contains(e.target)) hideSelectionPop();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") hideSelectionPop();
      });

      // ---- The in-book chat (variant A, ticket 03/09) ----
      // The selection's own Q&A drawer. It drives the SAME pipeline the
      // main thread does — /api/v1/recall then the picker and the
      // writer with the sitting's id and ask key — because the PHASE
      // ENDPOINTS settle the answer SERVER-SIDE (the vanishing-content
      // fix): whatever shape the drawer paints, the store holds the
      // exact same article the main thread's resume renders. The
      // drawer's render is only a compact view. Metering is identical:
      // the recall rides the same gate (Balance + the day's cap), the
      // phases ride the composer tap, and the cost line reads
      // /usage/live after each settle. The research toggle does not
      // exist here (v1).
      const textAskEl = document.getElementById("text-ask");
      const taTitleEl = document.getElementById("ta-title");
      const taCloseEl = document.getElementById("ta-close");
      const taChipEl = document.getElementById("ta-chip");
      const taThreadEl = document.getElementById("ta-thread");
      const taCostEl = document.getElementById("ta-cost");
      const taFormEl = document.getElementById("ta-form");
      const taInputEl = document.getElementById("ta-input");
      const taSendEl = document.getElementById("ta-send");
      const taHandoffEl = document.getElementById("ta-handoff");
      taTitleEl.textContent = IN_BOOK_CHAT_TITLE;
      textAskEl.setAttribute("aria-label", IN_BOOK_CHAT_TITLE);
      taSendEl.textContent = ASK_SEND_LABEL;
      taInputEl.placeholder = NB_CHAT_PREFILL;
      taHandoffEl.textContent = NB_CHAT_HANDOFF;
      let taSession = null;
      let taBusy = false;
      let taSelection = null;
      // The recall payload's text, the main ask's own shape (a Cognee
      // results array or a bare object) — mirrored here because the
      // original rides the main ask's closure.
      const taTextOf = (payload) =>
        Array.isArray(payload) ? payload[0]?.text || "" : payload.text || "";

      function closeTextAsk() {
        textAskEl.hidden = true;
      }
      taCloseEl.addEventListener("click", closeTextAsk);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !textAskEl.hidden) closeTextAsk();
      });
      // A quote click leaves for the Book — the drawer steps aside.
      textAskEl.addEventListener("click", (e) => {
        if (e.target.closest && e.target.closest(".cite-sent")) {
          closeTextAsk();
        }
      });

      async function taRefreshCost() {
        try {
          const res = await fetch("/usage/live");
          if (!res.ok) return;
          const data = await res.json();
          const sessionToman = data.session_toman ?? 0;
          taCostEl.textContent = `هزینۀ نشست: ${sessionToman.toLocaleString(
            "fa-IR"
          )} تومان`;
          taCostEl.hidden = false;
        } catch (err) {}
      }

      selectionAskBtn.addEventListener("click", () => {
        const note = selectionToNote();
        hideSelectionPop();
        if (!note || !note.doc) return;
        openTextAsk({
          text: note.text,
          doc: note.doc,
          pages: note.pages,
          refs: note.refs,
        });
      });

      async function openTextAsk(selCtx) {
        taSelection = selCtx;
        taChipEl.textContent = `«${selCtx.text.slice(0, 160)}${
          selCtx.text.length > 160 ? "…" : ""
        }»`;
        taChipEl.hidden = false;
        taThreadEl.replaceChildren();
        taCostEl.hidden = true;
        taSession = null;
        taInputEl.value = NB_CHAT_PREFILL;
        textAskEl.hidden = false;
        taSendEl.disabled = true;
        try {
          // Each fresh selection opens a REAL Session (the ticket-03
          // shape): titled by the selection, bound to the open Book.
          const res = await fetch("/sessions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              book: selCtx.doc,
              title: truncateTitle(selCtx.text),
            }),
          });
          if (res.ok) {
            const created = await res.json();
            taSession = created.id || null;
          }
        } catch (err) {}
        taSendEl.disabled = false;
        taInputEl.focus();
      }

      taFormEl.addEventListener("submit", (e) => {
        e.preventDefault();
        const query = taInputEl.value.trim();
        if (!query || taBusy || !taSession) return;
        taInputEl.value = "";
        taAsk(query);
      });

      async function taAsk(query) {
        taBusy = true;
        taSendEl.disabled = true;
        const askKey = "ask-" + Date.now();
        // The operator's turn lands like the main thread's — and the
        // first message of a selection-bound sitting carries the
        // selection's provenance ({doc, pages, refs}) in its payload.
        const payload = { text: query };
        if (taSelection) {
          payload.selection = {
            doc: taSelection.doc,
            pages: taSelection.pages,
            refs: taSelection.refs,
          };
          taSelection = null; // only the ask that opened the sitting carries it
        }
        fetch(`/sessions/${taSession}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ role: "user", payload }),
        }).catch(() => {});
        const userP = document.createElement("div");
        userP.className = "ta-m q";
        userP.textContent = query;
        taThreadEl.append(userP);
        const answerEl = document.createElement("div");
        answerEl.className = "ta-m a";
        const answerBody = document.createElement("div");
        answerBody.className = "answer";
        answerEl.append(answerBody);
        taThreadEl.append(answerEl);
        taThreadEl.scrollTop = taThreadEl.scrollHeight;
        setText(answerBody, "در حال بازیابی…", "empty");
        // The selection grounds the retrieval: the passage rides the
        // query so the Books' own words steer the search, and the
        // displayed question stays the operator's own.
        const recallQuery = taChipEl.hidden
          ? query
          : `${taChipEl.textContent}\n${query}`;
        let finalText = null;
        try {
          refreshUsageLive();
          const res = await fetch("/api/v1/recall", {
            method: "POST",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            body: JSON.stringify({
              searchType: "HYBRID_COMPLETION",
              query: recallQuery,
              datasets: [reader.doc],
              includeReferences: true,
              stream: true,
              session_id: taSession || undefined,
            }),
          });
          const ctype = res.headers.get("Content-Type") || "";
          if (ctype.includes("text/event-stream")) {
            let preview = "";
            let draftTimer = null;
            let gotFinal = false;
            let streamError = null;
            const paintDraft = () => {
              answerBody.classList.add("draft-stream");
              renderMarkdown(answerBody, preview);
              taThreadEl.scrollTop = taThreadEl.scrollHeight;
            };
            await readSse(res, (name, data) => {
              if (name === "stage") {
                setText(
                  answerBody,
                  JSON.parse(data).stage === "generating"
                    ? "در حال تولید پاسخ…"
                    : "در حال بازیابی…",
                  "empty"
                );
              } else if (name === "delta") {
                preview += JSON.parse(data).text || "";
                if (draftTimer) return;
                paintDraft();
                draftTimer = setTimeout(() => {
                  draftTimer = null;
                  paintDraft();
                }, 200);
              } else if (name === "reset") {
                preview = "";
                setText(answerBody, "در حال تولید پاسخ…", "empty");
              } else if (name === "error") {
                streamError = new Error(
                  JSON.parse(data).message || "خطا در جریان پاسخ."
                );
              } else if (name === "final") {
                gotFinal = true;
                if (draftTimer) clearTimeout(draftTimer);
                answerBody.classList.remove("draft-stream");
                finalText = taTextOf(JSON.parse(data).results);
              }
            });
            if (!gotFinal) throw streamError || new Error("پاسخ نیامد.");
          } else {
            const data = await res.json();
            if (!res.ok) {
              const detail = Array.isArray(data.detail)
                ? data.detail.join(" ")
                : data.detail;
              throw new Error(detail || "پاسخ نیامد.");
            }
            finalText = taTextOf(data);
          }
        } catch (err) {
          // The gate's own Persian detail (zero Balance, the day's cap)
          // rides err.message — the drawer says exactly what the main
          // thread would.
          answerBody.replaceChildren();
          const note = document.createElement("p");
          note.className = "empty";
          note.textContent =
            err && err.message ? err.message : "ارتباط با سرویس پاسخ قطع شد.";
          answerBody.append(note);
          taBusy = false;
          taSendEl.disabled = false;
          return;
        }
        const { answer, citations } = splitCitation(finalText);
        const prose = answer || finalText;
        const sources = evidenceSources(citations);
        const fallbackToProse = () => {
          answerBody.classList.remove("draft-stream");
          renderMarkdown(answerBody, prose);
        };
        // Phase 1 — the picker's verbatim sentences are the first
        // answer, exactly as the main thread shows them; the picker
        // settles the ask's snapshot SERVER-SIDE.
        (async () => {
          try {
            const res = await fetch("/quote-selection", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                question: query,
                sources,
                session_id: taSession || undefined,
                ask_key: askKey,
              }),
            });
            refreshUsageLive();
            taRefreshCost();
            const data = res.ok ? await res.json() : {};
            const selections = Array.isArray(data.selections)
              ? data.selections
              : [];
            if (!selections.length) {
              fallbackToProse();
              return;
            }
            const doc = document.createDocumentFragment();
            for (const item of selections) {
              const sentence = document.createElement("p");
              sentence.className = "doc-para";
              const span = document.createElement("span");
              span.className = "cite-sent";
              span.tabIndex = 0;
              span.textContent = cleanFarsi(item.text);
              span.dataset.ref = citationRef(item);
              const located = parseReference(item.reference);
              wireQuoteSpan(
                span,
                located.doc,
                located.first ? `${located.first}-${located.last}` : ""
              );
              sentence.append(span);
              if (item.pages_label) {
                const pages = document.createElement("span");
                pages.className = "cite-pages";
                pages.textContent = ` [${item.pages_label}]`;
                sentence.append(pages);
              }
              doc.append(sentence);
            }
            answerBody.classList.remove("draft-stream");
            answerBody.replaceChildren(doc);
          } catch (err) {
            fallbackToProse();
          }
        })();
        // Phase 2 — the cited document under the first answer; the
        // writer settles the article SERVER-SIDE, so the handoff's
        // resume renders the very same document.
        (async () => {
          const docWrap = document.createElement("div");
          docWrap.className = "ta-doc";
          answerEl.append(docWrap);
          try {
            const res = await fetch("/quoted-answer", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                question: query,
                answer: prose,
                sources,
                session_id: taSession || undefined,
                ask_key: askKey,
              }),
            });
            refreshUsageLive();
            taRefreshCost();
            if (!res.ok) return;
            const data = await res.json();
            const blocks = Array.isArray(data.blocks) ? data.blocks : [];
            const doc = document.createDocumentFragment();
            if (data.truncated) {
              const note = document.createElement("p");
              note.className = "empty";
              note.textContent = truncatedNote().textContent;
              doc.append(note);
            }
            for (const block of blocks) {
              if (block.type === "heading") {
                const heading = document.createElement("h3");
                heading.className = "doc-heading";
                heading.textContent = block.text;
                doc.append(heading);
              } else if (block.type === "paragraph") {
                doc.append(paragraphNode(block));
              }
            }
            if (blocks.length) docWrap.replaceChildren(doc);
            taThreadEl.scrollTop = taThreadEl.scrollHeight;
          } catch (err) {}
        })();
        taBusy = false;
        taSendEl.disabled = false;
      }

      // The handoff (the ticket-03 shape): the armed jump — the drawer
      // and the reader step aside and the main thread opens THE SAME
      // sitting from the store, composer armed; the walk back to the
      // Book is any citation click.
      taHandoffEl.addEventListener("click", () => {
        const sid = taSession;
        closeTextAsk();
        if (!sid) return;
        const readerClose = document.getElementById("reader-close");
        if (readerClose && !document.getElementById("reader").hidden) {
          readerClose.click();
        }
        openStoreSession(sid);
      });


      // ---- The Notebook panel (ticket 02's shape, ticket 08's body) ----
      // The researcher's surface: grouped by category, searched, filtered,
      // edited in place, deleted two-step, and exported through a plain
      // print view — no PDF library, just the browser's own printer.
      const notebookEl = document.getElementById("notebook");
      const notebookOpenBtn = document.getElementById("notebook-open");
      const nbTitleEl = document.getElementById("nb-title");
      const nbCloseEl = document.getElementById("nb-close");
      const nbSearchEl = document.getElementById("nb-search");
      const nbFilterEl = document.getElementById("nb-filter");
      const nbSortEl = document.getElementById("nb-sort");
      const nbBulkEl = document.getElementById("nb-bulk");
      const nbCopyEl = document.getElementById("nb-copy");
      const nbExportEl = document.getElementById("nb-export");
      const nbDelManyEl = document.getElementById("nb-del-many");
      const nbListEl = document.getElementById("nb-list");
      const nbCountEl = document.getElementById("nb-count");
      nbTitleEl.textContent = NOTEBOOK_LABEL;
      notebookOpenBtn.textContent = NOTEBOOK_LABEL;
      nbSearchEl.placeholder = NB_SEARCH_PLACEHOLDER;
      nbSearchEl.setAttribute("aria-label", NB_SEARCH_PLACEHOLDER);
      nbFilterEl.options[0].textContent = NB_FILTER_ALL;
      nbFilterEl.options[1].textContent = NB_FILTER_BOOKS;
      nbFilterEl.options[2].textContent = NB_FILTER_SESSIONS;
      nbSortEl.options[0].textContent = NB_SORT_NEW;
      nbSortEl.options[1].textContent = NB_SORT_OLD;
      nbCopyEl.textContent = NOTE_COPY_SELECTED;
      nbExportEl.textContent = NOTE_EXPORT_PDF;
      nbDelManyEl.textContent = NOTE_DELETE_SELECTED;
      const nbChecks = new Set();
      let nbArmTimer = null;

      function openNotebook() {
        notebookEl.hidden = false;
        notebookOpenBtn.setAttribute("aria-expanded", "true");
        loadNotes();
      }
      function closeNotebook() {
        notebookEl.hidden = true;
        notebookOpenBtn.setAttribute("aria-expanded", "false");
      }
      notebookOpenBtn.addEventListener("click", () => {
        if (notebookEl.hidden) openNotebook();
        else closeNotebook();
      });
      nbCloseEl.addEventListener("click", closeNotebook);
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape" || notebookEl.hidden) return;
        // Escape peels one layer: the open editor first, then the panel.
        const openEditor = notebookEl.querySelector(".nb-editor.open");
        if (openEditor) openEditor.classList.remove("open");
        else closeNotebook();
      });
      [nbSearchEl, nbFilterEl, nbSortEl].forEach((el) =>
        el.addEventListener("input", renderNotes)
      );

      async function loadNotes() {
        try {
          const res = await fetch("/notes");
