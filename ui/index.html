<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>نشست · طرح کلی اندیشۀ اسلامی در قرآن · انسان ۲۵۰ ساله</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --table: #1b2a2e;
        --sheet: #e7eadf;
        --rule: #c9cfc0;
        --ink: #1a1f1c;
        --mute: #4d5852;
        --clay: #c45c26;
        --ok: #2f6f4e;
        --bad: #8f2d2d;
        --focus: #1f4d63;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: Vazirmatn, Tahoma, "Segoe UI", sans-serif;
        background: var(--table);
        color: var(--ink);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 2.5rem 1rem 4rem;
      }

      main {
        width: min(42rem, 100%);
        background: var(--sheet);
        padding: 2rem 1.75rem 2.25rem;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      }

      header {
        border-bottom: 1px solid var(--rule);
        padding-bottom: 1rem;
        margin-bottom: 1.25rem;
      }

      p.kicker {
        margin: 0 0 0.35rem;
        color: var(--clay);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        font-size: 1.45rem;
        font-weight: 700;
        line-height: 1.7;
      }

      .status {
        margin: 0.6rem 0 0;
        font-size: 0.85rem;
        color: var(--mute);
      }

      .status[data-state="up"] {
        color: var(--ok);
      }

      .status[data-state="down"] {
        color: var(--bad);
      }

      label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 0.4rem;
      }

      textarea {
        width: 100%;
        min-height: 8.5rem;
        resize: vertical;
        border: 0;
        border-bottom: 1px solid var(--ink);
        background: repeating-linear-gradient(
          to bottom,
          transparent,
          transparent 1.7rem,
          var(--rule) 1.7rem,
          var(--rule) 1.75rem
        );
        color: var(--ink);
        font: inherit;
        line-height: 1.75rem;
        padding: 0.15rem 0.1rem 0.6rem;
      }

      textarea:focus {
        outline: 2px solid var(--focus);
        outline-offset: 4px;
      }

      input[type="tel"] {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--ink);
        background: transparent;
        color: var(--ink);
        font: inherit;
        padding: 0.15rem 0.1rem 0.35rem;
      }

      input[type="tel"]:focus {
        outline: 2px solid var(--focus);
        outline-offset: 4px;
      }

      .phone-hint {
        margin: 0.25rem 0 0;
        font-size: 0.78rem;
        color: var(--mute);
      }

      .actions {
        display: flex;
        justify-content: flex-start;
        gap: 0.75rem;
        margin: 1rem 0 0;
      }

      button {
        font: inherit;
        font-weight: 700;
        color: var(--sheet);
        background: var(--ink);
        border: 0;
        padding: 0.55rem 1.4rem;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--clay);
      }

      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .elapsed {
        align-self: center;
        color: var(--mute);
        font-size: 0.85rem;
      }

      /* The three answering phases, one switchable section each (PM
         brief, 2026-09-11): the tab strip separates them; the running
         phase's dot pulses and its timer ticks, both frozen at settle. */
      .phase-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        margin-top: 1.75rem;
        border-bottom: 2px solid var(--rule);
      }

      .phase-tab {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        background: transparent;
        color: var(--mute);
        border: 0;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        padding: 0.5rem 0.75rem;
        font-size: 0.88rem;
      }

      .phase-tab:hover:not(:disabled),
      .phase-tab:focus-visible {
        background: rgba(0, 0, 0, 0.05);
      }

      .phase-tab[aria-selected="true"] {
        color: var(--ink);
        border-bottom-color: var(--clay);
      }

      .phase-tab:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .phase-dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: var(--rule);
        flex: none;
      }

      .phase-tab[data-state="running"] .phase-dot {
        background: var(--clay);
        animation: composer-pulse 1.2s ease-in-out infinite;
      }

      .phase-tab[data-state="done"] .phase-dot {
        background: var(--ok);
      }

      .phase-tab[data-state="failed"] .phase-dot {
        background: var(--bad);
      }

      .phase-tab[data-state="skipped"] .phase-dot {
        background: var(--mute);
      }

      .phase-timer {
        color: var(--mute);
        font-size: 0.75rem;
        font-weight: 500;
        direction: ltr;
        unicode-bidi: isolate;
      }

      .phase-tab[data-state="running"] .phase-timer {
        color: var(--clay);
      }

      .phase-now {
        margin: 0.7rem 0 0;
        color: var(--clay);
        font-size: 0.85rem;
      }

      .phase-now::before {
        content: "●";
        margin-left: 0.45rem;
        animation: composer-pulse 1.2s ease-in-out infinite;
      }

      .phase-panel {
        padding-top: 0.9rem;
      }

      .composer-truncated {
        margin: 0 0 0.85rem;
        color: var(--clay);
        font-size: 0.8rem;
        white-space: pre-wrap;
      }

      section.out {
        margin-top: 1.75rem;
      }

      h2 {
        margin: 0 0 0.5rem;
        font-size: 0.95rem;
        font-weight: 700;
      }

      .answer,
      .cite,
      .empty,
      .error {
        white-space: pre-wrap;
        line-height: 1.85;
      }

      .cite {
        margin: 0 0 0.85rem;
        padding: 0 0.9rem 0 0;
        border-right: 3px solid var(--clay);
        color: var(--mute);
      }

      .doc-heading {
        margin: 1.1rem 0 0.4rem;
        font-size: 1.02rem;
        font-weight: 700;
      }

      .composer-status {
        margin: 0.6rem 0 0;
        color: var(--mute);
        font-size: 0.85rem;
      }

      .composer-status::before {
        content: "●";
        margin-left: 0.45rem;
        color: var(--clay);
        animation: composer-pulse 1.2s ease-in-out infinite;
      }

      @keyframes composer-pulse {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }

      .doc-para {
        margin: 0 0 0.85rem;
      }

      .cite-pages {
        color: var(--mute);
        font-size: 0.78rem;
        font-weight: 500;
      }

      .cite-sent {
        position: relative;
        cursor: help;
        background: rgba(196, 92, 38, 0.12);
        border-bottom: 1px solid var(--clay);
      }

      .cite-sent:hover,
      .cite-sent:focus-visible {
        background: rgba(196, 92, 38, 0.18);
        outline: none;
      }

      .cite-sent:hover::after,
      .cite-sent:focus-visible::after {
        content: attr(data-ref);
        position: absolute;
        bottom: calc(100% + 0.35rem);
        right: 50%;
        transform: translateX(50%);
        width: max-content;
        max-width: 18rem;
        white-space: normal;
        background: var(--ink);
        color: var(--sheet);
        font-size: 0.78rem;
        font-weight: 500;
        line-height: 1.7;
        padding: 0.3rem 0.65rem;
        border-radius: 3px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
        z-index: 1;
      }

      .empty {
        color: var(--mute);
      }

      /* The collapsed Evidence pool (issue #28): the summary reads as a
         quiet disclosure under the Quote selection. */
      details summary {
        cursor: pointer;
        color: var(--mute);
        font-size: 0.85rem;
        margin: 0.75rem 0 0.5rem;
      }

      .error {
        color: var(--bad);
      }

      @media (max-width: 640px) {
        body {
          padding: 0;
        }

        main {
          min-height: 100vh;
          box-shadow: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="kicker">نشست · سه مرحلهٔ پاسخ</p>
        <h1>طرح کلی اندیشۀ اسلامی در قرآن · انسان ۲۵۰ ساله</h1>
        <p class="status" id="status" data-state="unknown">در حال بررسی سرویس…</p>
      </header>

      <form id="ask">
        <label for="phone">شمارهٔ تلفن</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          inputmode="tel"
          autocomplete="tel"
          maxlength="16"
          placeholder="۰۹۱۲۳۴۵۶۷۸۹"
        />
        <p class="phone-hint">هر شماره در روز پنج گفتگو دارد.</p>
        <label for="question" style="margin-top: 1rem">پرسش</label>
        <textarea
          id="question"
          name="question"
          required
          maxlength="2000"
          placeholder="پرسش خود را بنویسید"
        ></textarea>
        <div class="actions">
          <button type="submit" id="ask-btn">بپرس</button>
          <span class="elapsed" id="elapsed" hidden></span>
          <span class="elapsed" id="ttft" hidden></span>
        </div>
      </form>

      <section class="out" aria-live="polite">
        <div class="phase-tabs" role="tablist" aria-label="مراحل پاسخ">
          <button
            type="button"
            class="phase-tab"
            id="tab-1"
            role="tab"
            aria-selected="true"
            aria-controls="panel-1"
            data-state="idle"
          >
            <span class="phase-dot" aria-hidden="true"></span>
            <span class="phase-name">پاسخ اول</span>
          </button>
          <button
            type="button"
            class="phase-tab"
            id="tab-2"
            role="tab"
            aria-selected="false"
            aria-controls="panel-2"
            data-state="idle"
            disabled
          >
            <span class="phase-dot" aria-hidden="true"></span>
            <span class="phase-name">پاسخ استنادی</span>
            <span class="phase-timer" id="timer-2" hidden></span>
          </button>
          <button
            type="button"
            class="phase-tab"
            id="tab-3"
            role="tab"
            aria-selected="false"
            aria-controls="panel-3"
            data-state="idle"
            disabled
          >
            <span class="phase-dot" aria-hidden="true"></span>
            <span class="phase-name">مطالعۀ عمیق</span>
            <span class="phase-timer" id="timer-3" hidden></span>
          </button>
        </div>
        <p class="phase-now" id="phase-now" hidden></p>

        <div class="phase-panel" id="panel-1" role="tabpanel" aria-labelledby="tab-1">
          <div id="answer" class="answer">
            <p class="empty">هنوز پرسشی نپرسیده‌اید.</p>
          </div>
          <!-- The Evidence pool stays visible, collapsed (issue #28):
               the Quote selection renders as the first answer above it
               and the pool remains phase 2's exact payload. -->
          <details id="evidence-pool">
            <summary>همۀ نقل‌قول‌های بازیابی‌شده</summary>
            <h2 id="citations-heading">استناد</h2>
            <div id="citations">
              <p class="empty">پس از پاسخ، استناد اینجا می‌آید: هویت کتاب و عبارت نقل‌شده.</p>
            </div>
          </details>
        </div>

        <div class="phase-panel" id="panel-2" role="tabpanel" aria-labelledby="tab-2" hidden>
          <div id="quoted-doc" class="answer"></div>
        </div>

        <div class="phase-panel" id="panel-3" role="tabpanel" aria-labelledby="tab-3" hidden>
          <!-- The Deep dive is operator-started (ADR 0006): the button
               arms after the first answer exists; pressing it starts the
               dive job and the sheet polls its status. -->
          <div class="actions">
            <button type="button" id="dive-start" disabled>شروع مطالعۀ عمیق</button>
          </div>
          <div id="dive-doc" class="answer"></div>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById("ask");
      const phoneEl = document.getElementById("phone");
      const questionEl = document.getElementById("question");
      const buttonEl = document.getElementById("ask-btn");
      const elapsedEl = document.getElementById("elapsed");
      const ttftEl = document.getElementById("ttft");
      const answerEl = document.getElementById("answer");
      const citationsEl = document.getElementById("citations");
      const citationsHeadingEl = document.getElementById("citations-heading");
      const evidencePoolEl = document.getElementById("evidence-pool");
      const statusEl = document.getElementById("status");
      const quotedDocEl = document.getElementById("quoted-doc");
      const diveStartEl = document.getElementById("dive-start");
      const diveDocEl = document.getElementById("dive-doc");
      const phaseNowEl = document.getElementById("phase-now");
      // Bumped on every ask so a slow composer reply for an older question
      // is dropped instead of swapping the newer answer or its citations.
      let citationRun = 0;
      // In-flight phase 2 / dive fetches; aborted when a new ask starts.
      let quotedAbort = null;
      let diveAbort = null;
      // The current ask's question — the dive is a study of the same
      // question (CONTEXT.md), never of whatever the box holds later.
      let diveQuery = null;

      // The three answering phases (PM brief, 2026-09-11): one switchable
      // section each, a pulsing dot on the phase being generated, a
      // "now generating" line that stays truthful even from another tab,
      // and a per-phase timer for phases 2 and 3 that freezes at settle.
      const PHASE_NAMES = {
        1: "پاسخ اول",
        2: "پاسخ استنادی",
        3: "مطالعۀ عمیق",
      };
      const phaseEls = {
        1: { tab: document.getElementById("tab-1"), timer: null, interval: null, startedAt: null },
        2: { tab: document.getElementById("tab-2"), timer: document.getElementById("timer-2"), interval: null, startedAt: null },
        3: { tab: document.getElementById("tab-3"), timer: document.getElementById("timer-3"), interval: null, startedAt: null },
      };

      function selectPhase(n) {
        for (const p of [1, 2, 3]) {
          phaseEls[p].tab.setAttribute("aria-selected", p === n ? "true" : "false");
          document.getElementById(`panel-${p}`).hidden = p !== n;
        }
      }
      for (const n of [1, 2, 3]) {
        phaseEls[n].tab.addEventListener("click", () => selectPhase(n));
      }

      // idle = not started yet (tab disabled); ready = waiting for the
      // operator; running = being generated; done / failed / skipped =
      // settled. Only idle tabs stay unclickable.
      function setPhaseState(n, state) {
        phaseEls[n].tab.dataset.state = state;
        phaseEls[n].tab.disabled = state === "idle";
      }

      function clockText(ms) {
        const total = Math.max(0, Math.round(ms / 1000));
        return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
      }

      function startPhaseTimer(n, elapsedMs = 0) {
        const phase = phaseEls[n];
        if (!phase.timer) return;
        stopPhaseTimer(n);
        // elapsedMs reseeds an honest clock — a dive reconnected after a
        // refresh continues the job's elapsed, not this page load's.
        phase.startedAt = Date.now() - (elapsedMs || 0);
        phase.timer.hidden = false;
        const tickPhase = () => {
          phase.timer.textContent = clockText(Date.now() - phase.startedAt);
        };
        tickPhase();
        phase.interval = setInterval(tickPhase, 250);
      }

      function stopPhaseTimer(n) {
        const phase = phaseEls[n];
        if (phase.interval) {
          clearInterval(phase.interval);
          phase.interval = null;
        }
        if (phase.startedAt && phase.timer) {
          // The frozen chip IS the completion time: how long the phase took.
          phase.timer.textContent = clockText(Date.now() - phase.startedAt);
        }
      }

      function setRunningPhase(n) {
        if (n === null) {
          phaseNowEl.hidden = true;
          return;
        }
        phaseNowEl.hidden = false;
        phaseNowEl.textContent = `در حال تولید: ${PHASE_NAMES[n]}…`;
      }

      // The phone gates the sheet: each number gets five chats a day,
      // counted server-side. It rides in a header, remembered between
      // visits; the server never forwards it to Cognee. Headers are
      // latin-1, so Farsi digits are normalized before they ride.
      const toAsciiDigits = (value) =>
        String(value).replace(/[۰-۹٠-٩]/g, (ch) =>
          String.fromCharCode(ch.charCodeAt(0) & 0xf)
        );
      phoneEl.value = toAsciiDigits(localStorage.getItem("sessionPhone") || "");
      phoneEl.addEventListener("change", () => {
        phoneEl.value = toAsciiDigits(phoneEl.value.trim());
        localStorage.setItem("sessionPhone", phoneEl.value);
      });
      const phoneHeader = () => ({ "X-Session-Phone": phoneEl.value.trim() });

      function setText(el, text, className) {
        el.className = className;
        el.textContent = text;
      }

      // Phase-1 answers arrive as markdown (headings, bold, bullets);
      // render that structure, never the literal #/** characters.
      function markBold(el, text) {
        const parts = String(text).split(/\*\*(.+?)\*\*/g);
        parts.forEach((part, index) => {
          if (index % 2) {
            const strong = document.createElement("strong");
            strong.textContent = part;
            el.append(strong);
          } else if (part) {
            el.append(part);
          }
        });
      }

      function renderMarkdown(container, text) {
        container.replaceChildren();
        for (const block of String(text).split(/\n{2,}/)) {
          const lines = block.split("\n").filter((line) => line.trim());
          if (!lines.length) continue;
          if (lines.every((line) => /^\s*[-*]\s+/.test(line))) {
            const ul = document.createElement("ul");
            for (const line of lines) {
              const li = document.createElement("li");
              markBold(li, line.replace(/^\s*[-*]\s+/, ""));
              ul.append(li);
            }
            container.append(ul);
            continue;
          }
          for (const line of lines) {
            const heading = line.match(/^(#{1,4})\s+(.*)$/);
            const el = document.createElement(
              heading ? "h" + Math.min(heading[1].length + 2, 6) : "p"
            );
            markBold(el, heading ? heading[2] : line);
            container.append(el);
          }
        }
      }

      function splitCitation(text) {
        const marker = "Evidence:";
        const at = text.indexOf(marker);
        if (at === -1) {
          return { answer: text.trim(), citations: [] };
        }
        const answer = text.slice(0, at).trim();
        const rest = text.slice(at + marker.length).trim();
        const citations = rest
          .split(/\n-\s+/)
          .map((item) => item.replace(/^[-\s]+/, "").trim())
          .filter(Boolean);
        return { answer, citations };
      }

      // An Evidence bullet is `locator: "quoted passage"`. The quoted
      // passage is the composer's verbatim source pool.
      function evidenceSources(citations) {
        const sources = [];
        for (const item of citations) {
          const at = item.indexOf(': "');
          if (at === -1) {
            continue;
          }
          const reference = item.slice(0, at).trim();
          const passage = item.slice(at + 3).replace(/"$/, "").trim();
          if (reference && passage) {
            sources.push({ reference, passage });
          }
        }
        return sources;
      }

      // The tooltip's Citation text: Book identity plus the passage's
      // first page (resolved server-side from the Evidence locator) —
      // a passage without page markers cites the Book alone, never an
      // invented page.
      function citationRef(item) {
        if (item.book_label) {
          return item.first_page_label
            ? `${item.book_label} — ${item.first_page_label}`
            : item.book_label;
        }
        return item.first_page_label || "کتاب";
      }

      // One paragraph = AI text with embedded verbatim quotes (PM format,
      // 2026-09-10). Each quote sentence hovers to the Citation of exactly
      // the passage it claims — on that passage's first page — and the
      // paragraph ends with the full chunk-page range of every passage it
      // quoted, in order of first appearance.
      function paragraphNode(block) {
        const para = document.createElement("p");
        para.className = "doc-para";
        // The composer's text parts carry no reliable boundary spaces, so
        // each appended node is preceded by one when the run needs it.
        const appendPart = (node) => {
          const last = para.lastChild;
          if (
            last &&
            (last.nodeType !== Node.TEXT_NODE || !/\s$/.test(last.textContent))
          ) {
            para.append(" ");
          }
          para.append(node);
        };
        const parts = Array.isArray(block.parts) ? block.parts : [];
        const labels = [];
        parts.forEach((part) => {
          if (part.text) {
            appendPart(part.text);
          } else if (part.quote !== undefined) {
            const span = document.createElement("span");
            span.className = "cite-sent";
            span.tabIndex = 0;
            span.textContent = part.quote;
            // Book identity arrives per quote from the server (resolved
            // from the Evidence locator's document name) — with two
            // Books the attribution can no longer be implied.
            span.dataset.ref = citationRef(part);
            appendPart(span);
            if (part.pages_label && !labels.includes(part.pages_label)) {
              labels.push(part.pages_label);
            }
          }
        });
        labels.forEach((label) => {
          const pages = document.createElement("span");
          pages.className = "cite-pages";
          pages.textContent = `[${label}]`;
          appendPart(pages);
        });
        return para;
      }

      // Phase 2 runs in its own section: the streamed answer stays put in
      // phase 1's, and the guarded document lands in phase 2's only on
      // success — non-empty blocks mean the server's swap threshold passed
      // (at least two quoting paragraphs, or one plus a heading). On
      // failure, timeout, or an empty document the section says so and
      // phase 1's answer remains the answer (AC-4). The stream path is
      // untouched — this runs after the streamed answer has rendered (AC-5).
      function failQuotedPhase() {
        setPhaseState(2, "failed");
        stopPhaseTimer(2);
        setRunningPhase(null);
        quotedDocEl.replaceChildren();
        const note = document.createElement("p");
        note.className = "empty";
        note.textContent = "پاسخ استنادی آماده نشد؛ پاسخ اول در بخش خودش معتبر می‌ماند.";
        quotedDocEl.append(note);
      }

      function skipQuotedPhase() {
        setPhaseState(2, "skipped");
        quotedDocEl.replaceChildren();
        const note = document.createElement("p");
        note.className = "empty";
        note.textContent = "بدون استناد، پاسخ استنادی ساخته نمی‌شود؛ پاسخ اول معتبر می‌ماند.";
        quotedDocEl.append(note);
      }

      function truncatedNote() {
        const note = document.createElement("p");
        note.className = "composer-truncated";
        note.textContent = "سند به سقف طول مدل رسید و ادامه‌نویسی هم بریده شد؛ ممکن است بندهای پایانی ناتمام باشند.";
        return note;
      }

      async function renderQuotedAnswer(question, answer, citations, onSettled) {
        const run = citationRun;
        const sources = evidenceSources(citations);
        if (!sources.length) {
          skipQuotedPhase();
          onSettled();
          return;
        }
        setPhaseState(2, "running");
        startPhaseTimer(2);
        setRunningPhase(2);
        quotedDocEl.replaceChildren();
        // Phase 2 is visible while it runs: a pulsing status in its own
        // section, gone with the document (or with any fallback).
        const status = document.createElement("p");
        status.className = "composer-status";
        status.textContent = "در حال نوشتن پاسخ استنادی…";
        quotedDocEl.append(status);
        try {
          const res = await fetch("/quoted-answer", {
            method: "POST",
            headers: {
              "Content-Type": "application/json; charset=utf-8",
              ...phoneHeader(),
            },
            body: JSON.stringify({ question, answer, sources }),
            signal: quotedAbort.signal,
          });
          if (run !== citationRun) {
            return;
          }
          if (!res.ok) {
            failQuotedPhase();
            onSettled();
            return;
          }
          const payload = await res.json();
          if (run !== citationRun) {
            return;
          }
          const blocks = Array.isArray(payload.blocks) ? payload.blocks : [];
          if (!blocks.length) {
            failQuotedPhase();
            onSettled();
            return;
          }
          const doc = document.createDocumentFragment();
          // A document the continuation could not finish says so itself,
          // above its paragraphs.
          if (payload.truncated) {
            doc.append(truncatedNote());
          }
          for (const block of blocks) {
            if (block.type === "heading") {
              const heading = document.createElement("h3");
              heading.className = "doc-heading";
              heading.textContent = block.text;
              doc.append(heading);
            } else if (block.type === "paragraph") {
              doc.append(paragraphNode(block));
            }
          }
          quotedDocEl.replaceChildren(doc);
          setPhaseState(2, "done");
          stopPhaseTimer(2);
          setRunningPhase(null);
          // Bring the fresh document forward: each phase shows itself
          // when it lands.
          selectPhase(2);
          onSettled();
        } catch {
          if (run !== citationRun) {
            return;
          }
          // Composer unreachable: phase 1's answer and Evidence citations stay.
          failQuotedPhase();
          onSettled();
        }
      }

      // The Quote selection (ADR 0006, issue #28): the first answer is
      // the Evidence pool's verbatim Book sentences — ten aimed,
      // guarded 4-12 — picked server-side by EXACTLY ONE glm-5.3-flash
      // call. The streamed prose is no longer the displayed answer (it
      // still feeds the Quoted answer's framing), and an empty or
      // failed selection falls back to the prose render: the sheet is
      // never left empty. This runs in parallel with phase 2, which
      // receives the same pool as its payload; each lands in its own
      // tab. A new ask aborts this fetch with the rest (quotedAbort).
      async function renderQuoteSelection(question, prose, citations) {
        const run = citationRun;
        const sources = evidenceSources(citations);
        answerEl.replaceChildren();
        const status = document.createElement("p");
        status.className = "composer-status";
        status.textContent = "در حال انتخاب نقل‌قول‌ها…";
        answerEl.append(status);
        const fallbackToProse = () => {
          answerEl.className = "answer";
          renderMarkdown(answerEl, prose);
          const note = document.createElement("p");
          note.className = "empty";
          note.textContent = "انتخاب نقل‌قول‌ها آماده نشد؛ پاسخ جریان‌یافته به‌جای آن می‌ماند.";
          answerEl.append(note);
        };
        try {
          const res = await fetch("/quote-selection", {
            method: "POST",
            headers: {
              "Content-Type": "application/json; charset=utf-8",
              ...phoneHeader(),
            },
            body: JSON.stringify({ question, sources }),
            signal: quotedAbort.signal,
          });
          if (run !== citationRun) {
            return;
          }
          const payload = res.ok ? await res.json() : {};
          if (run !== citationRun) {
            return;
          }
          const selections = Array.isArray(payload.selections)
            ? payload.selections
            : [];
          if (!selections.length) {
            fallbackToProse();
            return;
          }
          const doc = document.createDocumentFragment();
          for (const item of selections) {
            const sentence = document.createElement("p");
            sentence.className = "doc-para";
            const span = document.createElement("span");
            span.className = "cite-sent";
            span.tabIndex = 0;
            span.textContent = item.text;
            // Same tooltip contract as the Quoted paragraph's quotes:
            // Book identity plus the passage's first page.
            span.dataset.ref = citationRef(item);
            sentence.append(span);
            if (item.pages_label) {
              const pages = document.createElement("span");
              pages.className = "cite-pages";
              pages.textContent = ` [${item.pages_label}]`;
              sentence.append(pages);
            }
            doc.append(sentence);
          }
          answerEl.className = "answer";
          answerEl.replaceChildren(doc);
        } catch {
          if (run !== citationRun) {
            return;
          }
          fallbackToProse();
        }
      }

      // The Deep dive (ADR 0006, issue #26): the phase-3 tab's
      // operator-started study, now a registry job. The start POST
      // answers a job identity immediately (202) and the sheet polls
      // /deep-dive/status on a chained setTimeout — no held request.
      // sessionStorage keeps the identity so a browser refresh
      // reconnects to the running dive instead of throwing minutes of
      // work away. The search shapes are pinned server-side: the sheet
      // sends only the query and the phone, and names no Cognee search
      // type.
      const DIVE_POLL_MS = 2000;
      let divePollTimer = null;
      let diveStatusEl = null;

      const storedDiveJob = () => {
        try {
          return JSON.parse(sessionStorage.getItem("sessionDive"));
        } catch {
          return null;
        }
      };
      const storeDiveJob = (job) =>
        sessionStorage.setItem("sessionDive", JSON.stringify(job));
      const clearDiveJob = () => sessionStorage.removeItem("sessionDive");

      function stopDivePolling() {
        if (divePollTimer) {
          clearTimeout(divePollTimer);
          divePollTimer = null;
        }
      }

      // The pulsing status line in panel 3 — the dive is visible while
      // it runs, gone with the study (or with any failure note).
      function showDiveStatus(message) {
        if (!diveStatusEl || !diveStatusEl.isConnected) {
          diveStatusEl = document.createElement("p");
          diveStatusEl.className = "composer-status";
          diveDocEl.replaceChildren(diveStatusEl);
        }
        diveStatusEl.textContent = message;
      }

      function renderDiveStudy(payload) {
        const doc = document.createDocumentFragment();
        // A study the continuation could not finish says so itself,
        // above its sections — phase 2's note, reused.
        if (payload.truncated) {
          doc.append(truncatedNote());
        }
        for (const block of Array.isArray(payload.blocks) ? payload.blocks : []) {
          if (block.type === "heading") {
            const heading = document.createElement("h3");
            heading.className = "doc-heading";
            heading.textContent = block.text;
            doc.append(heading);
          } else if (block.type === "paragraph") {
            doc.append(paragraphNode(block));
          } else if (block.type === "references") {
            // The closing references list — built server-side from the
            // passages the study actually quoted, never by the model.
            const refHeading = document.createElement("h3");
            refHeading.className = "doc-heading";
            refHeading.textContent = "منابع";
            doc.append(refHeading);
            for (const item of Array.isArray(block.items) ? block.items : []) {
              const ref = document.createElement("p");
              ref.className = "cite";
              ref.textContent = item;
              doc.append(ref);
            }
          }
        }
        diveDocEl.replaceChildren(doc);
        diveStatusEl = null;
        setPhaseState(3, "done");
        stopPhaseTimer(3);
        setRunningPhase(null);
        // Bring the fresh study forward: each phase shows itself when
        // it lands.
        selectPhase(3);
        diveStartEl.disabled = false;
      }

      // A dive that will never land says so and hands the sheet back:
      // the stored job clears, the timer freezes, the button re-arms.
      function settleDive(message) {
        stopDivePolling();
        clearDiveJob();
        setPhaseState(3, "failed");
        stopPhaseTimer(3);
        setRunningPhase(null);
        setText(diveDocEl, message, "error");
        diveStatusEl = null;
        diveStartEl.disabled = false;
      }

      function pollDiveJob(jobId) {
        const poll = async () => {
          let payload = null;
          let gone = false;
          try {
            const res = await fetch(
              `/deep-dive/status?job=${encodeURIComponent(jobId)}`,
              { headers: phoneHeader(), cache: "no-store" }
            );
            if (res.status === 404) {
              // Unknown job: the server restarted and took the registry
              // with it — the recorded failure surface, not a hang.
              gone = true;
            } else if (res.ok) {
              payload = await res.json();
            }
          } catch {
            // A transient network blip is not a settled dive — the
            // next tick retries.
          }
          if (gone) {
            settleDive("مطالعۀ عمیق ناتمام ماند؛ دوباره تلاش کنید.");
            return;
          }
          if (!payload) {
            divePollTimer = setTimeout(poll, DIVE_POLL_MS);
            return;
          }
          if (payload.state === "done") {
            if (!phaseEls[3].startedAt) {
              // Reconnected straight onto a finished study: seed the
              // frozen chip from the job's own elapsed.
              phaseEls[3].startedAt = Date.now() - (payload.elapsed || 0) * 1000;
            }
            renderDiveStudy(payload);
            clearDiveJob();
            return;
          }
          if (payload.state === "failed") {
            // The server names why the dive did not prepare (the
            // no-evidence note among them) — the generic message is
            // only the fallback when no detail rode the payload.
            const detail = Array.isArray(payload.detail)
              ? payload.detail.join(" ")
              : payload.detail;
            settleDive(detail || "مطالعۀ عمیق ناتمام ماند؛ دوباره تلاش کنید.");
            return;
          }
          if (payload.state === "aborted") {
            settleDive("مطالعۀ عمیق لغو شد.");
            return;
          }
          // Still running: an honest timer across a reload, and the
          // latest Farsi progress event on the status line.
          if (!phaseEls[3].startedAt && payload.elapsed) {
            startPhaseTimer(3, payload.elapsed * 1000);
          }
          const events = Array.isArray(payload.events) ? payload.events : [];
          showDiveStatus(events[events.length - 1] || "در حال نوشتن مطالعۀ عمیق…");
          divePollTimer = setTimeout(poll, DIVE_POLL_MS);
        };
        poll();
      }

      async function startDive() {
        const run = citationRun;
        const query = diveQuery;
        if (!query) return;
        setPhaseState(3, "running");
        setRunningPhase(3);
        diveStartEl.disabled = true;
        showDiveStatus("در حال نوشتن مطالعۀ عمیق…");
        try {
          const res = await fetch("/deep-dive", {
            method: "POST",
            headers: {
              "Content-Type": "application/json; charset=utf-8",
              ...phoneHeader(),
            },
            body: JSON.stringify({ query }),
            signal: diveAbort.signal,
          });
          if (run !== citationRun) return;
          const payload = await res.json().catch(() => ({}));
          if (run !== citationRun) return;
          // A rejection — a busy 429 among them — shows the server's
          // Farsi detail as an error; the timer never started for a
          // dive that did not begin.
          if (!res.ok || !payload.job_id) {
            const detail = Array.isArray(payload.detail)
              ? payload.detail.join(" ")
              : payload.detail;
            setPhaseState(3, "ready");
            setRunningPhase(null);
            setText(
              diveDocEl,
              detail || "مطالعۀ عمیق آماده نشد؛ دوباره تلاش کنید.",
              "error"
            );
            diveStatusEl = null;
            diveStartEl.disabled = false;
            return;
          }
          // The job is live: keep its identity for a refresh reconnect,
          // start the phase timer, and enter the polling loop.
          storeDiveJob({
            job_id: payload.job_id,
            query,
            phone: phoneEl.value.trim(),
          });
          startPhaseTimer(3);
          pollDiveJob(payload.job_id);
        } catch {
          if (run !== citationRun) return;
          // The sheet unreachable: the first answer and the Quoted
          // answer stay where they are.
          setPhaseState(3, "ready");
          setRunningPhase(null);
          setText(diveDocEl, "ارتباط با سرویس مطالعۀ عمیق قطع شد.", "error");
          diveStatusEl = null;
          diveStartEl.disabled = false;
        }
      }
      diveStartEl.addEventListener("click", startDive);

      // Refresh reconnect (issue #26): a stored job id means this phone
      // has a dive the reload must not throw away — poll once
      // immediately and re-enter whichever surface the job has reached
      // (running with the elapsed-seeded timer, the finished study, or
      // the settled failure note).
      (function reconnectDive() {
        const stored = storedDiveJob();
        if (!stored || !stored.job_id) return;
        if (stored.phone && stored.phone !== phoneEl.value.trim()) {
          clearDiveJob();
          return;
        }
        if (stored.query) diveQuery = stored.query;
        setPhaseState(3, "running");
        setRunningPhase(3);
        diveStartEl.disabled = true;
        showDiveStatus("در حال نوشتن مطالعۀ عمیق…");
        selectPhase(3);
        pollDiveJob(stored.job_id);
      })();

      async function readSse(res, onEvent) {
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        const dispatch = (frame) => {
          let name = "message";
          let data = "";
          for (const line of frame.split("\n")) {
            if (!line || line.startsWith(":")) continue;
            if (line.startsWith("event:")) name = line.slice(6).trim();
            else if (line.startsWith("data:")) data += line.slice(5).trim();
          }
          if (data) onEvent(name, data);
        };
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let at;
          while ((at = buffer.indexOf("\n\n")) !== -1) {
            dispatch(buffer.slice(0, at));
            buffer = buffer.slice(at + 2);
          }
        }
        buffer += decoder.decode();
        if (buffer.trim()) dispatch(buffer);
      }

      async function ping() {
        try {
          const res = await fetch("/health", { cache: "no-store" });
          if (!res.ok) throw new Error("down");
          statusEl.dataset.state = "up";
          statusEl.textContent = "سرویس آماده است.";
        } catch {
          statusEl.dataset.state = "down";
          statusEl.textContent = "سرویس پاسخ در دسترس نیست. اول Cognee را روشن کنید.";
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const query = questionEl.value.trim();
        if (!phoneEl.value.trim()) {
          phoneEl.focus();
          return;
        }
        if (!query) {
          questionEl.focus();
          return;
        }

        buttonEl.disabled = true;
        elapsedEl.hidden = false;
        ttftEl.hidden = false;
        ttftEl.textContent = "نخستین توکن: …";
        const started = Date.now();
        let firstTokenAt = null;
        const markFirstToken = () => {
          if (firstTokenAt !== null) return;
          firstTokenAt = Date.now();
          ttftEl.textContent = `نخستین توکن: ${((firstTokenAt - started) / 1000).toFixed(1)} ثانیه`;
        };
        const tick = setInterval(() => {
          const seconds = Math.round((Date.now() - started) / 1000);
          elapsedEl.textContent = `${seconds} ثانیه`;
        }, 250);
        // The clock times the whole pipeline — stream and the composer
        // phase — and stops when phase 2 settles (PM call, 2026-09-10).
        // Issue #25: the pipeline ends there — the Deep dive is
        // operator-timed by its own chip, started on the button press.
        const stopTimer = () => {
          clearInterval(tick);
          const seconds = Math.round((Date.now() - started) / 1000);
          elapsedEl.textContent = `${seconds} ثانیه`;
        };

        // A new ask owns the sheet: abort any in-flight phase 2 or dive
        // of the previous one, then reset all three sections to idle.
        // The dive's server-side abort rides this ask's own recall POST
        // (issue #26) — here the client only stops polling and drops
        // the stored job identity.
        if (quotedAbort) quotedAbort.abort();
        if (diveAbort) diveAbort.abort();
        quotedAbort = new AbortController();
        diveAbort = new AbortController();
        stopDivePolling();
        clearDiveJob();
        diveStatusEl = null;
        for (const n of [1, 2, 3]) {
          stopPhaseTimer(n);
          phaseEls[n].startedAt = null;
          if (phaseEls[n].timer) phaseEls[n].timer.hidden = true;
          setPhaseState(n, "idle");
        }
        setPhaseState(1, "running");
        setRunningPhase(1);
        selectPhase(1);
        quotedDocEl.replaceChildren();
        diveDocEl.replaceChildren();
        diveStartEl.disabled = true;
        diveQuery = query;
        setText(answerEl, "در حال پرسیدن…", "empty");
        citationRun += 1;
        // The collapsed pool starts the ask closed — a previous ask's
        // no-citations error note must not sit open on the new one.
        evidencePoolEl.open = false;
        citationsEl.replaceChildren();
        const waiting = document.createElement("p");
        waiting.className = "empty";
        waiting.textContent = "استناد پس از پاسخ می‌آید.";
        citationsEl.append(waiting);

        const textOf = (payload) =>
          Array.isArray(payload) ? payload[0]?.text || "" : payload.text || "";

        const renderFinal = (text) => {
          if (!text) {
            throw new Error("پاسخ خالی برگشت.");
          }
          const { answer, citations } = splitCitation(text);
          // The prose is kept for phase 2's framing — it is no longer
          // the displayed first answer (issue #28).
          const prose = answer || text;
          markFirstToken();
          setPhaseState(1, "done");
          // The first answer exists — the ask has a question to dive on.
          // From here the dive is the operator's call, never automatic
          // (ADR 0006).
          setPhaseState(3, "ready");
          diveStartEl.disabled = false;
          citationsEl.replaceChildren();
          if (!citations.length) {
            // No pool, no picker: the streamed prose stays the answer,
            // exactly as before the Quote selection (issue #28).
            answerEl.className = "answer";
            renderMarkdown(answerEl, prose);
            const missing = document.createElement("p");
            missing.className = "error";
            missing.textContent = "استناد در پاسخ نبود.";
            citationsEl.append(missing);
            // The failure note must stay readable — open the collapsed
            // pool for it, then close again on the next ask.
            evidencePoolEl.open = true;
            // No Evidence pool means no Quoted answer, but the dive
            // never needed one — the operator may still start it.
            skipQuotedPhase();
            // Without a phase-2 run the pipeline still ends here.
            stopTimer();
          } else {
            for (const item of citations) {
              const p = document.createElement("p");
              p.className = "cite";
              p.textContent = item;
              citationsEl.append(p);
            }
            // Phase 2 starts right here on the same pool (its exact
            // payload) and runs in PARALLEL with the picker (issue #28):
            // each lands in its own tab.
            renderQuotedAnswer(query, answer, citations, stopTimer);
            // The Quote selection replaces the prose as the first
            // answer (issue #28).
            renderQuoteSelection(query, prose, citations);
          }
        };

        try {
          const res = await fetch("/api/v1/recall", {
            method: "POST",
            headers: {
              "Content-Type": "application/json; charset=utf-8",
              ...phoneHeader(),
            },
            body: JSON.stringify({
              searchType: "HYBRID_COMPLETION",
              query,
              datasets: ["tarhe-kolli", "70143-336"],
              includeReferences: true,
              stream: true,
            }),
          });
          const ctype = res.headers.get("Content-Type") || "";
          if (ctype.includes("text/event-stream")) {
            let streamError = null;
            let gotFinal = false;
            await readSse(res, (name, data) => {
              if (name === "stage") {
                setText(
                  answerEl,
                  JSON.parse(data).stage === "generating"
                    ? "در حال تولید پاسخ…"
                    : "در حال بازیابی…",
                  "empty"
                );
              } else if (name === "delta") {
                // The prose is no longer painted (issue #28): deltas
                // still arrive and still drive the TTFT readout —
                // «نخستین توکن» is first token ARRIVAL.
                markFirstToken();
              } else if (name === "reset") {
                setText(answerEl, "در حال تولید پاسخ…", "empty");
              } else if (name === "error") {
                streamError = new Error(JSON.parse(data).message || "خطا در جریان پاسخ.");
              } else if (name === "final") {
                gotFinal = true;
                renderFinal(textOf(JSON.parse(data).results));
              }
            });
            if (!gotFinal) {
              throw streamError || new Error("پاسخ نیامد.");
            }
          } else {
            const payload = await res.json();
            if (!res.ok) {
              const detail = Array.isArray(payload.detail)
                ? payload.detail.join(" ")
                : payload.detail;
              throw new Error(detail || "پاسخ نیامد.");
            }
            renderFinal(textOf(payload));
          }
        } catch (err) {
          setText(
            answerEl,
            err.message === "Failed to fetch"
              ? "ارتباط با سرویس پاسخ قطع شد."
              : String(err.message || err),
            "error"
          );
          setPhaseState(1, "failed");
          setRunningPhase(null);
          citationsEl.replaceChildren();
          const missing = document.createElement("p");
          missing.className = "empty";
          missing.textContent = "بدون استناد.";
          citationsEl.append(missing);
          stopTimer();
        } finally {
          if (firstTokenAt === null) {
            ttftEl.hidden = true;
          }
          buttonEl.disabled = false;
        }
      });

      ping();
    </script>
  </body>
</html>
