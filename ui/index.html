          questionEl.value = localStorage.getItem(draftKey()) || "";
          autosizeComposer();
          updateCharNote();
        } catch {}
        threadListEl.replaceChildren();
        for (const message of session.messages || []) {
          if (message.role === "user") {
            const rowEl = document.createElement("div");
            rowEl.className = "msg-user-row";
            const bubble = document.createElement("div");
            bubble.className = "msg-user";
            const p = document.createElement("p");
            p.textContent = (message.payload && message.payload.text) || "";
            bubble.append(p);
            rowEl.append(bubble);
            threadListEl.append(rowEl);
          } else {
            const article = document.createElement("div");
            article.className = "msg-assistant";
            const blocks =
              message.payload && Array.isArray(message.payload.blocks)
                ? message.payload.blocks
                : [];
            if (blocks.length) {
              for (const block of blocks) {
                if (block.type === "heading") {
                  const h = document.createElement("h3");
                  h.className = "doc-heading";
                  h.textContent = cleanFarsi(block.text || "");
                  article.append(h);
                } else if (block.type === "paragraph") {
                  // The same renderer the live article uses: a stored
                  // paragraph's parts interleave AI text with verbatim
                  // quote spans ({quote, reference, labels}) - reading
                  // block.text here drew every paragraph empty (the
                  // vanishing-content fix, 2026-09-24).
                  article.append(paragraphNode(block));
                }
              }
            } else if (message.payload && message.payload.text) {
              const p = document.createElement("p");
              p.className = "doc-para";
              p.textContent = cleanFarsi(message.payload.text);
              article.append(p);
            } else {
              continue;
            }
            // The Evidence pool rides the resume (restore fidelity,
            // 2026-09-27): the settled rows carry the ask's stored
            // citations, and the resumed sitting shows the same
            // collapsed pool the live ask did — not just the article.
            const citations = Array.isArray(message.payload.citations)
              ? message.payload.citations
              : [];
            if (citations.length) {
              const pool = document.createElement("details");
              pool.className = "evidence-pool";
              const summary = document.createElement("summary");
              summary.textContent = "همۀ نقل‌قول‌های بازیابی‌شده";
              const poolHeading = document.createElement("h2");
              poolHeading.className = "citations-heading";
              poolHeading.textContent = "استناد";
              const list = document.createElement("div");
              list.className = "citations";
              for (const item of citations) {
                if (!item || typeof item !== "object") continue;
                const reference =
                  typeof item.reference === "string" ? item.reference : "";
                const passage =
                  typeof item.passage === "string" ? item.passage : "";
                if (!reference && !passage) continue;
                const p = document.createElement("p");
                p.className = "cite";
                p.textContent = cleanFarsi(
                  passage ? `${reference}: "${passage}"` : reference
                );
                list.append(p);
              }
              if (list.children.length) {
                pool.append(summary, poolHeading, list);
                article.append(pool);
              }
            }
            threadListEl.append(article);
          }
        }
        renderSessionList();
        setSidebar(false);
        // The unanswered tail (T27 stage 3): a sitting whose last stored
        // turn is the operator's question died before its answer settled
        // — a refresh or a new sitting kills the in-flight pipeline, and
        // the honest charge for the streamed part already stands. The
        // resume shows it plainly and offers the re-ask as ONE click
        // that refills the composer; re-asking is the operator's act,
        // never an automatic re-billing.
        const messages = session.messages || [];
        const last = messages[messages.length - 1];
        if (last && last.role === "user") {
          const card = document.createElement("div");
          card.className = "unanswered";
          const note = document.createElement("p");
          note.className = "unanswered-note";
          note.textContent = UNANSWERED_NOTE;
          const again = document.createElement("button");
          again.type = "button";
          again.className = "primary";
          again.textContent = REASK_LABEL;
          again.addEventListener("click", () => {
            questionEl.value = (last.payload && last.payload.text) || "";
            autosizeComposer();
            updateCharNote();
            questionEl.focus();
            card.remove();
          });
          card.append(note, again);
          threadListEl.append(card);
        }
        // The research linkage (ADR-0016): a sitting that researched
        // raises its whole research conversation beside the restored
        // chat — the trail no longer dies because a sidebar click
        // dropped the browser's only pointer. The server store is the
        // source; sessionStorage re-arms only the same-tab turn resume.
        if (session.research_session_id) {
          researchSessionId = String(session.research_session_id);
          storeResearch({ session_id: researchSessionId });
          hydrateResearch(researchSessionId);
        }
        threadListEl.classList.remove("thread-switching");
        // Land at the end with a cut, not a glide: the swap already
        // moved the reader's ground once; a smooth swoosh on top of it
        // reads as losing the page under their hand.
        scrollThreadEnd(false);
      }

      // Multi-device: the sidebar refetches when the tab regains focus —
      // last-write-wins; the open thread stays as the sitting left it
      // until the Session is reopened from the list.
      window.addEventListener("focus", () => {
        if (sessionState.active) renderSessionList();
      });

      function stopPhaseTimersForResume() {
        for (const n of [1, 2, 3]) {
          stopPhaseTimer(n);
          phaseEls[n].startedAt = null;
          if (phaseEls[n].timer) phaseEls[n].timer.hidden = true;
        }
      }

      function setSidebar(open) {
        shellEl.classList.toggle("sl-open", open);
        slBackdropEl.hidden = !open;
        slToggleEl.setAttribute("aria-expanded", String(open));
      }
      slToggleEl.addEventListener("click", () => setSidebar(true));
      slCloseEl.addEventListener("click", () => setSidebar(false));
      slBackdropEl.addEventListener("click", () => setSidebar(false));

      // The theme: system preference by default, the toggle persists an
      // explicit choice; the head script set data-theme before paint.
      const themeToggle = document.getElementById("theme-toggle");
      function syncThemeButton() {
        themeToggle.textContent =
          document.documentElement.dataset.theme === "dark" ? "روز" : "شب";
      }
      themeToggle.addEventListener("click", () => {
        const next =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try {
          localStorage.setItem("theme", next);
        } catch {}
        syncThemeButton();
      });
      syncThemeButton();

      function markPickedCard(doc) {
        document.querySelectorAll(".book-card").forEach((card) => {
          card.classList.toggle("picked", card.dataset.doc === doc);
        });
      }
      try {
        markPickedCard(localStorage.getItem("selectedBook"));
      } catch {}

      function startSession(bookDoc, seedQuestion) {
        // A new sitting begins in the ask mode (ADR-0015): the toggle's
        // arm belongs to the sitting that armed it.
        setResearchMode(false);
        sessionState.active = true;
        sessionState.book = bookDoc;
        sessionState.titled = false;
        sessionState.storeId = null;
        try {
          localStorage.setItem("selectedBook", bookDoc);
        } catch {}
        markPickedCard(bookDoc);
        newSessionView.hidden = true;
        threadListEl.hidden = false;
        composerDock.hidden = false;
        sessionTitleEl.textContent = BOOK_TITLES[bookDoc] || bookDoc;
        bookChipEl.textContent = BOOK_TITLES[bookDoc] || bookDoc;
        bookChipEl.hidden = false;
        if (seedQuestion) {
          questionEl.value = seedQuestion;
          autosizeComposer();
          updateCharNote();
        } else {
          // A fresh sitting starts from its own (empty) draft, never
          // from the words a previous sitting left in the box.
          try {
            questionEl.value = localStorage.getItem(draftKey()) || "";
          } catch {}
          autosizeComposer();
          updateCharNote();
        }
        renderSessionList();
        if (!window.matchMedia("(pointer: coarse)").matches) {
          questionEl.focus();
        }
      }

      newSessionBtn.addEventListener("click", () => {
        setSidebar(false);
        if (!sessionState.active) return;
        if (quotedAbort) quotedAbort.abort();
        resetResearch();
        citationRun += 1;
        askState = null;
        quotedAbort = null;
        sessionState.active = false;
        sessionState.book = null;
        sessionState.titled = false;
        sessionState.storeId = null;
        rememberStoreSession();
        threadListEl.replaceChildren();
        threadListEl.hidden = true;
        newSessionView.hidden = false;
        composerDock.hidden = true;
        stopBtn.hidden = true;
        sessionTitleEl.textContent = "نشست";
        bookChipEl.hidden = true;
        renderSessionList();
      });

      // ===== The composer: autosize, the counter near the ceiling, the
      // per-Session draft, Enter-to-send on a pointer device only.
      // The draft's storage key follows the sitting: an open Session's
      // half-asked question lives under its own key, the anonymous
      // new-Session draft under the legacy one — switching sittings
      // never trades words behind the operator's back.
      function draftKey() {
        return sessionState.storeId
          ? `composerDraft:s:${sessionState.storeId}`
          : "composerDraft";
      }
      function autosizeComposer() {
        questionEl.style.height = "auto";
        // border-box: hide the scrollbar until the ceiling clips the
        // content, or the measured height runs two border-pixels short
        // and a dead scrollbar appears on a single line.
        questionEl.style.overflowY = "hidden";
        const h = Math.min(questionEl.scrollHeight, 144);
        questionEl.style.height = h + "px";
        if (questionEl.scrollHeight > 144) {
          questionEl.style.overflowY = "auto";
        }
      }
      function updateCharNote() {
        const left = 2000 - questionEl.value.length;
        charNoteEl.textContent =
          left <= 200 ? `${toPersianDigits(left)} نویسه باقی مانده` : "";
      }
      questionEl.addEventListener("input", () => {
        autosizeComposer();
        updateCharNote();
        try {
          localStorage.setItem(draftKey(), questionEl.value);
        } catch {}
      });
      try {
        questionEl.value = localStorage.getItem("composerDraft") || "";
      } catch {}
      questionEl.addEventListener("keydown", (event) => {
        if (
          event.key === "Enter" &&
          !event.shiftKey &&
          !event.isComposing && // an IME's Enter confirms its own composition, never sends
          !window.matchMedia("(pointer: coarse)").matches
        ) {
          event.preventDefault();
          if (!buttonEl.disabled) form.requestSubmit();
        }
      });

      // ===== Per-ask surface: one assistant article per ask. The
      // element bindings below are `let` — a new ask rebuilds them and
      // every downstream function keeps operating on the live ask.
      let answerEl = null;
      let citationsEl = null;
      let evidencePoolEl = null;
      let quotedDocEl = null;
      let elapsedEl = null;
      let ttftEl = null;
      let phaseNowEl = null;
      let recallMoreRow = null;
      let recallMoreBtn = null;
      let recallMoreStatus = null;
      let citationRun = 0; // In-flight phase 2 fetches; aborted when a new ask starts.
      let quotedAbort = null;
      // The current ask's own state for «جست‌وجوی بیشتر» (ADR-0010):
      // question, streamed prose (phase 2's framing), and the pool
      // locator lines so far — grown when the widen returns fresh
      // passages, then both answers re-run over the merged pool.
      let askState = null;
      let recallMoreBusy = false;
      // This ask's settle key (vanishing-content fix, 2026-09-24): one
      // opaque key per ask, shared by the picker and phase 2 so the
      // server settles BOTH into the SAME assistant row — the snapshot
      // upgrading to the article. New ask, new key.
      let currentAskKey = null;
      // The current ask's question and Evidence pool — the seed of the
      // Research Mode session the first message creates (ADR 0008).
      let researchQuery = null;
      let researchSources = [];
      let researchSessionId = null;

      // The three answering phases (ADR-0014's thread shape): a quiet
      // marker per phase riding the ask's article, a pulsing dot on the
      // phase being generated, a "now generating" line, and a per-phase
      // timer for phases 2 and 3 that freezes at settle.
      const PHASE_NAMES = {
        1: "پاسخ اول",
        2: "پاسخ استنادی",
        3: "حالت پژوهش",
      };
      let phaseEls = {
        1: { mark: null, timer: null, interval: null, startedAt: null },
        2: { mark: null, timer: null, interval: null, startedAt: null },
        3: { mark: null, timer: null, interval: null, startedAt: null },
      };

      function buildPhaseMark(name, withTimer) {
        const mark = document.createElement("span");
        mark.className = "phase-mark";
        mark.dataset.state = "idle";
        const dot = document.createElement("span");
        dot.className = "phase-dot";
        dot.setAttribute("aria-hidden", "true");
        mark.append(dot, document.createTextNode(name));
        let timer = null;
        if (withTimer) {
          timer = document.createElement("span");
          timer.className = "phase-timer";
          timer.hidden = true;
          mark.append(timer);
        }
        return { mark, timer };
      }

      function newAskSurface(question) {
        const row = document.createElement("div");
        row.className = "msg-user-row";
        const bubble = document.createElement("div");
        bubble.className = "msg-user";
        const p = document.createElement("p");
        p.textContent = question;
        bubble.append(p);
        row.append(bubble);

        const article = document.createElement("article");
        article.className = "msg-assistant";

        const phaseRow = document.createElement("div");
        phaseRow.className = "phase-row";
        const one = buildPhaseMark(PHASE_NAMES[1], false);
        const two = buildPhaseMark(PHASE_NAMES[2], true);
        phaseRow.append(one.mark, two.mark);

        phaseNowEl = document.createElement("p");
        phaseNowEl.className = "phase-now";
        phaseNowEl.hidden = true;

        answerEl = document.createElement("div");
        answerEl.className = "answer";

        // The Evidence pool stays visible, collapsed (issue #28):
        // the Quote selection renders as the first answer above it
        // and the pool remains phase 2's exact payload.
        evidencePoolEl = document.createElement("details");
        evidencePoolEl.className = "evidence-pool";
        const summary = document.createElement("summary");
        summary.textContent = "همۀ نقل‌قول‌های بازیابی‌شده";
        const poolHeading = document.createElement("h2");
        poolHeading.className = "citations-heading";
        poolHeading.textContent = "استناد";
        citationsEl = document.createElement("div");
        citationsEl.className = "citations";
        const recallRow = document.createElement("div");
        recallRow.className = "recall-more-row";
        recallRow.hidden = true;
        recallMoreBtn = document.createElement("button");
        recallMoreBtn.type = "button";
        recallMoreBtn.textContent = "جست‌وجوی بیشتر";
        recallMoreStatus = document.createElement("span");
        recallMoreStatus.className = "composer-status";
        recallRow.append(recallMoreBtn, recallMoreStatus);
        evidencePoolEl.append(summary, poolHeading, citationsEl, recallRow);

        quotedDocEl = document.createElement("div");
        quotedDocEl.className = "quoted-doc";

        const meta = document.createElement("div");
        meta.className = "ask-meta";
        ttftEl = document.createElement("span");
        ttftEl.className = "ttft";
        ttftEl.hidden = true;
        elapsedEl = document.createElement("span");
        elapsedEl.className = "elapsed";
        elapsedEl.hidden = true;
        meta.append(ttftEl, elapsedEl);

        article.append(
          phaseRow,
          phaseNowEl,
          answerEl,
          evidencePoolEl,
          quotedDocEl,
          meta
        );
        threadListEl.append(row, article);

        phaseEls = {
          1: { mark: one.mark, timer: null, interval: null, startedAt: null },
          2: { mark: two.mark, timer: two.timer, interval: null, startedAt: null },
          3: { mark: null, timer: null, interval: null, startedAt: null },
        };

        recallMoreRow = recallRow;
        recallMoreBtn.addEventListener("click", onRecallMoreClick);
      }

      // The map's side rail needs the room (T10, GitLab #11): an active
      // research conversation widens the thread so chat and rail sit
      // beside each other; selectPhase also scrolls the phase's landing
      // spot into view.
      function selectPhase(n, scroll = true) {
        document.body.classList.toggle("research-open", n === 3);
        if (!scroll) return;
        if (!nearBottom()) return;
        if (n === 3) {
          researchSectionEl?.scrollIntoView({ behavior: "smooth", block: "start" });
        } else {
          phaseEls[n]?.mark?.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }

      // ready = waiting for the operator; running = being generated;
      // done / failed / skipped = settled.
      function setPhaseState(n, state) {
        if (phaseEls[n]?.mark) {
          phaseEls[n].mark.dataset.state = state;
        }
      }

      function clockText(ms) {
        const total = Math.max(0, Math.round(ms / 1000));
        return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
      }

      function startPhaseTimer(n, elapsedMs = 0) {
        const phase = phaseEls[n];
        if (!phase.timer) return;
        stopPhaseTimer(n);
        // elapsedMs reseeds an honest clock — a dive reconnected after a
        // refresh continues the job's elapsed, not this page load's.
        phase.startedAt = Date.now() - (elapsedMs || 0);
        phase.timer.hidden = false;
        const tickPhase = () => {
          phase.timer.textContent = clockText(Date.now() - phase.startedAt);
        };
        tickPhase();
        phase.interval = setInterval(tickPhase, 250);
      }

      function stopPhaseTimer(n) {
        const phase = phaseEls[n];
        if (phase.interval) {
          clearInterval(phase.interval);
          phase.interval = null;
        }
        if (phase.startedAt && phase.timer) {
          // The frozen chip IS the completion time: how long the phase took.
          phase.timer.textContent = clockText(Date.now() - phase.startedAt);
        }
      }

      function setRunningPhase(n) {
        if (!phaseNowEl) return;
        if (n === null) {
          phaseNowEl.hidden = true;
          return;
        }
        phaseNowEl.hidden = false;
        phaseNowEl.textContent = `در حال تولید: ${PHASE_NAMES[n]}…`;
      }

      function setText(el, text, className) {
        el.className = className;
        el.textContent = text;
      }

      // Phase-1 answers arrive as markdown (headings, bold, bullets);
      // render that structure, never the literal #/** characters.
      function markBold(el, text) {
        const parts = String(text).split(/\*\*(.+?)\*\*/g);
        parts.forEach((part, index) => {
          if (index % 2) {
            const strong = document.createElement("strong");
            strong.textContent = part;
            el.append(strong);
          } else if (part) {
            el.append(part);
          }
        });
      }

      function renderMarkdown(container, text) {
        container.replaceChildren();
        for (const block of String(text).split(/\n{2,}/)) {
          const lines = block.split("\n").filter((line) => line.trim());
          if (!lines.length) continue;
          if (lines.every((line) => /^\s*[-*]\s+/.test(line))) {
            const ul = document.createElement("ul");
            for (const line of lines) {
              const li = document.createElement("li");
              markBold(li, line.replace(/^\s*[-*]\s+/, ""));
              ul.append(li);
            }
            container.append(ul);
            continue;
          }
          for (const line of lines) {
            const heading = line.match(/^(#{1,4})\s+(.*)$/);
            const el = document.createElement(
              heading ? "h" + Math.min(heading[1].length + 2, 6) : "p"
            );
            markBold(el, heading ? heading[2] : line);
            container.append(el);
          }
        }
      }

      function splitCitation(text) {
        const marker = "Evidence:";
        const at = text.indexOf(marker);
        if (at === -1) {
          return { answer: text.trim(), citations: [] };
        }
        const answer = text.slice(0, at).trim();
        const rest = text.slice(at + marker.length).trim();
        const citations = rest
          .split(/\n-\s+/)
          .map((item) => item.replace(/^[-\s]+/, "").trim())
          .filter(Boolean);
        return { answer, citations };
      }

      // An Evidence bullet is `locator: "quoted passage"`. The quoted
      // passage is the composer's verbatim source pool.
      function evidenceSources(citations) {
        const sources = [];
        for (const item of citations) {
          const at = item.indexOf(': "');
          if (at === -1) {
            continue;
          }
          const reference = item.slice(0, at).trim();
          const passage = cleanFarsi(
            item.slice(at + 3).replace(/"$/, "").trim()
          );
          if (reference && passage) {
            sources.push({ reference, passage });
          }
        }
        return sources;
      }

      // The tooltip's Citation text: Book identity plus the passage's
      // first page (resolved server-side from the Evidence locator) —
      // a passage without page markers cites the Book alone, never an
      // invented page.
      function citationRef(item) {
        if (item.book_label) {
          return item.first_page_label
            ? `${item.book_label} — ${item.first_page_label}`
            : item.book_label;
        }
        return item.first_page_label || "کتاب";
      }

      // ===== Citation → Book-page targets (ADR-0007) =====
      // Every quote in the shell is clickable: its span carries the
      // Evidence locator's dataset name and page range, and clicking
      // opens the reader on that page with the quote highlighted.
      const BOOK_DATASET_BY_TITLE = {
        "طرح کلی اندیشۀ اسلامی در قرآن": "tarhe-kolli",
        "انسان ۲۵۰ ساله": "70143-336",
      };

      // The Evidence locator's machine fields — the client twin of
      // guard.py's _PAGES_IN_REFERENCE / _DOCUMENT_IN_REFERENCE.
      function parseReference(reference) {
        const text = reference || "";
        const doc = /\bdocument ([A-Za-z0-9._-]+)/.exec(text)?.[1] || "";
        const range = /\(pages (\d+)-(\d+)\)/.exec(text);
        if (range) {
          return { doc, first: Number(range[1]), last: Number(range[2]) };
        }
        const single = /\(page (\d+)\)/.exec(text);
        if (single) {
          return { doc, first: Number(single[1]), last: Number(single[1]) };
        }
        return { doc, first: 0, last: 0 };
      }

      // A quote part carries no locator — only the server-resolved
      // labels (guard.py's _citation_labels). The Farsi title maps back
      // to its dataset; the range label's digits are ASCII (regex
      // groups), so no digit conversion is needed.
      function citationTargetFromLabels(part) {
        const byTitle = BOOK_DATASET_BY_TITLE[part.book_label];
        const doc =
          byTitle ||
          (/^[A-Za-z0-9._-]+$/.test(part.book_label || "")
            ? part.book_label
            : "");
        const range = /صفحات (\d+) تا (\d+)/.exec(part.pages_label || "");
        const single = /صفحه (\d+)/.exec(part.pages_label || "");
        const pages = range
          ? `${range[1]}-${range[2]}`
          : single
            ? single[1]
            : "";
        return { doc, pages };
      }

      // One rendered quote span, wired for the reader: dataset + page
      // range in data attributes, and the click hint in the tooltip.
      // The span's text is also remembered under its locator (ADR-0010):
      // a «منابع» reference line carries no passage of its own, so its
      // click looks the passage up here and locates the highlight like
      // any quote span — never just the chunk's first page.
      const locatorPassages = new Map();
      function locatorKey(doc, pages) {
        const dash = String(pages || "").indexOf("-");
        const first = dash === -1 ? Number(pages) : Number(pages.slice(0, dash));
        const last = dash === -1 ? first : Number(pages.slice(dash + 1));
        return first ? `${doc}|${first}-${last}` : null;
      }
      function wireQuoteSpan(span, doc, pages) {
        if (doc) span.dataset.doc = doc;
        if (pages) span.dataset.pages = pages;
        span.dataset.hint = "برای دیدن در کتاب کلیک کنید";
        if (doc && pages && span.textContent) {
          const key = locatorKey(doc, pages);
          if (key && !locatorPassages.has(key)) {
            locatorPassages.set(key, span.textContent);
          }
        }
      }

      // One paragraph = AI text with embedded verbatim quotes (PM format,
      // 2026-09-10). Each quote sentence hovers to the Citation of exactly
      // the passage it claims — on that passage's first page — and the
      // paragraph ends with the full chunk-page range of every passage it
      // quoted, in order of first appearance.
      function paragraphNode(block) {
        const para = document.createElement("p");
        para.className = "doc-para";
        // The composer's text parts carry no reliable boundary spaces, so
        // each appended node is preceded by one when the run needs it.
        const appendPart = (node) => {
          const last = para.lastChild;
          if (
            last &&
            (last.nodeType !== Node.TEXT_NODE || !/\s$/.test(last.textContent))
          ) {
            para.append(" ");
          }
          para.append(node);
        };
        const parts = Array.isArray(block.parts) ? block.parts : [];
        const labels = [];
        parts.forEach((part) => {
          if (part.text) {
            appendPart(cleanFarsi(part.text));
          } else if (part.quote !== undefined) {
            const span = document.createElement("span");
            span.className = "cite-sent";
            span.tabIndex = 0;
            span.textContent = cleanFarsi(part.quote);
            // Book identity arrives per quote from the server (resolved
            // from the Evidence locator's document name) — with two
            // Books the attribution can no longer be implied.
            span.dataset.ref = citationRef(part);
            // The reader target (ADR-0007): the quote's Book and pages,
            // from the same labels the tooltip reads.
            const target = citationTargetFromLabels(part);
            wireQuoteSpan(span, target.doc, target.pages);
            appendPart(span);
            if (part.pages_label && !labels.includes(part.pages_label)) {
              labels.push(part.pages_label);
            }
          }
        });
        labels.forEach((label) => {
          const pages = document.createElement("span");
          pages.className = "cite-pages";
          pages.textContent = `[${label}]`;
          appendPart(pages);
        });
        return para;
      }

      // Phase 2 runs in its own section of the ask's article: the first
      // answer stays put, and the guarded document lands beneath phase
      // 2's marker only on success — non-empty blocks mean the server's
      // swap threshold passed (at least two quoting paragraphs, or one
      // plus a heading). On failure, timeout, or an empty document the
      // section says so and phase 1's answer remains the answer (AC-4).
      // The stream path is untouched — this runs after the streamed
      // answer has rendered (AC-5).
      function failQuotedPhase() {
        setPhaseState(2, "failed");
        stopPhaseTimer(2);
        setRunningPhase(null);
        quotedDocEl.replaceChildren();
        const note = document.createElement("p");
        note.className = "empty";
        note.textContent = "پاسخ استنادی آماده نشد؛ پاسخ اول در بخش خودش معتبر می‌ماند.";
        quotedDocEl.append(note);
      }

      function skipQuotedPhase() {
        setPhaseState(2, "skipped");
        quotedDocEl.replaceChildren();
        const note = document.createElement("p");
        note.className = "empty";
        note.textContent = "بدون استناد، پاسخ استنادی ساخته نمی‌شود؛ پاسخ اول معتبر می‌ماند.";
        quotedDocEl.append(note);
      }

      function truncatedNote() {
        const note = document.createElement("p");
        note.className = "composer-truncated";
        note.textContent = "سند به سقف طول مدل رسید و ادامه‌نویسی هم بریده شد؛ ممکن است بندهای پایانی ناتمام باشند.";
        return note;
      }

      async function renderQuotedAnswer(question, answer, citations, onSettled) {
        const run = citationRun;
        const sources = evidenceSources(citations);
        if (!sources.length) {
          skipQuotedPhase();
          onSettled();
          return;
        }
        setPhaseState(2, "running");
        startPhaseTimer(2);
        setRunningPhase(2);
        quotedDocEl.replaceChildren();
        // Phase 2 is visible while it runs: a pulsing status in its own
        // section, gone with the document (or with any fallback).
        const status = document.createElement("p");
        status.className = "composer-status";
        status.textContent = "در حال نوشتن پاسخ استنادی…";
        quotedDocEl.append(status);
        try {
          const res = await fetch("/quoted-answer", {
            method: "POST",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            // The sitting's id and this ask's key let the SERVER settle
            // the assistant turn (vanishing-content fix, 2026-09-24):
            // the store write no longer waits for this page to report
            // it, so a reload mid-compose keeps the answer.
            body: JSON.stringify({
              question,
              answer,
              sources,
              session_id: sessionState.storeId || undefined,
              ask_key: currentAskKey || undefined,
            }),
            signal: quotedAbort.signal,
          });
          refreshUsageLive();
          if (run !== citationRun) {
            return;
          }
          if (!res.ok) {
            failQuotedPhase();
            onSettled();
            return;
          }
          const payload = await res.json();
          if (run !== citationRun) {
            return;
          }
          const blocks = Array.isArray(payload.blocks) ? payload.blocks : [];
          if (!blocks.length) {
            failQuotedPhase();
            onSettled();
            return;
          }
          const doc = document.createDocumentFragment();
          // A document the continuation could not finish says so itself,
          // above its paragraphs.
          if (payload.truncated) {
            doc.append(truncatedNote());
          }
          for (const block of blocks) {
            if (block.type === "heading") {
              const heading = document.createElement("h3");
              heading.className = "doc-heading";
              heading.textContent = block.text;
              doc.append(heading);
            } else if (block.type === "paragraph") {
              doc.append(paragraphNode(block));
            }
          }
          quotedDocEl.replaceChildren(doc);
          // The settled article rides the store SERVER-SIDE now
          // (vanishing-content fix, 2026-09-24): /quoted-answer settles
          // the ask's assistant row itself, before this reply was even
          // written — a reload mid-compose can no longer orphan it. The
          // client-side append this replaces would double the row.
          setPhaseState(2, "done");
          stopPhaseTimer(2);
          setRunningPhase(null);
          // Bring the fresh document forward: each phase scrolls its
          // landing spot into view when it lands.
          selectPhase(2);
          onSettled();
        } catch {
          if (run !== citationRun) {
            return;
          }
          // Composer unreachable: phase 1's answer and Evidence citations stay.
          failQuotedPhase();
          onSettled();
        }
      }

      // The Quote selection (ADR 0006, issue #28): the first answer is
      // the Evidence pool's verbatim Book sentences — ten aimed,
      // guarded 4-12 — picked server-side by EXACTLY ONE glm-5.3-flash
      // call. The streamed prose is no longer the displayed answer (it
      // still feeds the Quoted answer's framing), and an empty or
      // failed selection falls back to the prose render: the sheet is
      // never left empty. This runs in parallel with phase 2, which
      // receives the same pool as its payload. A new ask aborts this
      // fetch with the rest (quotedAbort).
      async function renderQuoteSelection(question, prose, citations) {
        const run = citationRun;
        const sources = evidenceSources(citations);
        answerEl.replaceChildren();
        const status = document.createElement("p");
        status.className = "composer-status";
        status.textContent = "در حال انتخاب نقل‌قول‌ها…";
        answerEl.append(status);
        const fallbackToProse = () => {
          answerEl.className = "answer";
          renderMarkdown(answerEl, prose);
          const note = document.createElement("p");
          note.className = "empty";
          note.textContent = "انتخاب نقل‌قول‌ها آماده نشد؛ پاسخ جریان‌یافته به‌جای آن می‌ماند.";
          answerEl.append(note);
        };
        try {
          const res = await fetch("/quote-selection", {
            method: "POST",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            // Same server-side settle: the FIRST answer's snapshot rides
            // the ask's row the moment the picker lands, so a reload any
            // time later shows the answer the operator received.
            body: JSON.stringify({
              question,
              sources,
              session_id: sessionState.storeId || undefined,
              ask_key: currentAskKey || undefined,
            }),
            signal: quotedAbort.signal,
          });
          refreshUsageLive();
          if (run !== citationRun) {
            return;
          }
          const payload = res.ok ? await res.json() : {};
          if (run !== citationRun) {
            return;
          }
          const selections = Array.isArray(payload.selections)
            ? payload.selections
            : [];
          if (!selections.length) {
            fallbackToProse();
            return;
          }
          const doc = document.createDocumentFragment();
          for (const item of selections) {
            const sentence = document.createElement("p");
            sentence.className = "doc-para";
            const span = document.createElement("span");
            span.className = "cite-sent";
            span.tabIndex = 0;
            span.textContent = cleanFarsi(item.text);
            // Same tooltip contract as the Quoted paragraph's quotes:
            // Book identity plus the passage's first page.
            span.dataset.ref = citationRef(item);
            // The reader target straight from the picker's Evidence
            // locator (the selections carry it verbatim).
            const located = parseReference(item.reference);
            wireQuoteSpan(span, located.doc, located.first ? `${located.first}-${located.last}` : "");
            sentence.append(span);
            if (item.pages_label) {
              const pages = document.createElement("span");
              pages.className = "cite-pages";
              pages.textContent = ` [${item.pages_label}]`;
              sentence.append(pages);
            }
            doc.append(sentence);
          }
          answerEl.className = "answer";
          answerEl.replaceChildren(doc);
          if (nearBottom()) scrollThreadEnd();
        } catch {
          if (run !== citationRun) {
            return;
          }
          fallbackToProse();
        }
      }

      // The Research Mode client (ADR-0008): the guided research
      // conversation of the Session. A message POST answers a turn
      // identity immediately (202) and the shell polls /research/turn on
      // a chained setTimeout — the dive's job surface, per turn.
      // sessionStorage keeps the session (and any in-flight turn) so a
      // browser refresh reconnects instead of throwing the conversation
      // away. The search shapes stay pinned server-side: the shell
      // sends only text and — on the creating call — the ask's question
      // with its Evidence pool.
      const RESEARCH_POLL_MS = 2000;
      let researchPollTimer = null;
      // The turn's generation (ADR-0015): resetResearch bumps it, so an
      // in-flight POST or poll from a closed conversation settles
      // silently instead of painting into removed nodes.
      let researchRun = 0;
      let researchStatusEl = null;
      let researchSectionEl = null;
      let researchChatEl = null;
      let researchSuggestEl = null;
      let researchFormEl = null;
      let researchInputEl = null;
      let researchSendEl = null;
      let researchStateBodyEl = null;
      let researchJourneyEl = null;

      const storedResearch = () => {
        try {
          return JSON.parse(sessionStorage.getItem("sessionResearch"));
        } catch {
          return null;
        }
      };
      const storeResearch = (obj) =>
        sessionStorage.setItem("sessionResearch", JSON.stringify(obj));
      const clearResearch = () =>
        sessionStorage.removeItem("sessionResearch");

      function stopResearchPolling() {
        if (researchPollTimer) {
          clearTimeout(researchPollTimer);
          researchPollTimer = null;
        }
      }

      // Scroll freedom (operator feedback, 2026-09-27): while the
      // pipeline generates, the reader may scroll anywhere — a landing
      // yanks the view only when the reader is ALREADY near the bottom,
      // and the follow resumes the moment they return. The submit's own
      // jump stays unconditional (the send was their act) but instant,
      // so the smooth glide never fights the first upward drag.
      function nearBottom(threshold = 140) {
        const doc = document.documentElement;
        return (
          window.innerHeight + window.scrollY >= doc.scrollHeight - threshold
        );
      }

      function scrollResearch() {
        if (!nearBottom()) return;
        researchChatEl?.scrollIntoView({ block: "end", behavior: "smooth" });
      }

      function scrollThreadEnd(smooth = true) {
        window.scrollTo({
          top: document.documentElement.scrollHeight,
          behavior: smooth ? "smooth" : "auto",
        });
      }

      // One research section per Session, appended to the thread when
      // the toggle arms it or a reconnect needs it (ADR-0015); a new
      // ask closes it (the server aborts the in-flight turn and closes
      // the session on the ask's recall POST).
      function createResearchSection() {
        if (researchSectionEl) return;
        researchSectionEl = document.createElement("section");
        researchSectionEl.className = "research-sec";
        researchSectionEl.innerHTML = `
          <div class="phase-row">
            <span class="phase-mark" data-phase="3" data-state="idle"><span class="phase-dot" aria-hidden="true"></span>${PHASE_NAMES[3]}<span class="phase-timer" hidden></span></span>
          </div>
          <!-- Research Mode (ADR-0008 + 0009): the guided research
               journey. The map rides as the persistent side rail
               (T10, GitLab #11): the journey strip and the route —
               destination, research question, frontier, open
               questions, decisions, fog, out of scope — stay beside
               the chat, always visible without scrolling. The chips
               under the latest reply are the journey's own moves
               (guided answers, per-question gathers, checkpoint
               decisions, the universal skip); the input arms after the
               first answer exists, seeded by the ask and its Evidence
               pool. -->
          <div class="research-layout">
            <div class="research-chatcol">
              <div id="research-chat" class="research-chat" aria-live="polite"></div>
              <!-- DRAFT label: the report chip «دریافت گزارش نشست»
                   (the Session report's download, T19) is the draft
                   platform name pending PM approval — CONTEXT.md's
                   draft roster, 2026-09-19. The text lives in ONE
                   server constant, ui/research.py's
                   RESEARCH_REPORT_CHIP, and rides to the shell in
                   the suggestions payload, so a rename never
                   touches this file. -->
              <div id="research-suggest" class="research-suggest"></div>
              <!-- The one door (ADR-0015): this section's own composer
                   is retired — the shell composer with the research
                   toggle armed sends the research messages now. The
                   element (and its wiring below) stays so the
                   reconnect paths keep their shape; it never shows. -->
              <form id="research-form" class="research-form" hidden>
                <textarea
                  id="research-input"
                  maxlength="2000"
                  placeholder="پیام پژوهش خود را بنویسید"
                  disabled
                ></textarea>
                <button type="submit" id="research-send" disabled>فرستادن</button>
              </form>
            </div>
            <aside id="research-rail" class="research-rail" aria-label="نقشۀ پژوهش">
              <h2 class="research-rail-title">نقشۀ پژوهش</h2>
              <nav
                id="research-journey"
                class="research-journey"
                aria-label="مراحل سفر پژوهش"
                hidden
              ></nav>
              <div id="research-state-body">
                <p class="empty">پس از آغاز گفتگو، نقشۀ پژوهش اینجا می‌آید.</p>
              </div>
            </aside>
          </div>`;
        threadListEl.append(researchSectionEl);
        researchChatEl = researchSectionEl.querySelector("#research-chat");
        researchSuggestEl = researchSectionEl.querySelector("#research-suggest");
        researchFormEl = researchSectionEl.querySelector("#research-form");
        researchInputEl = researchSectionEl.querySelector("#research-input");
        researchSendEl = researchSectionEl.querySelector("#research-send");
        researchStateBodyEl = researchSectionEl.querySelector("#research-state-body");
        researchJourneyEl = researchSectionEl.querySelector("#research-journey");
        const three = researchSectionEl.querySelector('.phase-mark[data-phase="3"]');
        phaseEls[3].mark = three;
        phaseEls[3].timer = three.querySelector(".phase-timer");
        researchChatEl.replaceChildren(
          researchText(RESEARCH_SECTION_NOTE, "empty")
        );
        researchFormEl.addEventListener("submit", (event) => {
          event.preventDefault();
          sendResearchMessage();
        });
        // Enter sends (Shift+Enter breaks a line) — a chat box, not a
        // document editor. An IME's Enter confirms its composition.
        researchInputEl.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
            event.preventDefault();
            researchFormEl.requestSubmit();
          }
        });
        // The compass (ADR-0018): the map's mobile body rides the
        // composer dock — shown with the section, collapsed by
        // default, the full map raised by the chevron and dismissed
        // with Escape. The element is the static one in the dock; the
        // toggle wires once.
        const compassEl = document.getElementById("research-compass");
        const toggleEl = document.getElementById("compass-toggle");
        const panelEl = document.getElementById("compass-panel");
        if (compassEl && toggleEl && panelEl) {
          compassEl.hidden = false;
          toggleEl.setAttribute("aria-expanded", "false");
          panelEl.hidden = true;
        }
        if (toggleEl && panelEl && !toggleEl.dataset.wired) {
          toggleEl.dataset.wired = "1";
          toggleEl.addEventListener("click", () => {
            const open = toggleEl.getAttribute("aria-expanded") === "true";
            toggleEl.setAttribute("aria-expanded", String(!open));
            panelEl.hidden = open;
          });
          document.addEventListener("keydown", (event) => {
            if (event.key !== "Escape") return;
            if (toggleEl.getAttribute("aria-expanded") !== "true") return;
            toggleEl.setAttribute("aria-expanded", "false");
            panelEl.hidden = true;
          });
        }
      }

      // One assistant or user bubble; the body is a rendered blocks
      // document (assistant) or plain text (user, status).
      function appendResearchMessage(role, bodyEl) {
        researchChatEl
          .querySelector(".composer-status")
          ?.closest(".research-msg")
          ?.remove();
        researchStatusEl = null;
        const bubble = document.createElement("div");
        bubble.className = `research-msg ${role}`;
        const inner = document.createElement("div");
        inner.className = "research-msg-body";
        inner.append(bodyEl);
        bubble.append(inner);
        researchChatEl.append(bubble);
        scrollResearch();
        return bubble;
      }

      function researchText(text, className = "research-note") {
        const p = document.createElement("p");
        p.className = className;
        p.textContent = text;
        return p;
      }

      function appendResearchError(text) {
        appendResearchMessage("assistant", researchText(text, "error"));
      }

      // The pulsing status bubble — the turn is visible while it runs,
      // gone with the reply (or any failure note).
      function showResearchStatus(message) {
        if (!researchStatusEl || !researchStatusEl.isConnected) {
          researchStatusEl = document.createElement("p");
          researchStatusEl.className = "composer-status";
          const bubble = document.createElement("div");
          bubble.className = "research-msg assistant";
          const inner = document.createElement("div");
          inner.className = "research-msg-body";
          inner.append(researchStatusEl);
          bubble.append(inner);
          researchChatEl.append(bubble);
        }
        researchStatusEl.textContent = message;
        scrollResearch();
      }

      // One assistant reply's blocks — the dive study's renderer,
      // per-bubble: headings, quoted paragraphs (click-through to the
      // reader), server-built references, and the engine's own notes.
      function researchBlocksNode(blocks) {
        const doc = document.createDocumentFragment();
        for (const block of Array.isArray(blocks) ? blocks : []) {
          if (block.type === "heading") {
            const heading = document.createElement("h3");
            heading.className = "doc-heading";
            heading.textContent = block.text;
            doc.append(heading);
          } else if (block.type === "paragraph") {
            doc.append(paragraphNode(block));
          } else if (block.type === "references") {
            const refHeading = document.createElement("h3");
            refHeading.className = "doc-heading";
            refHeading.textContent = "منابع";
            doc.append(refHeading);
            for (const item of Array.isArray(block.items) ? block.items : []) {
              const ref = document.createElement("p");
              ref.className = "cite";
              ref.textContent = item;
              doc.append(ref);
            }
          } else if (block.type === "note") {
            doc.append(researchText(block.text));
          } else if (block.type === "commentary") {
            // The Host's reasoning channel (T5): always tagged, always
            // apart — the reader sees it is not the Books speaking.
            const wrap = document.createElement("p");
            wrap.className = "research-commentary";
            const tag = document.createElement("span");
            tag.className = "commentary-tag";
            tag.textContent = "برداشت";
            wrap.append(tag, document.createTextNode(block.text));
            doc.append(wrap);
          } else if (block.type === "question") {
            doc.append(researchText(block.text, "research-question"));
          }
        }
        return doc;
      }

      // The state strip, drawn as THE MAP (ADR-0009, redrawn ADR-0018):
      // the journey stepper naming the five stages, then the route —
      // destination, research question with its version count, the
      // frontier, the named open questions, the decisions index, the
      // fog, the out-of-scope, and the counts row — from the server's
      // summary projection. ONE renderer feeds BOTH bodies: the
      // desktop rail (#research-rail) and the mobile compass
      // (#research-compass); CSS picks which is visible.
      const RESEARCH_STAGE_LIST = [
        ["orientation", "نام‌گذاری مقصد"],
        ["mapping", "نقشه‌برداری"],
        ["investigating", "گردآوری شواهد"],
        ["synthesizing", "تحلیل و جمع‌بندی"],
        ["drafting", "نوشتن خلاصه"],
      ];

      function renderResearchJourney(stage) {
        const index = RESEARCH_STAGE_LIST.findIndex(([key]) => key === stage);
        for (const journeyEl of [
          researchJourneyEl,
          document.getElementById("compass-journey"),
        ]) {
          if (!journeyEl) continue;
          if (index < 0) {
            journeyEl.hidden = true;
            journeyEl.replaceChildren();
            continue;
          }
          const frag = document.createDocumentFragment();
          RESEARCH_STAGE_LIST.forEach(([key, label], i) => {
            const span = document.createElement("span");
            span.className = `stage${i < index ? " done" : i === index ? " now" : ""}`;
            const dot = document.createElement("span");
            dot.className = "dot";
            dot.setAttribute("aria-hidden", "true");
            span.append(dot, document.createTextNode(label));
            frag.append(span);
          });
          journeyEl.hidden = false;
          journeyEl.replaceChildren(frag);
        }
        // The compass bar's own strip: five mini dots plus the running
        // stage's name — the collapsed map at a glance.
        const dotsEl = document.getElementById("compass-dots");
        if (dotsEl) {
          const dots = document.createDocumentFragment();
          RESEARCH_STAGE_LIST.forEach(([key], i) => {
            const dot = document.createElement("i");
            dot.className =
              i < index ? "done" : i === index ? "now" : "";
            dots.append(dot);
          });
          dotsEl.replaceChildren(dots);
        }
        const nowEl = document.getElementById("compass-now");
        if (nowEl) {
          nowEl.textContent =
            index < 0 ? "" : RESEARCH_STAGE_LIST[index][1];
        }
      }

      const RESEARCH_STATUS_LABELS = {
        pending: "در انتظار",
        searched: "جست‌وجو شد",
        gap: "شکاف",
      };

      // The sections' clamp: the map shows three lines of each long
      // list; the operator's expansions survive the two-second poll
      // and every settle re-render (the map must not collapse under a
      // reading eye).
      const RESEARCH_MAP_CLAMP = 3;
      const researchMapExpanded = new Set();

      function buildMapBody(state, container) {
        if (!container) return;
        const body = document.createDocumentFragment();
        if (state.destination || state.research_question) {
          const head = document.createElement("div");
          head.className = "map-head";
          if (state.destination) {
            const destination = document.createElement("p");
            destination.className = "map-destination";
            destination.textContent = state.destination;
            head.append(destination);
          }
          const question = document.createElement("p");
          question.className = "map-question";
          question.append(
            document.createTextNode("پرسش پژوهش: "),
            document.createTextNode(state.research_question || "—")
          );
          const version = document.createElement("span");
          version.className = "map-rq-version";
          version.textContent = `نسخهٔ ${state.rq_versions || 1}`;
          question.append(version);
          head.append(question);
          body.append(head);
        }
        const section = (key, label) => {
          const sec = document.createElement("div");
          sec.className = "map-sec";
          const k = document.createElement("span");
          k.className = "k";
          k.textContent = label;
          sec.append(k);
          return sec;
        };
        const lineList = (sec, key, lines, fogClass) => {
          const list = document.createElement("ul");
          list.className = "map-lines";
          const expanded = researchMapExpanded.has(key);
          lines.forEach((text, i) => {
            const li = document.createElement("li");
            if (fogClass) li.className = fogClass;
            li.textContent = text;
            if (!expanded && i >= RESEARCH_MAP_CLAMP) li.hidden = true;
            list.append(li);
          });
          sec.append(list);
          if (lines.length > RESEARCH_MAP_CLAMP) {
            const hiddenCount = lines.length - RESEARCH_MAP_CLAMP;
            const more = document.createElement("button");
            more.type = "button";
            more.className = "map-more";
            more.textContent = expanded
              ? MAP_LESS_LABEL
              : `${MAP_MORE_LABEL} (${toPersianDigits(hiddenCount)})`;
            more.addEventListener("click", () => {
              const open = researchMapExpanded.has(key);
              if (open) researchMapExpanded.delete(key);
              else researchMapExpanded.add(key);
              [...list.children].forEach((li, i) => {
                li.hidden = !researchMapExpanded.has(key) && i >= RESEARCH_MAP_CLAMP;
              });
              more.textContent = researchMapExpanded.has(key)
                ? MAP_LESS_LABEL
                : `${MAP_MORE_LABEL} (${toPersianDigits(hiddenCount)})`;
            });
            sec.append(more);
          }
          return sec;
        };
        if (state.frontier) {
          const sec = section("frontier", "در حال پرداختن");
          lineList(sec, "frontier", [`«${state.frontier}»`]).querySelector("li").className =
            "frontier";
          body.append(sec);
        }
        if (Array.isArray(state.open_questions) && state.open_questions.length) {
          const sec = section("open_questions", "پرسش‌های باز");
          lineList(
            sec,
            "open_questions",
            state.open_questions.map(
              (q) => `«${q.name}» (${RESEARCH_STATUS_LABELS[q.status] || q.status})`
            )
          );
          body.append(sec);
        }
        if (Array.isArray(state.decisions) && state.decisions.length) {
          const sec = section("decisions", "تصمیم‌ها");
          lineList(sec, "decisions", state.decisions);
          body.append(sec);
        }
        if (Array.isArray(state.diagnoses) && state.diagnoses.length) {
          const sec = section("diagnoses", "تشخیص‌ها");
          lineList(
            sec,
            "diagnoses",
            state.diagnoses.map((d) => d.cause_label || d.cause)
          );
          body.append(sec);
        }
        if (Array.isArray(state.fog) && state.fog.length) {
          const sec = section("fog", "هنوز نامشخص");
          lineList(sec, "fog", state.fog, "fog");
          body.append(sec);
        }
        if (Array.isArray(state.out_of_scope) && state.out_of_scope.length) {
          const sec = section("out_of_scope", "خارج از دامنه");
          lineList(sec, "out_of_scope", state.out_of_scope);
          body.append(sec);
        }
        const stats = document.createElement("p");
        stats.className = "map-stats";
        const stat = (label, value) => {
          const span = document.createElement("span");
          span.className = "stat";
          const b = document.createElement("b");
          b.textContent = toPersianDigits(value);
          span.append(b, document.createTextNode(` ${label}`));
          return span;
        };
        stats.append(
          stat("شواهد", state.evidence_count || 0),
          stat("ادعاها", (state.claims || []).length),
          stat("شکاف‌ها", (state.gaps || []).length),
          stat("نوبت‌ها", state.turns || 0)
        );
        body.append(stats);
        container.replaceChildren(body);
      }

      function renderResearchState(state) {
        if (!state) return;
        renderResearchJourney(state.stage);
        // The rail keeps its own scroll across the poll re-renders — a
        // map that jumps under a reading eye is a map that gets closed.
        const railEl = document.getElementById("research-rail");
        const railScroll = railEl?.scrollTop ?? 0;
        buildMapBody(state, researchStateBodyEl);
        buildMapBody(state, document.getElementById("compass-state-body"));
        if (railEl) railEl.scrollTop = railScroll;
      }

      // The Session report chip (T19): a DOWNLOAD action, never a turn
      // command — the report read is fetched straight from the server
      // and saved as a blob, no message sent, no turn spent. The label
      // rides in from the server's ONE constant (ui/research.py's
      // RESEARCH_REPORT_CHIP) and is DRAFT, pending PM approval — the
      // shell renames nothing (see the draft marker on #research-suggest).
      // The live session price (T22, GitLab #24): one read after each
      // phase lands — the ledger holds the truth, this only renders it.
      // The chip speaks credit (2026-09-29): beside the absolute Toman,
      // a gold ribbon meter and the sitting's share of the Account's
      // Balance (٪). The percentage exists only while a balance is
      // known — an unknown credit renders no share, never a made-up
      // one; a nonzero spend keeps a sliver of fill so the ribbon
      // never reads as empty against an exact ~0٪.
      async function refreshUsageLive() {
        try {
          const res = await fetch("/usage/live");
          if (!res.ok) return;
          const data = await res.json();
          const el = document.getElementById("usage-live");
          if (!el) return;
          const sessionToman = data.session_toman ?? 0;
          const costText = sessionToman.toLocaleString("fa-IR");
          const note = document.getElementById("usage-note");
          if (note)
            note.textContent = `هزینۀ نشست: ${costText} تومان`;
          const short = document.getElementById("usage-cost-short");
          if (short) short.textContent = `${costText} تومان`;
          const balance = data.balance_toman;
          const hasCredit = typeof balance === "number" && balance > 0;
          el.classList.toggle("has-credit", hasCredit);
          const pctEl = document.getElementById("usage-pct");
          const fill = document.getElementById("usage-meter-fill");
          if (hasCredit) {
            const share = Math.min(100, (sessionToman / balance) * 100);
            const shown =
              share >= 10
                ? Math.round(share)
                : Math.round(share * 10) / 10;
            if (pctEl) {
              pctEl.textContent =
                shown.toLocaleString("fa-IR", { maximumFractionDigits: 1 }) +
                "٪";
              pctEl.hidden = false;
            }
            if (fill)
              fill.style.width =
                (share > 0 ? Math.max(6, share) : 0) + "%";
            const creditNote = document.getElementById(
              "usage-credit-note"
            );
            if (creditNote) {
              creditNote.textContent = USAGE_CREDIT_NOTE;
              creditNote.hidden = false;
            }
          } else {
            if (pctEl) pctEl.hidden = true;
            if (fill) fill.style.width = "0%";
          }
          el.dataset.state = "live";
        } catch (_) {
          // The chip is decoration — a failed read leaves the last value.
        }
      }

      // The report opens as a popup on the sheet itself (the operator's
      // call, 2026-09-22): the artifact inline in the conversation's
      // surface, the download one click beside it — never a forced file
      // drop. The server's Farsi refusal renders in the research chat
      // as before when the read fails.
      async function downloadResearchReport() {
        if (!researchSessionId) return;
        const reportUrl = `/research/report?session=${encodeURIComponent(
          researchSessionId
        )}`;
        try {
          const res = await fetch(reportUrl, { cache: "no-store" });
          if (!res.ok) {
            const payload = await res.json().catch(() => ({}));
            appendResearchError(
              payload.detail || "گزارش نشست دریافت نشد؛ دوباره تلاش کنید."
            );
            return;
          }
        } catch {
          appendResearchError("ارتباط با سرویس پژوهش قطع شد.");
          return;
        }
        const existing = document.getElementById("report-modal");
        if (existing) existing.remove();
        const backdrop = document.createElement("div");
        backdrop.id = "report-modal";
        backdrop.style.cssText =
          "position:fixed;inset:0;background:var(--backdrop);z-index:70;display:flex;align-items:center;justify-content:center;padding:2rem";
        const panel = document.createElement("div");
        panel.style.cssText =
          "background:var(--surface);border:1px solid var(--rule);border-radius:14px;width:min(880px,94vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px var(--shadow)";
        const head = document.createElement("div");
        head.style.cssText =
          "display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;border-bottom:1px solid var(--rule)";
        const title = document.createElement("strong");
        title.textContent = "گزارش نشست";
        const dl = document.createElement("a");
        dl.href = reportUrl;
        dl.setAttribute("download", "");
        dl.className = "browse-btn";
        dl.textContent = "دانلود";
        dl.style.textDecoration = "none";
        const close = document.createElement("button");
        close.type = "button";
        close.className = "browse-btn";
        close.textContent = "بستن";
        close.addEventListener("click", () => backdrop.remove());
        head.append(title, dl, close);
        const frame = document.createElement("iframe");
        frame.src = reportUrl;
        frame.style.cssText = "flex:1;border:none;width:100%";
        frame.title = "گزارش نشست";
        panel.append(head, frame);
        backdrop.append(panel);
        backdrop.addEventListener("click", (event) => {
          if (event.target === backdrop) backdrop.remove();
        });
        document.body.append(backdrop);
      }

      // The chips: the journey's own moves. Move and answer chips send
      // their text as the user's message (the deterministic commands);
      // proposal chips resolve the checkpoint through /research/decide —
      // SHORT labels, the proposal text in the tooltip, never in the
      // chip. The report chip (kind "report", T19) is the exception: it
      // downloads the Session report instead of sending anything, and
      // rides the same row beside the closing review's accept chips.
      function renderResearchSuggestions(suggestions) {
        researchSuggestEl.replaceChildren();
        for (const item of Array.isArray(suggestions) ? suggestions : []) {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "research-chip";
          if (item.kind === "move" || item.kind === "answer" || item.kind === "skip") {
            chip.textContent = item.text;
            chip.addEventListener("click", () => {
              if (researchInputEl.disabled) return;
              researchInputEl.value = item.text;
              researchFormEl.requestSubmit();
            });
          } else if (item.kind === "report") {
            chip.textContent = item.label || "";
            chip.addEventListener("click", downloadResearchReport);
          } else if (item.kind === "proposal") {
            chip.textContent = item.label || (item.accept ? "می‌پذیرم" : "رد می‌کنم");
            if (item.text) chip.title = item.text;
            if (!item.accept) chip.classList.add("reject");
            chip.addEventListener("click", () => {
              // No input-disabled guard here: decideResearch locks the
              // input itself for the call's duration, and a reconnected
              // sitting's input used to arrive disabled and eat the
              // click (the dead-accept fix's other half).
              decideResearch(item.id, item.accept, item.choice);
            });
          } else {
            continue;
          }
          researchSuggestEl.append(chip);
        }
      }

      function renderResearchReply(payload) {
        appendResearchMessage("assistant", researchBlocksNode(payload.reply));
        renderResearchSuggestions(payload.suggestions);
        renderResearchState(payload.research_state);
      }

      function armResearchInput() {
        if (researchInputEl) researchInputEl.disabled = false;
        if (researchSendEl) researchSendEl.disabled = false;
        // The one door (ADR-0015): when the toggle routed the ask
        // here, the shell composer's send re-arms with the settle —
        // every settle path funnels through this function. The re-arm
        // is unconditional: the research turn is the only live run
        // when it fires, so a toggle flipped off mid-turn used to
        // leave the send disabled forever (impeccable critique,
        // 2026-09-28) — the settle must free the composer regardless
        // of the mode the toggle now shows.
        buttonEl.disabled = false;
      }

      function settleResearchTurn(message) {
        stopResearchPolling();
        // A failed or aborted turn drops only the turn handle — the
        // research session itself stays alive in the store (ADR-0016),
        // so the chips, the next message, and the sidebar's reopen all
        // keep working; the old full clear orphaned a live session.
        if (researchSessionId) storeResearch({ session_id: researchSessionId });
        else clearResearch();
        if (message) appendResearchError(message);
        setPhaseState(3, "failed");
        stopPhaseTimer(3);
        setRunningPhase(null);
        armResearchInput();
      }

      async function decideResearch(proposalId, accept, choice) {
        // The session id is the only credential a decide needs (the
        // endpoint is session_id + proposal_id + accept) — the old
        // researchQuery precondition was a leftover of the pre-ADR-0015
        // ask-seeded flow, and after any reconnect it stayed null and
        // silently swallowed every «می‌پذیرم» (the dead-accept fix).
        if (!researchSessionId) return;
        researchInputEl.disabled = true;
        researchSendEl.disabled = true;
        try {
          const res = await fetch("/research/decide", {
            method: "POST",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            body: JSON.stringify({
              session_id: researchSessionId,
              proposal_id: proposalId,
              accept,
              ...(choice ? { choice } : {}),
            }),
          });
          const payload = await res.json().catch(() => ({}));
          if (!res.ok) {
            appendResearchError(
              payload.detail || "تصمیم ثبت نشد؛ دوباره تلاش کنید."
            );
          } else {
            appendResearchMessage(
              "user",
              researchText(accept ? "می‌پذیرم" : "رد می‌کنم", "research-msg-text")
            );
            renderResearchReply(payload);
          }
        } catch {
          appendResearchError("ارتباط با سرویس پژوهش قطع شد.");
        }
        armResearchInput();
      }

      function pollResearchTurn(turnId) {
        const run = researchRun;
        const poll = async () => {
          let payload = null;
          let gone = false;
          try {
            const res = await fetch(
              `/research/turn?turn=${encodeURIComponent(turnId)}`,
              { cache: "no-store" }
            );
            if (res.status === 404) {
              // Unknown turn: the server restarted and took the registry
              // with it, or the turn settled and was reaped beyond the
              // recent window — the recorded failure surface, not a hang.
              // The session itself (and any settled reply) survives in
              // the store.
              gone = true;
            } else if (res.ok) {
              payload = await res.json();
            }
          } catch {
            // A transient network blip is not a settled turn — the next
            // tick retries.
          }
          if (run !== researchRun) {
            // The conversation was reset under this poll (a new ask, a
            // new sitting): settle silently, paint nothing.
            return;
          }
          if (gone) {
            settleResearchTurn("پاسخ پژوهش ناتمام ماند؛ دوباره تلاش کنید.");
            return;
          }
          if (!payload) {
            researchPollTimer = setTimeout(poll, RESEARCH_POLL_MS);
            return;
          }
          if (payload.state === "done") {
            if (!phaseEls[3].startedAt) {
              // Reconnected straight onto a finished turn: seed the
              // frozen chip from the turn's own elapsed.
              phaseEls[3].startedAt = Date.now() - (payload.elapsed || 0) * 1000;
            }
            renderResearchReply(payload);
            clearResearch();
            if (researchSessionId) {
              storeResearch({ session_id: researchSessionId });
            }
            setPhaseState(3, "done");
            stopPhaseTimer(3);
            setRunningPhase(null);
            selectPhase(3);
            armResearchInput();
            return;
          }
          if (payload.state === "failed") {
            const detail = Array.isArray(payload.detail)
              ? payload.detail.join(" ")
              : payload.detail;
            settleResearchTurn(
              detail || "پاسخ پژوهش ناتمام ماند؛ دوباره تلاش کنید."
            );
            return;
          }
          if (payload.state === "aborted") {
            settleResearchTurn("پاسخ پژوهش لغو شد.");
            return;
          }
          // Still running: an honest timer across a reload, and the
          // latest Farsi progress event on the status bubble.
          if (!phaseEls[3].startedAt && payload.elapsed) {
            startPhaseTimer(3, payload.elapsed * 1000);
          }
          const events = Array.isArray(payload.events) ? payload.events : [];
          showResearchStatus(
            events[events.length - 1] || "در حال پیگیری پاسخ پژوهش…"
          );
          researchPollTimer = setTimeout(poll, RESEARCH_POLL_MS);
        };
        poll();
      }

      async function sendResearchMessage() {
        // The retired second door (ADR-0015): the form is hidden, its
        // wiring kept only so the reconnect shape holds. The shell
        // composer with the toggle armed is the way research messages
        // are sent now (submitResearchAsk).
        if (!researchInputEl || researchInputEl.disabled) return;
        const text = researchInputEl.value.trim();
        if (!text) return;
        researchInputEl.value = "";
        researchInputEl.disabled = true;
        researchSendEl.disabled = true;
        await runResearchTurn(text);
      }

      // The toggle's research ask (ADR-0015): the typed question goes
      // straight into the research conversation — the founding message
      // and goal when no research session lives yet, the next message
      // when one does.
      function submitResearchAsk(query) {
        buttonEl.disabled = true;
        if (!researchSessionId) {
          researchQuery = query;
        }
        createResearchSection();
        document.body.classList.add("research-open");
        scrollThreadEnd(false);
        return runResearchTurn(query);
      }

      // The turn runner shared by both doors: bubble, seed-or-continue
      // body, POST, poll — every settle path funnels into
      // armResearchInput, which re-arms the shell composer too.
      async function runResearchTurn(text) {
        const run = researchRun;
        researchSuggestEl.replaceChildren();
        setPhaseState(3, "running");
        setRunningPhase(3);
        const pendingBubble = appendResearchMessage(
          "user",
          researchText(text, "research-msg-text")
        );
        showResearchStatus("برداشت گفتگو…");
        const body = { text };
        if (researchSessionId) {
          body.session_id = researchSessionId;
        } else {
          // The founding turn also names the sitting it belongs to
          // (ADR-0016): the chat Session must exist before the research
          // store can record the linkage a reload or a sidebar trip
          // needs — a store miss still never blocks the ask itself.
          if (!sessionState.storeId) await ensureStoreSession(text);
          // The creating call seeds the session with its founding
          // question and — when a prior ask left one — its Evidence
          // pool (ADR 0008); after this, text alone. The Session's
          // Book pick rides along (ADR-0014): the session's gathers
          // search that Book only.
          body.question = researchQuery;
          body.sources = researchSources;
          if (sessionState.book) body.datasets = [sessionState.book];
          if (sessionState.storeId) body.chat_session_id = sessionState.storeId;
        }
        try {
          const res = await fetch("/research/message", {
            method: "POST",
            headers: { "Content-Type": "application/json; charset=utf-8" },
            body: JSON.stringify(body),
          });
          const payload = await res.json().catch(() => ({}));
          if (run !== researchRun) return;
          if (!res.ok || !payload.turn_id) {
            // A rejection — a busy 429 or a closed session among them —
            // shows the server's Farsi detail; the timer never started
            // for a turn that did not begin, and the optimistic bubble
            // goes with it: the message was never admitted (T11), so no
            // unanswered bubble sits in the transcript.
            pendingBubble.remove();
            appendResearchError(
              payload.detail || "پیام پژوهش فرستاده نشد؛ دوباره تلاش کنید."
            );
            setPhaseState(3, "ready");
            setRunningPhase(null);
            armResearchInput();
            return;
          }
          researchSessionId = payload.session_id;
          storeResearch({
            session_id: researchSessionId,
            turn_id: payload.turn_id,
          });
          startPhaseTimer(3);
          pollResearchTurn(payload.turn_id);
        } catch {
          if (run !== researchRun) return;
          appendResearchError("ارتباط با سرویس پژوهش قطع شد.");
          setPhaseState(3, "ready");
          setRunningPhase(null);
          armResearchInput();
        }
      }

      // The ask seeds the research mode (ADR-0015): the question and
      // its Evidence pool wait as the next research conversation's
      // creating seed. The section itself is never armed by an answer
      // — that is the composer toggle's call (the dive's
      // operator-start rule, kept, now honestly operator-started).
      function armResearch(query, sources) {
        researchQuery = query;
        researchSources = sources;
      }

      // A new ask owns the thread: stop polling, drop the stored
      // identities, and close the research section — the server
      // aborts the Account's in-flight turn and closes its session on
      // the ask's own recall POST (ADR 0008).
      function resetResearch() {
        researchRun += 1;
        stopResearchPolling();
        clearResearch();
        researchSessionId = null;
        researchQuery = null;
        researchSources = [];
        researchStatusEl = null;
        if (researchSectionEl) {
          researchSectionEl.remove();
          researchSectionEl = null;
        }
        researchChatEl = null;
        researchSuggestEl = null;
        researchFormEl = null;
        researchInputEl = null;
        researchSendEl = null;
        researchStateBodyEl = null;
        researchJourneyEl = null;
        if (phaseEls) {
          stopPhaseTimer(3);
          phaseEls[3].mark = null;
          phaseEls[3].timer = null;
          phaseEls[3].startedAt = null;
        }
        document.body.classList.remove("research-open");
