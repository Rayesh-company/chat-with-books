          if (!res.ok) return;
          const data = await res.json();
          if (Array.isArray(data.notes)) {
            // The store wins, but a quick-save the read raced (its POST
            // still in flight) must not flash away — unsaved ids stay.
            const pending = noteStaging.filter((n) => !n.id);
            noteStaging = [...pending, ...data.notes];
          }
          renderNotes();
        } catch (err) {
          renderNotes();
        }
      }

      function faDate(iso) {
        try {
          return new Date(iso).toLocaleDateString("fa-IR");
        } catch (err) {
          return String(iso || "").slice(0, 10);
        }
      }

      function noteSourceLine(note) {
        const s = note.source || {};
        if (s.kind === "book") {
          const pages = note.pages || [];
          const first = pages[0];
          const last = pages[pages.length - 1];
          const span =
            first && last
              ? `، صفحهٔ ${toPersianDigits(first)}${
                  last > first ? `–${toPersianDigits(last)}` : ""
                }`
              : "";
          return `${s.title || note.doc || ""}${span}`;
        }
        const title =
          s.title ||
          (s.session_id ? `نشست ${toPersianDigits(s.session_id)}` : "");
        return title;
      }

      function visibleNotes() {
        const q = nbSearchEl.value.trim();
        const kind = nbFilterEl.value;
        let rows = noteStaging.slice();
        if (kind === "book") rows = rows.filter((n) => !!n.doc);
        if (kind === "session")
          rows = rows.filter(
            (n) => (n.source || {}).kind === "session" && !n.doc
          );
        if (q)
          rows = rows.filter((n) =>
            `${n.text} ${n.opinion} ${n.category}`.includes(q)
          );
        rows.sort((a, b) =>
          nbSortEl.value === "old" ? a.id - b.id : b.id - a.id
        );
        return rows;
      }

      function renderNotes() {
        nbChecks.clear();
        const rows = visibleNotes();
        nbBulkEl.hidden = true;
        notebookEl.classList.remove("nb-selecting");
        nbDelManyEl.textContent = NOTE_DELETE_SELECTED;
        nbDelManyEl.disabled = false;
        // The head badge counts the whole notebook, not the filtered view
        // — the filters' job is the list, not the total.
        nbCountEl.textContent = toPersianDigits(noteStaging.length);
        nbCountEl.hidden = !noteStaging.length;
        if (!rows.length) {
          nbListEl.replaceChildren();
          const empty = document.createElement("p");
          empty.className = "nb-empty";
          const glyph = document.createElement("span");
          glyph.className = "nb-empty-glyph";
          glyph.setAttribute("aria-hidden", "true");
          glyph.innerHTML =
            '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
          const title = document.createElement("span");
          title.className = "nb-empty-title";
          title.textContent = NB_EMPTY;
          const hint = document.createElement("span");
          hint.className = "nb-empty-hint";
          hint.textContent = NB_EMPTY_HINT;
          empty.append(glyph, title, hint);
          nbListEl.append(empty);
          return;
        }
        // Grouped by category (ticket 02): the category header is the
        // group — v1's only row is «بدون دسته» until the PM list lands.
        const groups = new Map();
        for (const note of rows) {
          const key = note.category || NOTE_UNCATEGORIZED;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(note);
        }
        nbListEl.replaceChildren();
        for (const [cat, notes] of groups) {
          const head = document.createElement("p");
          head.className = "nb-group";
          head.textContent = `${cat} (${toPersianDigits(notes.length)})`;
          nbListEl.append(head);
          for (const note of notes) nbListEl.append(noteCard(note));
        }
      }

      function noteCard(note) {
        const card = document.createElement("article");
        card.className = "nb-note";
        card.dataset.noteId = String(note.id ?? "");
        const row = document.createElement("div");
        row.className = "nb-row";
        const check = document.createElement("input");
        check.type = "checkbox";
        check.setAttribute("aria-label", NB_NOTE_CHECK_LABEL);
        check.addEventListener("change", () => {
          if (check.checked) nbChecks.add(note.id);
          else nbChecks.delete(note.id);
          nbBulkEl.hidden = nbChecks.size === 0;
          notebookEl.classList.toggle("nb-selecting", nbChecks.size > 0);
        });
        const body = document.createElement("div");
        body.className = "nb-body";
        const quote = document.createElement("div");
        quote.className = "nb-quote";
        quote.textContent = `«${note.text}»`;
        body.append(quote);
        if (note.opinion) {
          const op = document.createElement("div");
          op.className = "nb-op";
          const opLabel = document.createElement("span");
          opLabel.className = "nb-op-label";
          opLabel.textContent = NOTE_OPINION_LABEL;
          op.append(opLabel, note.opinion);
          body.append(op);
        }
        const meta = document.createElement("div");
        meta.className = "nb-meta";
        const src = document.createElement("span");
        src.textContent = `${noteSourceLine(note)} · ${faDate(
          note.created_at
        )}`;
        meta.append(src);
        const jump = document.createElement("button");
        jump.type = "button";
        jump.className = "nb-jump";
        jump.textContent = NOTE_SOURCE_JUMP;
        if ((note.source || {}).kind === "book" && note.doc) {
          jump.addEventListener("click", () => {
            const pages = note.pages || [];
            closeNotebook();
            openCitation(
              note.doc,
              pages[0] || 1,
              pages[pages.length - 1] || pages[0] || 1,
              note.text
            );
          });
        } else if ((note.source || {}).kind === "session") {
          jump.addEventListener("click", async () => {
            const sid = (note.source || {}).session_id;
            if (!sid) return;
            try {
              const res = await fetch(`/sessions/${sid}`);
              if (!res.ok) throw new Error("gone");
              closeNotebook();
              openStoreSession(sid);
            } catch (err) {
              // The sitting is gone — the note survives, the jump dies.
              note.source.dead = true;
              renderNotes();
            }
          });
          if ((note.source || {}).dead) jump.disabled = true;
        } else {
          jump.disabled = true;
        }
        const edit = document.createElement("button");
        edit.type = "button";
        edit.className = "nb-edit";
        edit.textContent = NB_EDIT;
        edit.addEventListener("click", () => {
          const opening = !editor.classList.contains("open");
          editor.classList.toggle("open");
          if (opening) op.focus();
        });
        const del = document.createElement("button");
        del.type = "button";
        del.className = "nb-del";
        del.textContent = SESSION_DELETE_LABEL;
        del.addEventListener("click", async () => {
          // The sheet's two-step delete (the critique's P1 pattern): the
          // armed state is a solid danger chip, disarmed after 3s.
          if (del.textContent !== NOTE_DELETE_CONFIRM_LABEL) {
            del.textContent = NOTE_DELETE_CONFIRM_LABEL;
            del.classList.add("armed");
            clearTimeout(nbArmTimer);
            nbArmTimer = setTimeout(() => {
              del.textContent = SESSION_DELETE_LABEL;
              del.classList.remove("armed");
            }, 3000);
            return;
          }
          clearTimeout(nbArmTimer);
          del.classList.remove("armed");
          if (note.id) {
            try {
              await fetch(`/notes/${note.id}`, { method: "DELETE" });
            } catch (err) {}
          }
          noteStaging = noteStaging.filter((n) => n !== note);
          renderNotes();
        });
        // The verbs ride one cluster so a wrapping source line never
        // scatters them across the meta row.
        const rowActions = document.createElement("span");
        rowActions.className = "nb-actions";
        rowActions.append(jump, edit, del);
        meta.append(src, rowActions);
        body.append(meta);
        const editor = document.createElement("div");
        editor.className = "nb-editor";
        // The category select only renders once the PM's list gives it
        // more than one row — a single-option dropdown is noise (the
        // polish pass, 2026-10-03); its return is automatic.
        let cat = null;
        if (NOTE_CATEGORIES.length > 1) {
          cat = document.createElement("select");
          for (const c of NOTE_CATEGORIES) {
            const opt = document.createElement("option");
            opt.value = c;
            opt.textContent = c;
            if ((note.category || NOTE_UNCATEGORIZED) === c)
              opt.selected = true;
            cat.append(opt);
          }
          editor.append(cat);
        }
        const op = document.createElement("textarea");
        op.placeholder = NOTE_OPINION_LABEL;
        op.value = note.opinion || "";
        const actions = document.createElement("div");
        actions.className = "nb-editor-actions";
        const save = document.createElement("button");
        save.type = "button";
        save.className = "nb-save";
        save.textContent = NB_SAVE;
        save.addEventListener("click", async () => {
          const category = cat ? cat.value : note.category || NOTE_UNCATEGORIZED;
          const opinion = op.value.trim();
          if (note.id) {
            try {
              const res = await fetch(`/notes/${note.id}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ category, opinion }),
              });
              if (res.ok) {
                const saved = await res.json();
                noteStaging = noteStaging.map((n) =>
                  n === note ? saved : n
                );
              }
            } catch (err) {}
          } else {
            note.category = category;
            note.opinion = opinion;
          }
          renderNotes();
        });
        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.className = "nb-cancel";
        cancel.textContent = NB_CANCEL;
        cancel.addEventListener("click", () =>
          editor.classList.remove("open")
        );
        actions.append(save, cancel);
        editor.append(op, actions);
        body.append(editor);
        row.append(check, body);
        card.append(row);
        return card;
      }

      function selectedNotes() {
        return noteStaging.filter((n) => nbChecks.has(n.id));
      }

      nbCopyEl.addEventListener("click", () => {
        const rows = selectedNotes();
        if (!rows.length) return;
        const text = rows
          .map((n) => {
            const head = `«${n.text}»`;
            const op = n.opinion ? `\n${NOTE_OPINION_LABEL}: ${n.opinion}` : "";
            return `${head}${op}\n— ${noteSourceLine(n)}`;
          })
          .join("\n\n");
        navigator.clipboard
          .writeText(text)
          .then(() => showToast(NB_COPIED))
          .catch(() => {
            // Clipboard permission denied: the legacy path still copies.
            const ta = document.createElement("textarea");
            ta.value = text;
            document.body.append(ta);
            ta.select();
            document.execCommand("copy");
            ta.remove();
            showToast(NB_COPIED);
          });
      });

      function buildNotesPrintHtml(rows) {
        // The zero-dependency PDF: the print view IS the exporter — a
        // plain RTL document the browser prints.
        const items = rows
          .map((n) => {
            const op = n.opinion
              ? `<p class="op">${NOTE_OPINION_LABEL}: ${n.opinion}</p>`
              : "";
            return `<article><blockquote>«${n.text}»</blockquote>${op}<p class="src">${noteSourceLine(
              n
            )} · ${faDate(n.created_at)}</p></article>`;
          })
          .join("\n");
        return `<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>${NOTEBOOK_LABEL}</title><style>body{font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9;color:#222;margin:28px}h1{font-size:18px;border-bottom:2px solid #999;padding-bottom:8px}article{margin:0 0 22px;page-break-inside:avoid}blockquote{margin:0;border-inline-start:3px solid #777;padding-inline-start:10px}.op{font-size:14px}.src{font-size:12px;color:#666}</style></head><body><h1>${NOTEBOOK_LABEL}</h1>${items}</body></html>`;
      }

      nbExportEl.addEventListener("click", () => {
        const rows = selectedNotes();
        if (!rows.length) return;
        const frame = document.createElement("iframe");
        frame.hidden = true;
        frame.addEventListener("load", () => {
          frame.contentWindow.print();
        });
        frame.srcdoc = buildNotesPrintHtml(rows);
        document.body.append(frame);
        setTimeout(() => frame.remove(), 60000);
      });

      nbDelManyEl.addEventListener("click", async () => {
        // Two-step, like the single delete: the first press arms.
        if (nbDelManyEl.textContent !== NB_DELETE_MANY_CONFIRM) {
          nbDelManyEl.textContent = NB_DELETE_MANY_CONFIRM;
          clearTimeout(nbArmTimer);
          nbArmTimer = setTimeout(() => {
            nbDelManyEl.textContent = NOTE_DELETE_SELECTED;
          }, 3000);
          return;
        }
        clearTimeout(nbArmTimer);
        const ids = [...nbChecks];
        try {
          await fetch("/notes/bulk-delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ids }),
          });
        } catch (err) {}
        noteStaging = noteStaging.filter((n) => !nbChecks.has(n.id));
        renderNotes();
      });



      // pdf.js appends its layer spans in EXTRACTION order, which for
      // this Farsi text scatters the lines — a mouse drag selects every
      // span DOM-between its endpoints, so a two-line drag grabbed whole
      // lines the cursor never crossed (the operator's «ناگهان چند خط
      // را با هم گرفت»). Re-lay the spans in the page's own reading
      // order right after the layer settles: DOM order becomes visual
      // order and the drag selects exactly what lies between its ends.
      // Same order buildPageParts speaks: top-to-bottom, then
      // right-to-left.
      function reorderTextLayerInReadingOrder(layerEl) {
        const spans = [...layerEl.querySelectorAll("span")];
        if (spans.length < 2) return;
        const reading = spans
          .map((s) => ({
            s,
            top: parseFloat(s.style.top) || 0,
            left: parseFloat(s.style.left) || 0,
          }))
          .sort((p, q) => p.top - q.top || q.left - p.left);
        for (const { s } of reading) layerEl.append(s);
      }

      // Reading-order item parts: the matcher's ground truth. Each part
      // keeps its normalized stream, its norm→raw index map inside the
      // item's own string, and the item's rect in PDF points.
      function buildPageParts(rec, items, vp) {
        const lines = [];
        items.forEach((item) => {
          if (!item.str || !item.str.trim()) return;
          const x = item.transform[4];
          const y = item.transform[5];
          const h =
            Math.abs(item.transform[3]) ||
            Math.hypot(item.transform[2], item.transform[3]) ||
            10;
          let line = lines.find((l) => Math.abs(l.y - y) <= h * 0.45);
          if (!line) {
            line = { y, hMax: h, entries: [] };
            lines.push(line);
          }
          line.hMax = Math.max(line.hMax, h);
          line.entries.push({ item, x });
        });
        lines.sort((a, b) => b.y - a.y);
        const parts = [];
        let stream = "";
        for (const line of lines) {
          line.entries.sort((a, b) => b.x - a.x);
          for (const { item } of line.entries) {
            const np = normParts(item.str);
            if (!np.stream) continue;
            parts.push({
              x: item.transform[4],
              y: item.transform[5],
              h:
                Math.abs(item.transform[3]) ||
                Math.hypot(item.transform[2], item.transform[3]) ||
                10,
              w: item.width || 0,
              rawLen: [...item.str].length,
              stream: np.stream,
              map: np.map,
              start: stream.length,
            });
            stream += np.stream;
          }
        }
        rec.parts = parts;
        rec.stream = stream;
        rec.pageW = vp.width;
        rec.pageH = vp.height;
      }

      function ensureRendered(n) {
        const rec = reader.recs.get(n);
        if (!rec) return Promise.resolve(null);
        if (rec.rendered) return Promise.resolve(rec);
        if (!rec.promise) {
          rec.promise = new Promise((resolve) => {
            rec.resolve = resolve;
          });
          enqueuePage(n);
        }
        return rec.promise.then(() => (rec.rendered ? rec : null));
      }

      async function gotoPage(n) {
        const rec = reader.recs.get(n);
        if (!rec) return;
        // The sweep anchors here while the scroll is en route —
        // mid-flight the visible page is still far away, and sweeping
        // on that would evict the very page this jump is heading to.
        // INSTANT, not smooth (the comment is load-bearing): the sheet
        // styles .reader-pages with scroll-behavior: smooth, and
        // behavior: "auto" means "honor the stylesheet" — the jump
        // became a smooth animation the busy open window kept
        // canceling, so a far citation never arrived at all. "instant"
        // overrides the stylesheet and lands in one step.
        const from = currentPageNumber();
        if (from && Math.abs(n - from) > 3) reader.fastPaint = n;
        reader.stick = n;
        readerPagesEl.scrollTo({
          top: rec.el.offsetTop - 12,
          behavior: "instant",
        });
        await ensureRendered(n);
        // Re-assert the landing: the open window's async work (the
        // ranged pdf.js parse, the first cold renders) reshuffles the
        // container between the jump and the settle — the rendered
        // target, not the interim drift, is where the reader stands.
        readerPagesEl.scrollTo({
          top: rec.el.offsetTop - 12,
          behavior: "instant",
        });
      }

      // Far pages drop their rasters: hundreds of full-page images
      // would pile up on one continuous scroll through a tall Book.
      function sweepFarPages(current) {
        const anchor = reader.stick ?? current;
        for (const [n, rec] of reader.recs) {
          if (rec.rendered && Math.abs(n - anchor) > 5) {
            rec.el.replaceChildren();
            rec.rendered = false;
            rec.parts = null;
            rec.stream = null;
          }
        }
      }

      let scrollTick = false;
      readerPagesEl.addEventListener("scroll", () => {
        if (scrollTick) return;
        scrollTick = true;
        requestAnimationFrame(() => {
          scrollTick = false;
          const current = currentPageNumber();
          reader.current = current;
          if (document.activeElement !== pageNumEl) markCurrentPage(current);
          if (reader.stick === current) reader.stick = null;
          sweepFarPages(current);
        });
      });

      // ---- Toolbar controls.
      const inputPage = () => {
        const n = Number(toAsciiDigits(pageNumEl.value).trim() || 1);
        if (Number.isFinite(n) && n >= 1) {
          gotoPage(Math.min(n, reader.pageCount));
          markCurrentPage(Math.min(n, reader.pageCount));
        }
      };
      pageNumEl.addEventListener("change", inputPage);
      pageNumEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          inputPage();
          pageNumEl.blur();
        }
      });
      document
        .getElementById("page-prev")
        .addEventListener("click", () => {
          const n = Math.max(1, currentPageNumber() - 1);
          gotoPage(n);
          markCurrentPage(n);
        });
      document
        .getElementById("page-next")
        .addEventListener("click", () => {
          const n = Math.min(reader.pageCount, currentPageNumber() + 1);
          gotoPage(n);
          markCurrentPage(n);
        });
      const setZoom = (zoom) => {
        reader.zoom = Math.min(4, Math.max(0.6, zoom));
        const current = currentPageNumber();
        const width = Math.max(
          280,
          Math.round((readerPagesEl.clientWidth - 35) * reader.zoom)
        );
        const height = Math.round(width * (reader.baseRatio || 1.414));
        for (const rec of reader.recs.values()) {
          rec.el.style.width = `${width}px`;
          rec.el.style.height = `${height}px`;
          if (rec.rendered) {
            rec.el.replaceChildren();
            rec.rendered = false;
            rec.parts = null;
            rec.stream = null;
          }
        }
        gotoPage(current);
      };
      document
        .getElementById("zoom-in")
        .addEventListener("click", () => setZoom(reader.zoom * 1.15));
      document
        .getElementById("zoom-out")
        .addEventListener("click", () => setZoom(reader.zoom / 1.15));

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        if (readerEl.hidden || !reader.pdf) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => setZoom(reader.zoom), 250);
      });

      // ---- Location: which page of the chunk's range holds the quote,
      // and where on that page.
      async function ensurePagesIndex() {
        if (reader.pagesIndexDoc === reader.doc && reader.pagesIndex) {
          return reader.pagesIndex;
        }
        try {
          const res = await fetch(
            `/books/${encodeURIComponent(reader.doc)}.pages.json`,
            // Revalidation, not bypass (ADR-0017): the ETag turns this
            // 1.95 MB index into a 304 on every open after the first —
            // `no-store` here refetched it whole, every time.
            { cache: "default" }
          );
          if (!res.ok) throw new Error("no index");
          reader.pagesIndex = (await res.json()).pages;
          reader.pagesIndexDoc = reader.doc;
          return reader.pagesIndex;
        } catch {
          return null;
        }
      }

      function normalizedPageFromIndex(index, n) {
        if (!reader.normCache.has(n)) {
          reader.normCache.set(n, normStream(index?.[n] || ""));
        }
        return reader.normCache.get(n);
      }

      // The page's letter stream in READING order. pdf.js emits text
      // items in extraction order, which for RTL pages scatters lines —
      // contiguous quotes never match it. So the order is rebuilt from
      // the items' own geometry: lines grouped by baseline (top of the
      // page first), items inside a line right-to-left. Each part keeps
      // its norm→raw index map, so a match in the stream paints onto the
      // exact spans.
      // The quote's matched letter range paints as clay rectangles over
      // the raster: one band per intersecting item, sliced horizontally
      // by the covered raw-character fraction, positioned in percentages
      // of the page so zoom and resize keep it glued to the glyphs.
      function clearHighlights() {
        for (const rect of readerPagesEl.querySelectorAll(".pdf-rect")) {
          rect.remove();
        }
      }

      function paintMatch(rec, at, len, fresh) {
        const end = at + len;
        let painted = false;
        for (const part of rec.parts) {
          const partEnd = part.start + part.stream.length;
          if (partEnd <= at || part.start >= end) continue;
          const fromNorm = Math.max(0, at - part.start);
          const toNorm = Math.min(part.stream.length, end - part.start);
          const rawFrom = part.map[fromNorm];
          const rawTo = part.map[toNorm - 1] + 1;
          const fromFrac = Math.min(1, rawFrom / part.rawLen);
          const toFrac = Math.min(1, rawTo / part.rawLen);
          if (toFrac <= fromFrac) continue;
          const rect = document.createElement("div");
          rect.className = fresh ? "pdf-rect fresh" : "pdf-rect";
          rect.style.left = `${((part.x + part.w * fromFrac) / rec.pageW) * 100}%`;
          rect.style.width = `${((part.w * (toFrac - fromFrac)) / rec.pageW) * 100}%`;
          rect.style.top = `${((rec.pageH - (part.y + part.h * 0.85)) / rec.pageH) * 100}%`;
          rect.style.height = `${((part.h * 1.3) / rec.pageH) * 100}%`;
          rec.el.append(rect);
          painted = true;
        }
        return painted;
      }

      function matchOnPage(rec, needle) {
        const at = rec.stream.indexOf(needle);
        if (at !== -1) {
          return { at, len: needle.length, full: true };
        }
        // Reading order is rebuilt geometrically, but a footnote
        // separator or a running head can still split a long quote.
        // Fall back to the longest contiguous run the page shares with
        // the quote and paint that — partial highlight beats none, and
        // the page-level citation holds either way.
        const run = longestCommonRun(rec.stream, needle);
        const floor = Math.min(80, Math.floor(needle.length * 0.6));
        if (run.len >= floor) {
          return { at: run.atA, len: run.len, full: run.len >= needle.length * 0.9 };
        }
        return null;
      }

      // Longest common contiguous substring of two letter streams —
      // the classic one-row DP; streams here are a few hundred letters.
      function longestCommonRun(a, b) {
        let best = { atA: 0, len: 0 };
        let prev = new Uint16Array(b.length + 1);
        let curr = new Uint16Array(b.length + 1);
        for (let i = 1; i <= a.length; i++) {
          const ai = a.charCodeAt(i - 1);
          for (let j = 1; j <= b.length; j++) {
            curr[j] = ai === b.charCodeAt(j - 1) ? prev[j - 1] + 1 : 0;
            if (curr[j] > best.len) {
              best = { atA: i - curr[j], len: curr[j] };
            }
          }
          const swap = prev;
          prev = curr;
          curr = swap;
        }
        return best;
      }

      async function locatePending() {
        const target = reader.pending;
        if (!target || !reader.pdf) return;
        clearHighlights();
        showReaderNote("");
        const needle = normStream(target.text).slice(0, 1600);
        if (needle.length < 8) {
          reader.pending = null;
          showReaderNote("عبارت برای جست‌وجو کوتاه است.", "error");
          return;
        }
        // Stage 1 — the extracted text index narrows the chunk's page
        // range down to the page(s) that actually hold the quote.
        const first = Math.max(1, target.first);
        const last = Math.min(target.last || first, reader.pageCount);
        let candidates = [];
        let narrowed = false; // true when the index itself found the pages
        const index = await ensurePagesIndex();
        if (index) {
          const from = first || 1;
          const to = last || reader.pageCount;
          for (let n = from; n <= to; n++) {
            if (normalizedPageFromIndex(index, n).includes(needle)) {
              candidates.push(n);
            }
          }
          if (candidates.length) {
            narrowed = true;
          }
          if (!candidates.length && first) {
            // The chunk's page label drifts against the extraction index —
            // recorded live 2026-09-13: a quote labeled 482-484 sat on page
            // 481. Widen ±2 around the labeled range before falling back.
            for (
              let n = Math.max(1, first - 2);
              n <= Math.min(last + 2, reader.pageCount);
              n++
            ) {
              if (normalizedPageFromIndex(index, n).includes(needle)) {
                candidates.push(n);
              }
            }
            if (candidates.length) {
              narrowed = true;
            }
          }
          if (!candidates.length) {
            // Still nothing (a badly drifted label, or none at all): search
            // the whole Book in the index — normalization is cached, this
            // stays cheap. First hit only; a quote lives on one page.
            for (let n = 1; n <= reader.pageCount; n++) {
              if (normalizedPageFromIndex(index, n).includes(needle)) {
                candidates.push(n);
                narrowed = true;
                break;
              }
            }
          }
        }
        if (!candidates.length && first) {
          candidates = [];
          for (let n = first; n <= last; n++) candidates.push(n);
        }
        if (!candidates.length) {
          reader.pending = null;
          showReaderNote(
            "این عبارت در متنِ نمایه‌شدهٔ کتاب پیدا نشد؛ صفحهٔ نخستِ استناد باز می‌ماند.",
            "error"
          );
          return;
        }
        // Stage 2 — the page's reading-order items for the exact bands.
        // Index-narrowed candidates are true positives, three tries
        // enough; a labeled-range fallback (no index, or the quote
        // nowhere in it) tries the WHOLE range — the recorded live
        // complaint was a quote on pages 4-5 of a five-page chunk that
        // never got painted because only the first three were tried.
        const tryList = narrowed ? candidates.slice(0, 3) : candidates.slice(0, 9);
        for (const n of tryList) {
          await gotoPage(n);
          const rec = await ensureRendered(n);
          if (!rec) continue;
          const match = matchOnPage(rec, needle);
          if (match) {
            paintMatch(rec, match.at, match.len, true);
            if (!match.full && match.len < needle.length * 0.7) {
              showReaderNote(
                `بخشی از عبارت در صفحهٔ ${toPersianDigits(n)} برجسته شد.`
              );
            }
            reader.pending = null;
            return;
          }
        }
        // A sentence can straddle a page break: its head ends page p,
        // its tail opens p+1. Split the needle at every offset past a
        // short minimum and look for the two halves back to back.
        for (let pi = 0; pi < candidates.length - 0 && pi < 3; pi++) {
          const p = candidates[pi];
          const q = p + 1;
          const recP = await ensureRendered(p);
          const recQ = await ensureRendered(q);
          if (!recP || !recQ) continue;
          for (let k = 40; k < needle.length - 40; k++) {
            const head = needle.slice(0, k);
            const tail = needle.slice(k);
            if (
              recP.stream.endsWith(head) &&
              recQ.stream.startsWith(tail)
            ) {
              paintMatch(recP, recP.stream.length - head.length, head.length, true);
              paintMatch(recQ, 0, tail.length, true);
              reader.pending = null;
              return;
            }
          }
        }
        await gotoPage(candidates[0]);
        showReaderNote(
          `عبارت در صفحهٔ ${toPersianDigits(candidates[0])} است؛ برجسته‌سازی دقیق آن ممکن نشد.`,
          "error"
        );
        reader.pending = null;
      }

      // ===== The empty state's wiring: Book cards + starter chips. =====
      document.querySelectorAll(".book-card").forEach((card) => {
        card
          .querySelector(".book-select")
          .addEventListener("click", () => startSession(card.dataset.doc));
      });
      document.querySelectorAll(".starter-chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          const card = chip.closest(".book-card");
          startSession(card.dataset.doc, chip.textContent.trim());
        });
      });

      ping();
      refreshUsageLive();

      // The boot (T27 stage 3, GitLab #40): the sidebar lists the
      // Account's Sessions on load — without this a refresh showed an
      // empty list — and the sitting reopens: the tab's own sitting if
      // sessionStorage holds one, else the newest. A refresh returns to
      // the conversation, never to an empty sheet.
      renderSessionList();
      (async () => {
        try {
          const res = await fetch("/sessions", { cache: "no-store" });
          if (!res.ok) return;
          const rows = (await res.json()).sessions || [];
          if (!rows.length) return;
          let stored = null;
          try {
            stored = sessionStorage.getItem("storeSessionId");
          } catch {}
          const target =
            rows.find((row) => String(row.id) === stored) || rows[0];
          if (!sessionState.active) openStoreSession(target.id);
        } catch {}
      })();
    </script>
    <script>
      // The profile (T24, GitLab #27): one self-contained block. The
      // toggle refetches /profile/data every time the section opens —
      // the Balance and the open Session move while the shell sits
      // open — and the render computes no Toman of its own: the
      // numbers, the Session grouping, and each entry's honesty badge
      // (اندازه‌گیری‌شده / تخمینی, the DRAFT server constants) all
      // ride the payload, so the sheet can never dress an estimate up
      // as a measurement. The kind labels below are the ledger's
      // recorded kinds in plain Farsi — DRAFT, pending PM approval
      // (CONTEXT.md's naming discipline, 2026-09-19).
      (function () {
        const toggleBtn = document.getElementById("profile-toggle");
        const section = document.getElementById("profile");
        const numbersEl = document.getElementById("profile-numbers");
        const sessionsEl = document.getElementById("profile-sessions");
        if (!toggleBtn || !section || !numbersEl || !sessionsEl) return;

        const KIND_LABELS = {
          ask: "پرسش",
          picker: "گزینش",
          writer: "پاسخ استنادی",
          composer: "جست‌وجوی بیشتر",
          turn: "نوبت پژوهش",
        };
        const toman = (n) => (n || 0).toLocaleString("fa-IR");
        const faTs = (ts) =>
          String(ts || "").replace(/[0-9]/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);

        function renderProfile(data) {
          // The simplified profile (the operator's call, 2026-09-22):
          // credit remaining and the ongoing session — nothing else.
          // The spend history stays in the ledger where the console
          // reads it; the sheet never re-dumps it.
          const heroLabel = document.createElement("span");
          heroLabel.className = "profile-hero-label";
          heroLabel.textContent = "اعتبار";
          const balance = document.createElement("span");
          balance.className = "profile-balance";
          balance.textContent = toman(data.balance_toman) + " تومان";
          numbersEl.replaceChildren(heroLabel, balance);
          const sessions = Array.isArray(data.sessions) ? data.sessions : [];
          sessionsEl.replaceChildren();
          const open = sessions.length ? sessions[0] : null;
          if (!open) {
            const empty = document.createElement("p");
            empty.className = "empty";
            empty.textContent = "نشست جاری باز نیست.";
            sessionsEl.append(empty);
            return;
          }
          const row = document.createElement("div");
          row.className = "profile-ongoing";
          const label = document.createElement("span");
          label.textContent = "نشست جاری";
          const startedMs = Date.parse(String(open.started || ""));
          let elapsed = "";
          if (Number.isFinite(startedMs)) {
            const minutes = Math.max(
              0,
              Math.round((Date.now() - startedMs) / 60000)
            );
            elapsed =
              (minutes >= 60
                ? Math.floor(minutes / 60).toLocaleString("fa-IR") +
                  " ساعت و " +
                  (minutes % 60).toLocaleString("fa-IR")
                : minutes.toLocaleString("fa-IR")) + " دقیقه · ";
          }
          const detail = document.createElement("span");
          detail.className = "profile-ongoing-detail";
          detail.textContent = elapsed + toman(open.cost_toman) + " تومان";
          row.append(label, detail);
          sessionsEl.append(row);
        }

        async function refreshProfile() {
          try {
            const res = await fetch("/profile/data", { cache: "no-store" });
            if (!res.ok) {
              numbersEl.textContent = "پروفایل بارگیری نشد.";
              sessionsEl.replaceChildren();
              return;
            }
            renderProfile(await res.json());
          } catch (_) {
            numbersEl.textContent = "ارتباط با سرویس قطع شد.";
          }
        }

        toggleBtn.addEventListener("click", function () {
          setOpen(section.hidden);
        });

        // The card anchors to its own button (physical offsets from the
        // button's rect: it lands beside the toggle at every breakpoint
        // and both directions), focus moves in, and the open card
        // closes on Escape, an outside click, or a resize — the
        // popover's contract, not a page section's.
        let outsideClose = null;
        let escapeClose = null;
        function place() {
          const rect = toggleBtn.getBoundingClientRect();
          section.style.top = Math.round(rect.bottom + 8) + "px";
          // Anchor to the button's edge, then keep the card inside the
          // viewport: the wrapped topbar can carry the button to the
          // physical left, where right-anchoring alone would push the
          // card out past the other edge.
          const cardW = Math.min(336, innerWidth - 16);
          if (rect.right - cardW < 8) {
            section.style.right = "auto";
            section.style.left = Math.max(8, Math.round(rect.left)) + "px";
          } else {
            section.style.left = "auto";
            section.style.right =
              Math.max(8, Math.round(innerWidth - rect.right)) + "px";
          }
        }
        function close() {
          section.hidden = true;
          toggleBtn.setAttribute("aria-expanded", "false");
          if (outsideClose) {
            document.removeEventListener("click", outsideClose, true);
            outsideClose = null;
          }
          if (escapeClose) {
            document.removeEventListener("keydown", escapeClose, true);
            escapeClose = null;
          }
          toggleBtn.focus();
        }
        function setOpen(open) {
          if (!open) {
            close();
            return;
          }
          place();
          section.hidden = false;
          toggleBtn.setAttribute("aria-expanded", "true");
          refreshProfile();
          outsideClose = (event) => {
            if (!section.contains(event.target) && event.target !== toggleBtn)
              close();
          };
          escapeClose = (event) => {
            if (event.key === "Escape") close();
          };
          document.addEventListener("click", outsideClose, true);
          document.addEventListener("keydown", escapeClose, true);
          section.focus();
        }
        // A resize re-anchors instead of closing: phones resize
        // constantly (URL bar, keyboard) — a card that died on every
        // resize would never survive a scroll.
        window.addEventListener("resize", () => {
          if (!section.hidden) place();
        });

        // The Admin's door: /auth/me names the role on load; only the
        // admin's topbar carries «میز مدیریت» (ADR-0013's role). A 401
        // (anonymous) or any miss keeps the link hidden — the overlay
        // gate owns the not-logged-in case.
        fetch("/auth/me", { cache: "no-store" })
          .then((res) => (res.ok ? res.json() : null))
          .then((me) => {
            if (me && me.role === "admin") {
              const link = document.getElementById("admin-link");
              if (link) link.hidden = false;
            }
          })
          .catch(() => {});
      })();
    </script>
  </body>
