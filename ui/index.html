      // and falls back to a timer if the frame doesn't run within half
      // a second, so hidden surfaces render too.
      function installAnimationFrameWatchdog() {
        const native = window.requestAnimationFrame.bind(window);
        let nextHandle = 1;
        const pending = new Map();
        window.requestAnimationFrame = (callback) => {
          const handle = nextHandle++;
          let done = false;
          const fire = (time) => {
            if (done) return;
            done = true;
            pending.delete(handle);
            callback(time);
          };
          const nativeId = native(fire);
          const timerId = setTimeout(() => fire(performance.now()), 500);
          pending.set(handle, { nativeId, timerId });
          return handle;
        };
        const nativeCancel = window.cancelAnimationFrame.bind(window);
        window.cancelAnimationFrame = (handle) => {
          const entry = pending.get(handle);
          if (entry) {
            pending.delete(handle);
            nativeCancel(entry.nativeId);
            clearTimeout(entry.timerId);
            return;
          }
          nativeCancel(handle);
        };
      }
      installAnimationFrameWatchdog();

      async function ensurePdfJs() {
        if (!reader.lib) {
          reader.lib = await import("./vendor/pdf.min.mjs");
          reader.lib.GlobalWorkerOptions.workerSrc =
            "/vendor/pdf.worker.min.mjs";
        }
        return reader.lib;
      }

      function showReaderNote(message, kind) {
        clearTimeout(reader.noteTimer);
        readerNoteEl.hidden = !message;
        readerNoteEl.textContent = message || "";
        if (kind) readerNoteEl.dataset.kind = kind;
        else delete readerNoteEl.dataset.kind;
        // Errors stay until the next action silences them — a note that
        // vanishes after 8 seconds is a failure nobody saw.
        if (message && kind !== "error") {
          reader.noteTimer = setTimeout(() => {
            readerNoteEl.hidden = true;
          }, 8000);
        }
      }

      // ---- The normalized letter stream: the client twin of
      // guard.py's normalize_for_match — Arabic yeh/kaf unified,
      // tashkeel and kashida stripped, every non-word character
      // deleted (the PDF's backspace noise and ZWNJ among them). JS's
      // \w is ASCII-only, so the word-character keep is spelled with
      // Unicode property classes.
      // The client twin of guard.py's _display_clean: the Book text
      // layer's \b backspace word separators render as nothing in the
      // browser, fusing the words. Any non-whitespace control character
      // becomes the space the layer meant, and every whitespace run
      // becomes one space. ZWNJ is not whitespace, so می‌تواند keeps its
      // join. Applied where layer text reaches the sheet: quote spans,
      // the Evidence pool lines, and the passages sent back upstream —
      // including quotes restored from a stored sitting, which repair
      // visually without a store rewrite.
      function cleanFarsi(text) {
        return String(text)
          .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function normParts(text) {
        let stream = "";
        const map = []; // norm char index -> raw UTF-16 index
        let raw = 0;
        for (const ch of String(text)) {
          let c = ch === "ي" ? "ی" : ch === "ك" ? "ک" : ch;
          if (/[\u064B-\u065F\u0670\u0640]/.test(c)) {
            raw += ch.length;
            continue;
          }
          if (/[\p{L}\p{N}_]/u.test(c)) {
            const lc = c.toLowerCase();
            // The two extractors disagree on the lam-alef ligature's
            // decomposition order (لا vs ال) — canonicalize so a quote
            // from one matches a page built by the other.
            if (lc === "ا" && stream.endsWith("ل")) {
              const lamRaw = map.pop();
              stream = stream.slice(0, -1);
              stream += "ا" + "ل";
              map.push(raw, lamRaw);
            } else {
              stream += lc;
              map.push(raw);
            }
          }
          raw += ch.length;
        }
        return { stream, map };
      }

      function normStream(text) {
        return normParts(text).stream;
      }

      // ---- Citation clicks → the reader. Delegated: quotes render in
      // three places (Quote selection, Quoted/research paragraphs, the
      // Evidence pool) and the pool's lines parse at click time.
      function openCitationFromElement(el) {
        const doc = el.dataset.doc;
        if (!doc) return;
        const range = el.dataset.pages || "";
        const dash = range.indexOf("-");
        const first = dash === -1 ? Number(range) : Number(range.slice(0, dash));
        const last = dash === -1 ? first : Number(range.slice(dash + 1));
        openCitation(doc, first || 0, last || 0, el.textContent);
      }

      function splitLocator(line) {
        const at = line.indexOf(': "');
        if (at === -1) {
          return { reference: line.trim(), passage: "" };
        }
        return {
          reference: line.slice(0, at).trim(),
          passage: line.slice(at + 3).replace(/"$/, "").trim(),
        };
      }

      document.addEventListener("click", (event) => {
        const sent = event.target.closest("span.cite-sent");
        if (sent) {
          openCitationFromElement(sent);
          return;
        }
        const cite = event.target.closest("p.cite");
        if (cite) {
          const { reference, passage } = splitLocator(cite.textContent || "");
          const located = parseReference(reference);
          if (located.doc) {
            // The reference line names a locator, not a passage: fall
            // back to the quote span that claimed the same locator
            // (ADR-0010) so the reader locates and highlights instead
            // of opening the chunk's first page blind.
            const located_passage =
              passage ||
              locatorPassages.get(
                `${located.doc}|${located.first}-${located.last}`
              ) ||
              "";
            openCitation(located.doc, located.first, located.last, located_passage);
          }
        }
      });
      document.addEventListener("keydown", (event) => {
        if (
          (event.key === "Enter" || event.key === " ") &&
          event.target.classList?.contains("cite-sent")
        ) {
          event.preventDefault();
          openCitationFromElement(event.target);
        }
      });

      async function openCitation(doc, first, last, text) {
        openReaderPanel();
        reader.pending =
          first && text ? { first, last: last || first, text } : null;
        await openBook(doc, first || 1);
        if (!reader.pending) {
          showReaderNote(
            first
              ? ""
              : "صفحهٔ این نقل‌قول در کتاب مشخص نیست؛ کتاب از آغاز باز شد.",
            first ? undefined : "error"
          );
          return;
        }
        await locatePending();
      }

      // ---- Panel + toolbar wiring.
      function openReaderPanel() {
        readerEl.hidden = false;
        readerBackdrop.hidden = false;
        document.body.classList.add("reader-open");
      }

      function closeReaderPanel() {
        readerEl.hidden = true;
        readerBackdrop.hidden = true;
        document.body.classList.remove("reader-open");
      }

      document
        .getElementById("reader-browse")
        .addEventListener("click", () => {
          openReaderPanel();
          let saved = null;
          try {
            saved = JSON.parse(sessionStorage.getItem("readerPos") || "null");
          } catch {}
          openBook(
            saved?.doc && READER_BOOK_TITLES[saved.doc] ? saved.doc : "tarhe-kolli",
            saved?.page || 1
          );
        });
      document
        .getElementById("reader-close")
        .addEventListener("click", closeReaderPanel);
      readerBackdrop.addEventListener("click", closeReaderPanel);
      document.addEventListener("keydown", (event) => {
        if (
          event.key === "Escape" &&
          !readerEl.hidden &&
          event.target !== pageNumEl
        ) {
          closeReaderPanel();
          return;
        }
        if (event.key === "Escape" && shellEl.classList.contains("sl-open")) {
          setSidebar(false);
        }
      });
      document.querySelectorAll(".reader-book").forEach((button) => {
        button.addEventListener("click", () => {
          openBook(button.dataset.doc, 1);
        });
      });

      const savedPosition = () => {
        try {
          return JSON.parse(sessionStorage.getItem("readerPos") || "null");
        } catch {
          return null;
        }
      };
      const savePosition = (doc, page) =>
        sessionStorage.setItem("readerPos", JSON.stringify({ doc, page }));

      function currentPageNumber() {
        const box = readerPagesEl.getBoundingClientRect();
        const mid = box.top + box.height / 2;
        let current = 1;
        for (const [n, rec] of reader.recs) {
          const r = rec.el.getBoundingClientRect();
          if (r.top <= mid && r.bottom > mid) return n;
          if (r.bottom <= mid) current = Math.min(n + 1, reader.pageCount);
        }
        return current;
      }

      function markCurrentPage(n) {
        pageNumEl.value = toPersianDigits(n);
        savePosition(reader.doc, n);
      }

      // ---- Document loading and lazy page rendering.
      function resetReaderDom() {
        reader.recs.clear();
        reader.normCache.clear();
        reader.pagesIndex = null;
        reader.pagesIndexDoc = null;
        readerPagesEl.replaceChildren();
      }

      // The visual pipeline is a SERVER-side PDFium raster per page
      // (/books/<doc>/page/<n>.png — pixel-perfect for these Persian
      // subset fonts, ADR-0007's rendering addendum); pdf.js stays only
      // for parsing and the transparent selection layer, never draws.

      const BOOK_PAGE_COUNTS = { "tarhe-kolli": 807, "70143-336": 346 };

      async function openBook(doc, page) {
        const gen = ++reader.gen;
        openReaderPanel();
        showReaderNote("");
        document.querySelectorAll(".reader-book").forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.doc === doc)
          );
        });
        readerTitleEl.textContent = READER_BOOK_TITLES[doc] || doc;
        document.getElementById("book-download").href =
          `/books/${encodeURIComponent(doc)}.pdf`;

        const needsDocInit = reader.doc !== doc || !reader.recs.size;
        if (needsDocInit) {
          reader.doc = doc;
          reader.pageCount = BOOK_PAGE_COUNTS[doc] || 807;
          resetReaderDom();
          pageCountEl.textContent = `از ${toPersianDigits(reader.pageCount)}`;
          buildPlaceholders();
        }

        markCurrentPage(Math.min(Math.max(page || 1, 1), reader.pageCount));
        await gotoPage(Math.min(Math.max(page || 1, 1), reader.pageCount));

          try {
            await ensurePdfJs();
            if (reader.doc === doc && (!reader.pdf || reader.pdfDoc !== doc)) {
              const previousTask = reader.loadingTask || null;
              const task = reader.lib.getDocument({
                url: `/books/${encodeURIComponent(doc)}/book`,
                cMapUrl: "/vendor/cmaps/",
                cMapPacked: true,
                standardFontDataUrl: "/vendor/standard_fonts/",
                isEvalSupported: false,
                // Lazy data (ADR-0017): pdf.js fetches only the byte
                // ranges the parsed pages actually need (the server
                // honors Range), instead of pulling the whole 16 MB in
                // the background on every open. The cMaps stay — the
                // Identity-H subsets' text layer depends on them.
                disableAutoFetch: true,
              });
            reader.loadingTask = task;
            const pdf = await task.promise;
            if (gen !== reader.gen) return;
            if (previousTask) previousTask.destroy();
            reader.pdf = pdf;
            reader.pdfDoc = doc;
            reader.pageCount = pdf.numPages;
            pageCountEl.textContent = `از ${toPersianDigits(reader.pageCount)}`;
            const first = await pdf.getPage(1);
            const vp1 = first.getViewport({ scale: 1 });
            reader.baseWidth = vp1.width;
            reader.baseRatio = vp1.height / vp1.width;

            // Upgrade any already-rendered visible pages with text layers
            for (const [n, rec] of reader.recs) {
              if (rec.rendered && !rec.el.querySelector(".textLayer")) {
                rec.rendered = false;
                enqueuePage(n);
              }
            }
          }
        } catch (err) {
          if (gen !== reader.gen) return;
          console.error("openBook background pdf.js load failed:", err);
        }
      }

      function buildPlaceholders() {
        if (reader.observer) reader.observer.disconnect();
        const frag = document.createDocumentFragment();
        // The panel can be measured at 0 before its first layout — a
        // negative width would build invisible zero-height placeholders
        // and the observer would never fire on them, leaving the panel
        // dark forever. Zoom multiplies the layout width.
        const width = Math.max(
          280,
          Math.round((readerPagesEl.clientWidth - 35) * reader.zoom)
        );
        const height = Math.round(width * (reader.baseRatio || 1.414));
        for (let n = 1; n <= reader.pageCount; n++) {
          const el = document.createElement("div");
          el.className = "reader-page";
          el.dataset.page = n;
          el.style.width = `${width}px`;
          el.style.height = `${height}px`;
          frag.append(el);
          reader.recs.set(n, { el, rendered: false, job: null });
        }
        readerPagesEl.append(frag);
        // Render entries lazily but SERIALIZED, ordered by distance from
        // the scroll anchor (ADR-0017): one page at a time — a long jump
        // (page 1 → 740) crosses dozens of placeholders, and concurrent
        // canvas paints would freeze the sheet — but the anchor's own
        // page goes FIRST, where the old first-come chain made the jump
        // target wait behind every neighbor the observer had queued.
        reader.queue = new Set();
        reader.pump = null;
        reader.observer = new IntersectionObserver(
          (entries) => {
            for (const entry of entries) {
              if (!entry.isIntersecting) continue;
              enqueuePage(Number(entry.target.dataset.page));
            }
          },
          { root: readerPagesEl, rootMargin: "700px 0px" }
        );
        for (const rec of reader.recs.values()) {
          reader.observer.observe(rec.el);
        }
      }

      // The render scheduler: a Set of pending page numbers drained by
      // one worker, each pick the page nearest the anchor (the stick of
      // a jump, else the page the scroll handler last saw in view —
      // measuring 800 rects per render is a jank the reader can't
      // afford). renderPage stays serialized — only the order moved.
      function enqueuePage(n) {
        if (!reader.recs.has(n)) return;
        reader.queue.add(n);
        pumpPages();
      }

      function pumpPages() {
        if (reader.pump) return;
        reader.pump = (async () => {
          while (reader.queue.size) {
            const anchor = reader.stick ?? reader.current ?? 1;
            let best = null;
            let bestDist = Infinity;
            for (const n of reader.queue) {
              const dist = Math.abs(n - anchor);
              if (dist < bestDist) {
                bestDist = dist;
                best = n;
              }
            }
            reader.queue.delete(best);
            await renderPage(best).catch(() => {});
          }
        })().finally(() => {
          reader.pump = null;
        });
      }

      async function renderPage(n) {
        const rec = reader.recs.get(n);
        if (!rec || rec.rendered || rec.job) return;
        const gen = reader.gen;
        rec.job = (async () => {
          let vp = null;
          let page = null;
          if (reader.pdf && reader.pdfDoc === reader.doc) {
            try {
              page = await reader.pdf.getPage(n);
              vp = page.getViewport({ scale: 1 });
            } catch (e) {
              console.warn("pdf.getPage failed for page", n, e);
            }
          }
          const widthPx = Math.max(
            280,
            Math.round((readerPagesEl.clientWidth - 35) * reader.zoom)
          );
          const heightPx = vp
            ? Math.round(widthPx * (vp.height / vp.width))
            : Math.round(widthPx * (reader.baseRatio || 1.414));
          const dpr = Math.min(2.5, window.devicePixelRatio || 1);
          const img = document.createElement("img");
          img.className = "reader-img";
          img.alt = `صفحهٔ ${toPersianDigits(n)}`;
          img.decoding = "async";
          const fullSrc = `/books/${encodeURIComponent(reader.doc)}/page/${n}.png?w=${Math.round(
            widthPx * dpr
          )}`;
          if (reader.fastPaint === n) {
            // The far jump's first paint (ADR-0017): the small cached
            // bucket fills the placeholder immediately — a page that
            // arrives blurry in 0.2s beats one that arrives sharp in
            // 3s — and the full-width raster swaps in on load. Both
            // buckets are `immutable`-cached; the pre-warm only ever
            // costs its bytes once.
            reader.fastPaint = null;
            img.src = `/books/${encodeURIComponent(reader.doc)}/page/${n}.png?w=480`;
            img.addEventListener(
              "load",
              () => {
                if (gen !== reader.gen) return;
                img.src = fullSrc;
              },
              { once: true }
            );
          } else {
            img.src = fullSrc;
          }
          rec.el.replaceChildren(img);
          rec.el.style.height = `${heightPx}px`;

          // The transparent selection layer, positioned over the raster.
          if (page && vp) {
            try {
              const textLayerEl = document.createElement("div");
              textLayerEl.className = "textLayer";
              const layer = new reader.lib.TextLayer({
                textContentSource: page.streamTextContent(),
                container: textLayerEl,
                viewport: page.getViewport({ scale: widthPx / vp.width }),
              });
              await layer.render();
              if (gen !== reader.gen) return;
              rec.el.append(textLayerEl);
              const content = await page.getTextContent();
              if (gen !== reader.gen) return;
              buildPageParts(rec, content.items, vp);
            } catch (err) {
              console.warn("TextLayer render failed:", err);
            }
          }
          rec.rendered = true;
        })();
        try {
          await rec.job;
        } catch (err) {
          rec.rendered = false;
          console.error("renderPage failed:", err);
          showReaderNote(
            "رندر صفحه ناموفق بود: " + String(err && err.message ? err.message : err),
            "error"
          );
        } finally {
          rec.job = null;
          // The waiter pattern: ensureRendered resolves the exact page
          // it asked for, whether the scheduler rendered it just now or
          // the page was already done when the wait began.
          const resolve = rec.resolve;
          rec.promise = null;
          rec.resolve = null;
          resolve?.();
        }
      }

      // Reading-order item parts: the matcher's ground truth. Each part
      // keeps its normalized stream, its norm→raw index map inside the
      // item's own string, and the item's rect in PDF points.
      function buildPageParts(rec, items, vp) {
        const lines = [];
        items.forEach((item) => {
          if (!item.str || !item.str.trim()) return;
          const x = item.transform[4];
          const y = item.transform[5];
          const h =
            Math.abs(item.transform[3]) ||
            Math.hypot(item.transform[2], item.transform[3]) ||
            10;
          let line = lines.find((l) => Math.abs(l.y - y) <= h * 0.45);
          if (!line) {
            line = { y, hMax: h, entries: [] };
            lines.push(line);
          }
          line.hMax = Math.max(line.hMax, h);
          line.entries.push({ item, x });
        });
        lines.sort((a, b) => b.y - a.y);
        const parts = [];
        let stream = "";
        for (const line of lines) {
          line.entries.sort((a, b) => b.x - a.x);
          for (const { item } of line.entries) {
            const np = normParts(item.str);
            if (!np.stream) continue;
            parts.push({
              x: item.transform[4],
              y: item.transform[5],
              h:
                Math.abs(item.transform[3]) ||
                Math.hypot(item.transform[2], item.transform[3]) ||
                10,
              w: item.width || 0,
              rawLen: [...item.str].length,
              stream: np.stream,
              map: np.map,
              start: stream.length,
            });
            stream += np.stream;
          }
        }
        rec.parts = parts;
        rec.stream = stream;
        rec.pageW = vp.width;
        rec.pageH = vp.height;
      }

      function ensureRendered(n) {
        const rec = reader.recs.get(n);
        if (!rec) return Promise.resolve(null);
        if (rec.rendered) return Promise.resolve(rec);
        if (!rec.promise) {
          rec.promise = new Promise((resolve) => {
            rec.resolve = resolve;
          });
          enqueuePage(n);
        }
        return rec.promise.then(() => (rec.rendered ? rec : null));
      }

      async function gotoPage(n) {
        const rec = reader.recs.get(n);
        if (!rec) return;
        // The sweep anchors here while the scroll is en route —
        // mid-flight the visible page is still far away, and sweeping
        // on that would evict the very page this jump is heading to.
        // INSTANT, not smooth (the comment is load-bearing): the sheet
        // styles .reader-pages with scroll-behavior: smooth, and
        // behavior: "auto" means "honor the stylesheet" — the jump
        // became a smooth animation the busy open window kept
        // canceling, so a far citation never arrived at all. "instant"
        // overrides the stylesheet and lands in one step.
        const from = currentPageNumber();
        if (from && Math.abs(n - from) > 3) reader.fastPaint = n;
        reader.stick = n;
        readerPagesEl.scrollTo({
          top: rec.el.offsetTop - 12,
          behavior: "instant",
        });
        await ensureRendered(n);
        // Re-assert the landing: the open window's async work (the
        // ranged pdf.js parse, the first cold renders) reshuffles the
        // container between the jump and the settle — the rendered
        // target, not the interim drift, is where the reader stands.
        readerPagesEl.scrollTo({
          top: rec.el.offsetTop - 12,
          behavior: "instant",
        });
      }

      // Far pages drop their rasters: hundreds of full-page images
      // would pile up on one continuous scroll through a tall Book.
      function sweepFarPages(current) {
        const anchor = reader.stick ?? current;
        for (const [n, rec] of reader.recs) {
          if (rec.rendered && Math.abs(n - anchor) > 5) {
            rec.el.replaceChildren();
            rec.rendered = false;
            rec.parts = null;
            rec.stream = null;
          }
        }
      }

      let scrollTick = false;
      readerPagesEl.addEventListener("scroll", () => {
        if (scrollTick) return;
        scrollTick = true;
        requestAnimationFrame(() => {
          scrollTick = false;
          const current = currentPageNumber();
          reader.current = current;
          if (document.activeElement !== pageNumEl) markCurrentPage(current);
          if (reader.stick === current) reader.stick = null;
          sweepFarPages(current);
        });
      });

      // ---- Toolbar controls.
      const inputPage = () => {
        const n = Number(toAsciiDigits(pageNumEl.value).trim() || 1);
        if (Number.isFinite(n) && n >= 1) {
          gotoPage(Math.min(n, reader.pageCount));
          markCurrentPage(Math.min(n, reader.pageCount));
        }
      };
      pageNumEl.addEventListener("change", inputPage);
      pageNumEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          inputPage();
          pageNumEl.blur();
        }
      });
      document
        .getElementById("page-prev")
        .addEventListener("click", () => {
          const n = Math.max(1, currentPageNumber() - 1);
          gotoPage(n);
          markCurrentPage(n);
        });
      document
        .getElementById("page-next")
        .addEventListener("click", () => {
          const n = Math.min(reader.pageCount, currentPageNumber() + 1);
          gotoPage(n);
          markCurrentPage(n);
        });
      const setZoom = (zoom) => {
        reader.zoom = Math.min(4, Math.max(0.6, zoom));
        const current = currentPageNumber();
        const width = Math.max(
          280,
          Math.round((readerPagesEl.clientWidth - 35) * reader.zoom)
        );
        const height = Math.round(width * (reader.baseRatio || 1.414));
        for (const rec of reader.recs.values()) {
          rec.el.style.width = `${width}px`;
          rec.el.style.height = `${height}px`;
          if (rec.rendered) {
            rec.el.replaceChildren();
            rec.rendered = false;
            rec.parts = null;
            rec.stream = null;
          }
        }
        gotoPage(current);
      };
      document
        .getElementById("zoom-in")
        .addEventListener("click", () => setZoom(reader.zoom * 1.15));
      document
        .getElementById("zoom-out")
        .addEventListener("click", () => setZoom(reader.zoom / 1.15));

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        if (readerEl.hidden || !reader.pdf) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => setZoom(reader.zoom), 250);
      });

      // ---- Location: which page of the chunk's range holds the quote,
      // and where on that page.
      async function ensurePagesIndex() {
        if (reader.pagesIndexDoc === reader.doc && reader.pagesIndex) {
          return reader.pagesIndex;
        }
        try {
          const res = await fetch(
            `/books/${encodeURIComponent(reader.doc)}.pages.json`,
            // Revalidation, not bypass (ADR-0017): the ETag turns this
            // 1.95 MB index into a 304 on every open after the first —
            // `no-store` here refetched it whole, every time.
            { cache: "default" }
          );
          if (!res.ok) throw new Error("no index");
          reader.pagesIndex = (await res.json()).pages;
          reader.pagesIndexDoc = reader.doc;
          return reader.pagesIndex;
        } catch {
          return null;
        }
      }

      function normalizedPageFromIndex(index, n) {
        if (!reader.normCache.has(n)) {
          reader.normCache.set(n, normStream(index?.[n] || ""));
        }
        return reader.normCache.get(n);
      }

      // The page's letter stream in READING order. pdf.js emits text
      // items in extraction order, which for RTL pages scatters lines —
      // contiguous quotes never match it. So the order is rebuilt from
      // the items' own geometry: lines grouped by baseline (top of the
      // page first), items inside a line right-to-left. Each part keeps
      // its norm→raw index map, so a match in the stream paints onto the
      // exact spans.
      // The quote's matched letter range paints as clay rectangles over
      // the raster: one band per intersecting item, sliced horizontally
      // by the covered raw-character fraction, positioned in percentages
      // of the page so zoom and resize keep it glued to the glyphs.
      function clearHighlights() {
        for (const rect of readerPagesEl.querySelectorAll(".pdf-rect")) {
          rect.remove();
        }
      }

      function paintMatch(rec, at, len, fresh) {
        const end = at + len;
        let painted = false;
        for (const part of rec.parts) {
          const partEnd = part.start + part.stream.length;
          if (partEnd <= at || part.start >= end) continue;
          const fromNorm = Math.max(0, at - part.start);
          const toNorm = Math.min(part.stream.length, end - part.start);
          const rawFrom = part.map[fromNorm];
          const rawTo = part.map[toNorm - 1] + 1;
          const fromFrac = Math.min(1, rawFrom / part.rawLen);
          const toFrac = Math.min(1, rawTo / part.rawLen);
          if (toFrac <= fromFrac) continue;
          const rect = document.createElement("div");
          rect.className = fresh ? "pdf-rect fresh" : "pdf-rect";
          rect.style.left = `${((part.x + part.w * fromFrac) / rec.pageW) * 100}%`;
          rect.style.width = `${((part.w * (toFrac - fromFrac)) / rec.pageW) * 100}%`;
          rect.style.top = `${((rec.pageH - (part.y + part.h * 0.85)) / rec.pageH) * 100}%`;
          rect.style.height = `${((part.h * 1.3) / rec.pageH) * 100}%`;
          rec.el.append(rect);
          painted = true;
        }
        return painted;
      }

      function matchOnPage(rec, needle) {
        const at = rec.stream.indexOf(needle);
        if (at !== -1) {
          return { at, len: needle.length, full: true };
        }
        // Reading order is rebuilt geometrically, but a footnote
        // separator or a running head can still split a long quote.
        // Fall back to the longest contiguous run the page shares with
        // the quote and paint that — partial highlight beats none, and
        // the page-level citation holds either way.
        const run = longestCommonRun(rec.stream, needle);
        const floor = Math.min(80, Math.floor(needle.length * 0.6));
        if (run.len >= floor) {
          return { at: run.atA, len: run.len, full: run.len >= needle.length * 0.9 };
        }
        return null;
      }

      // Longest common contiguous substring of two letter streams —
      // the classic one-row DP; streams here are a few hundred letters.
      function longestCommonRun(a, b) {
        let best = { atA: 0, len: 0 };
        let prev = new Uint16Array(b.length + 1);
        let curr = new Uint16Array(b.length + 1);
        for (let i = 1; i <= a.length; i++) {
          const ai = a.charCodeAt(i - 1);
          for (let j = 1; j <= b.length; j++) {
            curr[j] = ai === b.charCodeAt(j - 1) ? prev[j - 1] + 1 : 0;
            if (curr[j] > best.len) {
              best = { atA: i - curr[j], len: curr[j] };
            }
          }
          const swap = prev;
          prev = curr;
          curr = swap;
        }
        return best;
      }

      async function locatePending() {
        const target = reader.pending;
        if (!target || !reader.pdf) return;
        clearHighlights();
        showReaderNote("");
        const needle = normStream(target.text).slice(0, 1600);
        if (needle.length < 8) {
          reader.pending = null;
          showReaderNote("عبارت برای جست‌وجو کوتاه است.", "error");
          return;
        }
        // Stage 1 — the extracted text index narrows the chunk's page
        // range down to the page(s) that actually hold the quote.
        const first = Math.max(1, target.first);
        const last = Math.min(target.last || first, reader.pageCount);
        let candidates = [];
        let narrowed = false; // true when the index itself found the pages
        const index = await ensurePagesIndex();
        if (index) {
          const from = first || 1;
          const to = last || reader.pageCount;
          for (let n = from; n <= to; n++) {
            if (normalizedPageFromIndex(index, n).includes(needle)) {
              candidates.push(n);
            }
          }
          if (candidates.length) {
            narrowed = true;
          }
          if (!candidates.length && first) {
            // The chunk's page label drifts against the extraction index —
            // recorded live 2026-09-13: a quote labeled 482-484 sat on page
            // 481. Widen ±2 around the labeled range before falling back.
            for (
              let n = Math.max(1, first - 2);
              n <= Math.min(last + 2, reader.pageCount);
              n++
            ) {
              if (normalizedPageFromIndex(index, n).includes(needle)) {
                candidates.push(n);
              }
            }
            if (candidates.length) {
              narrowed = true;
            }
          }
          if (!candidates.length) {
            // Still nothing (a badly drifted label, or none at all): search
            // the whole Book in the index — normalization is cached, this
            // stays cheap. First hit only; a quote lives on one page.
            for (let n = 1; n <= reader.pageCount; n++) {
              if (normalizedPageFromIndex(index, n).includes(needle)) {
                candidates.push(n);
                narrowed = true;
                break;
              }
            }
          }
        }
        if (!candidates.length && first) {
          candidates = [];
          for (let n = first; n <= last; n++) candidates.push(n);
        }
        if (!candidates.length) {
          reader.pending = null;
          showReaderNote(
            "این عبارت در متنِ نمایه‌شدهٔ کتاب پیدا نشد؛ صفحهٔ نخستِ استناد باز می‌ماند.",
            "error"
          );
          return;
        }
        // Stage 2 — the page's reading-order items for the exact bands.
        // Index-narrowed candidates are true positives, three tries
        // enough; a labeled-range fallback (no index, or the quote
        // nowhere in it) tries the WHOLE range — the recorded live
        // complaint was a quote on pages 4-5 of a five-page chunk that
        // never got painted because only the first three were tried.
        const tryList = narrowed ? candidates.slice(0, 3) : candidates.slice(0, 9);
        for (const n of tryList) {
          await gotoPage(n);
          const rec = await ensureRendered(n);
          if (!rec) continue;
          const match = matchOnPage(rec, needle);
          if (match) {
            paintMatch(rec, match.at, match.len, true);
            if (!match.full && match.len < needle.length * 0.7) {
              showReaderNote(
                `بخشی از عبارت در صفحهٔ ${toPersianDigits(n)} برجسته شد.`
              );
            }
            reader.pending = null;
            return;
          }
        }
        // A sentence can straddle a page break: its head ends page p,
        // its tail opens p+1. Split the needle at every offset past a
        // short minimum and look for the two halves back to back.
        for (let pi = 0; pi < candidates.length - 0 && pi < 3; pi++) {
          const p = candidates[pi];
          const q = p + 1;
          const recP = await ensureRendered(p);
          const recQ = await ensureRendered(q);
          if (!recP || !recQ) continue;
          for (let k = 40; k < needle.length - 40; k++) {
            const head = needle.slice(0, k);
            const tail = needle.slice(k);
            if (
              recP.stream.endsWith(head) &&
              recQ.stream.startsWith(tail)
            ) {
              paintMatch(recP, recP.stream.length - head.length, head.length, true);
              paintMatch(recQ, 0, tail.length, true);
              reader.pending = null;
              return;
            }
          }
        }
        await gotoPage(candidates[0]);
        showReaderNote(
          `عبارت در صفحهٔ ${toPersianDigits(candidates[0])} است؛ برجسته‌سازی دقیق آن ممکن نشد.`,
          "error"
        );
        reader.pending = null;
      }

      // ===== The empty state's wiring: Book cards + starter chips. =====
      document.querySelectorAll(".book-card").forEach((card) => {
        card
          .querySelector(".book-select")
          .addEventListener("click", () => startSession(card.dataset.doc));
      });
      document.querySelectorAll(".starter-chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          const card = chip.closest(".book-card");
          startSession(card.dataset.doc, chip.textContent.trim());
        });
      });

      ping();
      refreshUsageLive();

      // The boot (T27 stage 3, GitLab #40): the sidebar lists the
      // Account's Sessions on load — without this a refresh showed an
      // empty list — and the sitting reopens: the tab's own sitting if
      // sessionStorage holds one, else the newest. A refresh returns to
      // the conversation, never to an empty sheet.
      renderSessionList();
      (async () => {
        try {
          const res = await fetch("/sessions", { cache: "no-store" });
          if (!res.ok) return;
          const rows = (await res.json()).sessions || [];
          if (!rows.length) return;
          let stored = null;
          try {
            stored = sessionStorage.getItem("storeSessionId");
          } catch {}
          const target =
            rows.find((row) => String(row.id) === stored) || rows[0];
          if (!sessionState.active) openStoreSession(target.id);
        } catch {}
      })();
    </script>
    <script>
      // The profile (T24, GitLab #27): one self-contained block. The
      // toggle refetches /profile/data every time the section opens —
      // the Balance and the open Session move while the shell sits
      // open — and the render computes no Toman of its own: the
      // numbers, the Session grouping, and each entry's honesty badge
      // (اندازه‌گیری‌شده / تخمینی, the DRAFT server constants) all
      // ride the payload, so the sheet can never dress an estimate up
      // as a measurement. The kind labels below are the ledger's
      // recorded kinds in plain Farsi — DRAFT, pending PM approval
      // (CONTEXT.md's naming discipline, 2026-09-19).
      (function () {
        const toggleBtn = document.getElementById("profile-toggle");
        const section = document.getElementById("profile");
        const numbersEl = document.getElementById("profile-numbers");
        const sessionsEl = document.getElementById("profile-sessions");
        if (!toggleBtn || !section || !numbersEl || !sessionsEl) return;

        const KIND_LABELS = {
          ask: "پرسش",
          picker: "گزینش",
          writer: "پاسخ استنادی",
          composer: "جست‌وجوی بیشتر",
          turn: "نوبت پژوهش",
        };
        const toman = (n) => (n || 0).toLocaleString("fa-IR");
        const faTs = (ts) =>
          String(ts || "").replace(/[0-9]/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);

        function renderProfile(data) {
          // The simplified profile (the operator's call, 2026-09-22):
          // credit remaining and the ongoing session — nothing else.
          // The spend history stays in the ledger where the console
          // reads it; the sheet never re-dumps it.
          const heroLabel = document.createElement("span");
          heroLabel.className = "profile-hero-label";
          heroLabel.textContent = "اعتبار";
          const balance = document.createElement("span");
          balance.className = "profile-balance";
          balance.textContent = toman(data.balance_toman) + " تومان";
          numbersEl.replaceChildren(heroLabel, balance);
          const sessions = Array.isArray(data.sessions) ? data.sessions : [];
          sessionsEl.replaceChildren();
          const open = sessions.length ? sessions[0] : null;
          if (!open) {
            const empty = document.createElement("p");
            empty.className = "empty";
            empty.textContent = "نشست جاری باز نیست.";
            sessionsEl.append(empty);
            return;
          }
          const row = document.createElement("div");
          row.className = "profile-ongoing";
          const label = document.createElement("span");
          label.textContent = "نشست جاری";
          const startedMs = Date.parse(String(open.started || ""));
          let elapsed = "";
          if (Number.isFinite(startedMs)) {
            const minutes = Math.max(
              0,
              Math.round((Date.now() - startedMs) / 60000)
            );
            elapsed =
              (minutes >= 60
                ? Math.floor(minutes / 60).toLocaleString("fa-IR") +
                  " ساعت و " +
                  (minutes % 60).toLocaleString("fa-IR")
                : minutes.toLocaleString("fa-IR")) + " دقیقه · ";
          }
          const detail = document.createElement("span");
          detail.className = "profile-ongoing-detail";
          detail.textContent = elapsed + toman(open.cost_toman) + " تومان";
          row.append(label, detail);
          sessionsEl.append(row);
        }

        async function refreshProfile() {
          try {
            const res = await fetch("/profile/data", { cache: "no-store" });
            if (!res.ok) {
              numbersEl.textContent = "پروفایل بارگیری نشد.";
              sessionsEl.replaceChildren();
              return;
            }
            renderProfile(await res.json());
          } catch (_) {
            numbersEl.textContent = "ارتباط با سرویس قطع شد.";
          }
        }

        toggleBtn.addEventListener("click", function () {
          const open = section.hidden;
          section.hidden = !open;
          toggleBtn.setAttribute("aria-expanded", String(open));
          if (open) refreshProfile();
        });

        // The Admin's door: /auth/me names the role on load; only the
        // admin's topbar carries «میز مدیریت» (ADR-0013's role). A 401
        // (anonymous) or any miss keeps the link hidden — the overlay
        // gate owns the not-logged-in case.
        fetch("/auth/me", { cache: "no-store" })
          .then((res) => (res.ok ? res.json() : null))
          .then((me) => {
            if (me && me.role === "admin") {
              const link = document.getElementById("admin-link");
              if (link) link.hidden = false;
            }
          })
          .catch(() => {});
      })();
    </script>
  </body>
</html>
