services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: chat-with-books-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cognee
      POSTGRES_PASSWORD: cognee
      POSTGRES_DB: cognee_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognee -d cognee_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cognee-network

  cognee:
    image: cognee/cognee:main
    container_name: chat-with-books-cognee
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: cognee
      DB_PASSWORD: cognee
      DB_NAME: cognee_db
      DB_PROVIDER: postgres
      VECTOR_DB_PROVIDER: pgvector
      GRAPH_DATABASE_PROVIDER: postgres_demo
      CACHE_BACKEND: postgres
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      LLM_PROVIDER: custom
      LLM_MODEL: openai/glm-5.3-flash
      LLM_ENDPOINT: https://api.z.ai/api/coding/paas/v4
      EMBEDDING_PROVIDER: openai_compatible
      EMBEDDING_MODEL: text-embedding-3-large
      EMBEDDING_ENDPOINT: https://api.avalai.ir/v1
      EMBEDDING_DIMENSIONS: "3072"
      EMBEDDING_BATCH_SIZE: "32"
      EMBEDDING_RATE_LIMIT_ENABLED: "true"
      EMBEDDING_RATE_LIMIT_REQUESTS: "120"
      EMBEDDING_RATE_LIMIT_INTERVAL: "60"
      LLM_RATE_LIMIT_ENABLED: "true"
      LLM_RATE_LIMIT_REQUESTS: "240"
      LLM_RATE_LIMIT_INTERVAL: "60"
      LLM_MIN_RETRY_ATTEMPTS: "6"
      LLM_MIN_RETRY_SECONDS: "1800"
      LLM_EXTRACTION_PROVIDER: custom
      LLM_EXTRACTION_MODEL: openai/glm-5.3-flash
      LLM_EXTRACTION_ENDPOINT: https://api.avalai.ir/v1
      LLM_EXTRACTION_API_KEY: ${EMBEDDING_API_KEY}
      LLM_SUMMARIZATION_PROVIDER: custom
      LLM_SUMMARIZATION_MODEL: openai/glm-5.3-flash
      LLM_SUMMARIZATION_ENDPOINT: https://api.avalai.ir/v1
      LLM_SUMMARIZATION_API_KEY: ${EMBEDDING_API_KEY}
      LLM_ANSWER_STREAMING: "true"
    volumes:
      - cognee_data:/cognee-storage/data
      - cognee_system:/cognee-storage/system
      - ./docker/enable_farsi_evidence.py:/enable_farsi_evidence.py:ro
    entrypoint: ["python", "/enable_farsi_evidence.py"]
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cognee-network

  cognee-next-tier:
    image: cognee/cognee:main
    container_name: chat-with-books-cognee-next-tier
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cognee:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: cognee
      DB_PASSWORD: cognee
      DB_NAME: cognee_db
      DB_PROVIDER: postgres
      VECTOR_DB_PROVIDER: pgvector
      GRAPH_DATABASE_PROVIDER: postgres_demo
      CACHE_BACKEND: postgres
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      LLM_PROVIDER: custom
      LLM_MODEL: openai/glm-5.3
      LLM_ENDPOINT: https://api.z.ai/api/coding/paas/v4
      EMBEDDING_PROVIDER: openai_compatible
      EMBEDDING_MODEL: text-embedding-3-large
      EMBEDDING_ENDPOINT: https://api.avalai.ir/v1
      EMBEDDING_DIMENSIONS: "3072"
      EMBEDDING_BATCH_SIZE: "8"
      EMBEDDING_RATE_LIMIT_ENABLED: "true"
      EMBEDDING_RATE_LIMIT_REQUESTS: "8"
      EMBEDDING_RATE_LIMIT_INTERVAL: "60"
      LLM_RATE_LIMIT_ENABLED: "true"
      LLM_RATE_LIMIT_REQUESTS: "60"
      LLM_RATE_LIMIT_INTERVAL: "60"
      LLM_MIN_RETRY_ATTEMPTS: "6"
      LLM_MIN_RETRY_SECONDS: "1800"
    volumes:
      - cognee_data:/cognee-storage/data
      - cognee_system:/cognee-storage/system
      - ./docker/enable_farsi_evidence.py:/enable_farsi_evidence.py:ro
    entrypoint: ["python", "/enable_farsi_evidence.py"]
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cognee-network

  session:
    build: ./ui
    image: chat-with-books-session:latest
    container_name: chat-with-books-session
    profiles:
      - session
    restart: unless-stopped
    depends_on:
      cognee:
        condition: service_healthy
      cognee-next-tier:
        condition: service_healthy
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      COGNEE_URL: http://cognee:8000
      # The next-tier service listens on its CONTAINER port 8000 — 8001 is
      # only the host publish.
      NEXT_TIER_URL: http://cognee-next-tier:8000
      # A Next-tier search can pass ten minutes; the relay waits on its
      # own leash (serve.py default 1200s).
      NEXT_TIER_TIMEOUT: ${NEXT_TIER_TIMEOUT:-1200}
      SESSION_UI_HOST: 0.0.0.0
      SESSION_UI_PORT: "8765"
      SESSION_UI_QUOTA_DB: /data/usage.sqlite3
    volumes:
      - session_quota:/data
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/livez')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cognee-network

  frontend:
    image: cognee/cognee-ui:latest
    container_name: chat-with-books-ui
    profiles:
      - ui
    restart: unless-stopped
    environment:
      COGNEE_BACKEND_URL: ${COGNEE_BACKEND_URL:-}
    depends_on:
      cognee:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - cognee-network

networks:
  cognee-network:
    name: chat-with-books

volumes:
  postgres_data:
  cognee_data:
  cognee_system:
  session_quota:
