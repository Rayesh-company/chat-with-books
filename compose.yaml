services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: chat-with-books-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cognee
      POSTGRES_PASSWORD: cognee
      POSTGRES_DB: cognee_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognee -d cognee_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cognee-network

  cognee:
    image: cognee/cognee:main
    container_name: chat-with-books-cognee
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: cognee
      DB_PASSWORD: cognee
      DB_NAME: cognee_db
      DB_PROVIDER: postgres
      VECTOR_DB_PROVIDER: pgvector
      GRAPH_DATABASE_PROVIDER: postgres_demo
      CACHE_BACKEND: postgres
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      LLM_PROVIDER: custom
      LLM_MODEL: openai/glm-5.3-flash
      # Chat routes through AvalAI since 2026-09-13 — the Z.AI coding-plan
      # weekly quota was exhausted (error 1310, reset 2026-09-15 17:06).
      # AvalAI carries the GLM family; the key rides .env as LLM_API_KEY.
      LLM_ENDPOINT: https://api.avalai.ir/v1
      EMBEDDING_PROVIDER: openai_compatible
      # The embedder is frozen into the ingested pgvector tables — a
      # stack whose data predates ADR 0004 pins small/1536 in .env
      # (README, VPS deploy).
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_ENDPOINT: https://api.avalai.ir/v1
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-"3072"}
      EMBEDDING_BATCH_SIZE: "32"
      EMBEDDING_RATE_LIMIT_ENABLED: "true"
      EMBEDDING_RATE_LIMIT_REQUESTS: "120"
      EMBEDDING_RATE_LIMIT_INTERVAL: "60"
      LLM_RATE_LIMIT_ENABLED: "true"
      LLM_RATE_LIMIT_REQUESTS: "240"
      LLM_RATE_LIMIT_INTERVAL: "60"
      LLM_MIN_RETRY_ATTEMPTS: "6"
      LLM_MIN_RETRY_SECONDS: "1800"
      LLM_EXTRACTION_PROVIDER: custom
      LLM_EXTRACTION_MODEL: openai/glm-5.3-flash
      LLM_EXTRACTION_ENDPOINT: https://api.avalai.ir/v1
      LLM_EXTRACTION_API_KEY: ${EMBEDDING_API_KEY}
      LLM_SUMMARIZATION_PROVIDER: custom
      LLM_SUMMARIZATION_MODEL: openai/glm-5.3-flash
      LLM_SUMMARIZATION_ENDPOINT: https://api.avalai.ir/v1
      LLM_SUMMARIZATION_API_KEY: ${EMBEDDING_API_KEY}
      LLM_ANSWER_STREAMING: "true"
    volumes:
      - cognee_data:/cognee-storage/data
      - cognee_system:/cognee-storage/system
      - ./docker/enable_farsi_evidence.py:/enable_farsi_evidence.py:ro
    entrypoint: ["python", "/enable_farsi_evidence.py"]
    ports:
      - "18000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cognee-network

  cognee-next-tier:
    image: cognee/cognee:main
    container_name: chat-with-books-cognee-next-tier
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cognee:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: cognee
      DB_PASSWORD: cognee
      DB_NAME: cognee_db
      DB_PROVIDER: postgres
      VECTOR_DB_PROVIDER: pgvector
      GRAPH_DATABASE_PROVIDER: postgres_demo
      CACHE_BACKEND: postgres
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      LLM_PROVIDER: custom
      LLM_MODEL: openai/glm-5.3-flash
      # Same AvalAI routing as cognee (2026-09-13, quota exhaustion).
      LLM_ENDPOINT: https://api.avalai.ir/v1
      EMBEDDING_PROVIDER: openai_compatible
      # The embedder is frozen into the ingested pgvector tables — a
      # stack whose data predates ADR 0004 pins small/1536 in .env
      # (README, VPS deploy).
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_ENDPOINT: https://api.avalai.ir/v1
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-"3072"}
      EMBEDDING_BATCH_SIZE: "8"
      EMBEDDING_RATE_LIMIT_ENABLED: "true"
      EMBEDDING_RATE_LIMIT_REQUESTS: "8"
      EMBEDDING_RATE_LIMIT_INTERVAL: "60"
      LLM_RATE_LIMIT_ENABLED: "true"
      LLM_RATE_LIMIT_REQUESTS: "60"
      LLM_RATE_LIMIT_INTERVAL: "60"
      LLM_MIN_RETRY_ATTEMPTS: "6"
      LLM_MIN_RETRY_SECONDS: "1800"
    volumes:
      - cognee_data:/cognee-storage/data
      - cognee_system:/cognee-storage/system
      - ./docker/enable_farsi_evidence.py:/enable_farsi_evidence.py:ro
    entrypoint: ["python", "/enable_farsi_evidence.py"]
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cognee-network

  session:
    build: ./ui
    image: chat-with-books-session:latest
    container_name: chat-with-books-session
    profiles:
      - session
    restart: unless-stopped
    depends_on:
      cognee:
        condition: service_healthy
      cognee-next-tier:
        condition: service_healthy
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      # The composer (picker, phase-2 writer, dive calls) builds its URL
      # from LLM_ENDPOINT — routed to AvalAI with the services above
      # (2026-09-13, Z.AI quota exhaustion). Its default fallback in
      # composer.py stays the Z.AI coding endpoint.
      LLM_ENDPOINT: https://api.avalai.ir/v1
      LLM_MODEL: ${LLM_MODEL:-openai/glm-5.3-flash}
      COGNEE_URL: http://cognee:8000
      # The next-tier service listens on its CONTAINER port 8000 — 8001 is
      # only the host publish.
      NEXT_TIER_URL: http://cognee-next-tier:8000
      # A Next-tier search can pass ten minutes; the relay waits on its
      # own leash (serve.py default 1200s).
      NEXT_TIER_TIMEOUT: ${NEXT_TIER_TIMEOUT:-1200}
      SESSION_UI_HOST: 0.0.0.0
      SESSION_UI_PORT: "8765"
      SESSION_UI_QUOTA_DB: /data/usage.sqlite3
      # The Account store (ADR-0013) persists beside the quota counts on
      # the same volume — a container rebuild must not throw the issued
      # Accounts away.
      ACCOUNTS_DB: /data/accounts.sqlite3
      # The login tokens are signed with AUTH_SECRET (ADR-0013); it rides
      # the compose-only .env like the keys above — unset, the server
      # generates a per-process secret and warns that a restart logs
      # every Account out.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Research Mode's sessions persist beside the quota counts on the
      # same volume (ADR-0008) — a container rebuild must not throw an
      # in-progress investigation away.
      SESSION_RESEARCH_DB: /data/research.sqlite3
      # The usage ledger (T22, GitLab #24): the Account's spend entries on
      # the same persisted volume, and the tariff dials — Toman per million
      # tokens, config-held so a price change is an .env edit + restart,
      # never a code deploy. The defaults are the PM's starting numbers.
      LEDGER_DB: /data/usage_ledger.sqlite3
      TARIFF_INPUT_TOMAN_PER_MTOK: ${TARIFF_INPUT_TOMAN_PER_MTOK:-20000}
      TARIFF_OUTPUT_TOMAN_PER_MTOK: ${TARIFF_OUTPUT_TOMAN_PER_MTOK:-80000}
      # The admin audit log (T25, GitLab #26): the append-only record of
      # the Admin's actions, on the same persisted volume — an audit
      # that evaporates on a container rebuild is not an audit.
      AUDIT_DB: /data/audit.sqlite3
      # The first Admin from config (T26, GitLab #28): the bootstrap
      # seed command is retired — the deployment plants the PM's
      # Account once at startup, audited, and a restart never touches a
      # standing Admin. Set both in the compose-only .env; leave them
      # unset and the server comes up with no Admin, refusing every
      # console and issuance path until the PM plants one.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The Session store (T27 stage 3, GitLab #40): the Accounts' نشست
      # history on the same persisted volume — a container rebuild must
      # not throw a sitting's transcript away.
      SESSIONS_DB: /data/sessions.sqlite3
      # The ask chat store (ADR-0014): the reload's restore row -
      # question, pool, Quote selection, Quoted answer - on the same
      # persisted volume, beside the research store it mirrors.
      SESSION_CHAT_DB: /data/chats.sqlite3
      # The Notebook store (the selection map, ticket 08): the
      # researcher's یادداشت‌ها on the same persisted volume — without
      # this the notes land in /app inside the container and every
      # image rebuild throws them away.
      NOTES_DB: /data/notes.sqlite3
      # The Ticket store (the ticket-system map, 2026-10-05): reported
      # problems and their reply threads, with the image attachments in
      # /data/ticket_files beside the DB — the same persisted volume, so
      # a rebuild never throws a report away.
      TICKETS_DB: /data/tickets.sqlite3
    volumes:
      - session_quota:/data
      # The Book set's PDFs + page indexes (ADR-0007), served by
      # serve.py's /books routes. Default BOOKS_DIR resolves to /books —
      # ui/serve.py's parent — so the mount point matches the dev layout.
      - ./books:/books:ro
      # The page rasters' disk cache (ADR-0017): the render-cache bind
      # sits beside the books mount exactly where serve.py's default
      # BOOKS_DIR/../render-cache resolves, so a rebuild never re-renders
      # the pages a visitor already paid the wait for.
      - ./render-cache:/render-cache
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/livez')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cognee-network

  frontend:
    image: cognee/cognee-ui:latest
    container_name: chat-with-books-ui
    profiles:
      - ui
    restart: unless-stopped
    environment:
      COGNEE_BACKEND_URL: ${COGNEE_BACKEND_URL:-}
    depends_on:
      cognee:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - cognee-network

networks:
  cognee-network:
    name: chat-with-books

volumes:
  postgres_data:
  cognee_data:
  cognee_system:
  session_quota:
